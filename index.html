<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evade Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      touch-action: none;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      border: 1px solid #444;
    }
    #player {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 3rem;
      user-select: none;
    }
    .object {
      position: absolute;
      width: 40px;
      height: 40px;
      background-color: red;
      border-radius: 50%;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="player">⛹️</div>
  </div>

  <script>
    const game  = document.getElementById("game");
    const player = document.getElementById("player");
    const objects = [];
    const speed = 4;          // object speed
    const playerSpeed = 20;   // px per move
    let sw = window.innerWidth;
    let sh = window.innerHeight;

    let playerX = sw / 2 - 20;
    let playerY = sh / 2 - 20;
    let touchStartX = 0;
    let touchStartY = 0;

    // resize handler
    function updateSize() {
      sw = window.innerWidth;
      sh = window.innerHeight;
    }
    window.addEventListener("resize", updateSize);
    updateSize();

    // place player
    function renderPlayer() {
      player.style.left = playerX + "px";
      player.style.top  = playerY + "px";
    }
    renderPlayer();

    // move player by left/right/up/down swipe
    function movePlayer(dx, dy) {
      playerX = Math.max(0, Math.min(sw - 40, playerX + dx));
      playerY = Math.max(0, Math.min(sh - 40, playerY + dy));
      renderPlayer();
    }

    // touch start
    game.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      e.preventDefault();
    });

    // touch end → detect slide direction
    game.addEventListener("touchend", (e) => {
      if (!e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchStartX;
      const diffY = t.clientY - touchStartY;
      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);

      if (absX > 20 || absY > 20) {
        if (absX > absY) {
          movePlayer(diffX > 0 ? playerSpeed : -playerSpeed, 0);
        } else {
          movePlayer(0, diffY > 0 ? playerSpeed : -playerSpeed);
        }
      }
    });

    // create a moving object
    function spawnObject() {
      const obj = document.createElement("div");
      obj.className = "object";
      game.appendChild(obj);

      const side = Math.floor(Math.random() * 4); // 0=top,1=right,2=bottom,3=left
      let x, y, vx = 0, vy = 0;

      if (side === 0) {      // from top
        x = Math.random() * sw;
        y = -40;
        vy = speed;
      } else if (side === 1) { // from right
        x = sw;
        y = Math.random() * sh;
        vx = -speed;
      } else if (side === 2) { // from bottom
        x = Math.random() * sw;
        y = sh;
        vy = -speed;
      } else {               // from left
        x = -40;
        y = Math.random() * sh;
        vx = speed;
      }

      obj.style.left = x + "px";
      obj.style.top  = y + "px";

      const objData = { el: obj, x, y, vx, vy };
      objects.push(objData);
    }

    // check collision with player
    function isCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
      return x1 < x2 + w2 &&
             x1 + w1 > x2 &&
             y1 < y2 + h2 &&
             y1 + h1 > y2;
    }

    // game loop
    function gameLoop() {
      // move objects
      for (let i = objects.length - 1; i >= 0; i--) {
        const o = objects[i];
        o.x += o.vx;
        o.y += o.vy;
        o.el.style.left = o.x + "px";
        o.el.style.top  = o.y + "px";

        // remove if off screen
        if (o.x < -40 || o.x > sw || o.y < -40 || o.y > sh) {
          game.removeChild(o.el);
          objects.splice(i, 1);
        }
      }

      // check collisions
      for (const o of objects) {
        if (isCollision(o.x, o.y, 40, 40, playerX, playerY, 40, 40)) {
          clearInterval(interval);
          alert("Game Over! You hit an object.");
          break;
        }
      }

      // occasionally spawn new object
      if (Math.random() < 0.02) {
        spawnObject();
      }
    }

    let interval = setInterval(gameLoop, 20);
  </script>
</body>
</html>
