<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Talks - Social Home</title>
    <style>
        :root {
            --primary: #6d5dfc;
            --bg: #f0f2f5;
            --white: #ffffff;
            --text: #2d3436;
            --accent: #e17055;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .app-container { max-width: 800px; margin: 0 auto; padding-bottom: 70px; }

        /* Navigation */
        nav { background: var(--primary); padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 100; color: white; }
        nav span { cursor: pointer; font-weight: bold; }

        /* Auth Section */
        #auth-section { text-align: center; padding: 50px; background: white; height: 100vh; }
        .input-group { margin: 10px 0; }
        input, textarea { padding: 10px; width: 80%; border-radius: 8px; border: 1px solid #ddd; }

        /* Room Containers */
        .room { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .room.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* User UI Components */
        .visitor-card { display: inline-block; text-align: center; margin: 10px; padding: 10px; background: white; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 80px; }
        .profile-pic { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .profile-note { font-size: 10px; background: #ffeaa7; padding: 2px; border-radius: 4px; position: absolute; margin-top: -10px; }

        /* Post Styles */
        .post { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; position: relative; }
        .post-header { display: flex; align-items: center; gap: 10px; font-weight: bold; margin-bottom: 10px; }
        .post-img { width: 100%; border-radius: 8px; margin: 10px 0; }
        .post-time { font-size: 11px; color: #888; }

        /* Bedroom Styles */
        .bedroom-content { background: #2d3436; color: white; padding: 20px; border-radius: 15px; min-height: 300px; }
        .secret-item { background: #444; padding: 10px; margin: 5px 0; border-radius: 5px; }

        /* Footer Menu */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 800px; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Auth Section -->
    <div id="auth-section">
        <h1>🏠 House Talks</h1>
        <div class="input-group"><input type="text" id="user-name" placeholder="Enter Full Name"></div>
        <div class="input-group"><input type="text" id="user-pic" placeholder="Profile Picture URL"></div>
        <div class="input-group"><input type="email" id="user-email" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="user-password" placeholder="Password"></div>
        <button onclick="handleSignUp()" style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px;">Enter House</button>
    </div>

    <!-- App Content (Hidden until Login) -->
    <div id="main-app" style="display: none;">
        <nav>
            <span onclick="showRoom('sitting-room')">Sitting Room</span>
            <span onclick="showRoom('outside')">Outside</span>
            <span onclick="showRoom('bedroom')">Bedroom 🛏️</span>
        </nav>

        <!-- Sitting Room -->
        <div id="sitting-room" class="room active">
            <h3>Visitors</h3>
            <div id="visitors-list"></div>
            <hr>
            <h3>General Chat</h3>
            <div id="chat-messages" style="height: 300px; overflow-y: auto; background: white; padding: 10px; border-radius: 10px;"></div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Say something...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>

        <!-- Outside -->
        <div id="outside" class="room">
            <div style="background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <textarea id="post-text" placeholder="What's happening outside?"></textarea>
                <input type="text" id="post-img-url" placeholder="Image URL (optional)">
                <button onclick="createPost()">Post Publicly</button>
            </div>
            <div id="outside-feed"></div>
        </div>

        <!-- Bedroom -->
        <div id="bedroom" class="room">
            <div id="bedroom-lock">
                <h3>Private Space</h3>
                <input type="password" id="bedroom-pass-input" placeholder="Enter Bedroom Password">
                <button onclick="unlockBedroom()">Unlock</button>
            </div>
            <div id="bedroom-vault" style="display: none;">
                <div class="bedroom-content">
                    <h3>My Secrets & Memories</h3>
                    <div id="secrets-list"></div>
                    <textarea id="secret-input" placeholder="Write a secret..."></textarea>
                    <button onclick="saveSecret()">Save Secret</button>
                    <hr>
                    <div id="bedroom-gallery"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com";
    import { getDatabase, ref, set, push, onValue, serverTimestamp } from "https://www.gstatic.com";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com";

    const firebaseConfig = {
        apiKey: "AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",
        authDomain: "zeeworldyhi.firebaseapp.com",
        databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com",
        projectId: "zeeworldyhi",
        storageBucket: "zeeworldyhi.firebasestorage.app",
        messagingSenderId: "154414924399",
        appId: "1:154414924399:web:31c3767fdbea93feba439a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null;

    // --- Authentication ---
    window.handleSignUp = async () => {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-password').value;
        const name = document.getElementById('user-name').value;
        const pic = document.getElementById('user-pic').value;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;
            await set(ref(db, 'users/' + user.uid), {
                name: name,
                photo: pic,
                mood: "Happy",
                note: "Just joined!"
            });
            // Add to Visitors section
            push(ref(db, 'visitors'), { uid: user.uid, name: name, photo: pic });
            alert("Welcome to the House!");
        } catch (error) {
            alert(error.message);
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            loadVisitors();
            loadPosts();
            loadChats();
        }
    });

    // --- Navigation ---
    window.showRoom = (roomId) => {
        document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
        document.getElementById(roomId).classList.add('active');
    };

    // --- Sitting Room Logic ---
    function loadVisitors() {
        onValue(ref(db, 'visitors'), (snapshot) => {
            const list = document.getElementById('visitors-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="visitor-card">
                        <img src="${data.photo}" class="profile-pic">
                        <div style="font-size:10px">${data.name}</div>
                    </div>`;
            });
        });
    }

    window.sendChat = () => {
        const text = document.getElementById('chat-input').value;
        if(!text) return;
        push(ref(db, 'chat'), {
            uid: currentUser.uid,
            text: text,
            timestamp: serverTimestamp()
        });
        document.getElementById('chat-input').value = '';
    };

    function loadChats() {
        onValue(ref(db, 'chat'), (snapshot) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            snapshot.forEach(c => {
                const m = c.val();
                box.innerHTML += `<div><strong>User:</strong> ${m.text}</div>`;
            });
        });
    }

    // --- Outside Logic ---
    window.createPost = () => {
        const text = document.getElementById('post-text').value;
        const img = document.getElementById('post-img-url').value;
        push(ref(db, 'outside'), {
            author: currentUser.uid,
            content: text,
            image: img,
            time: new Date().toLocaleString()
        });
        alert("Posted!");
    };

    function loadPosts() {
        onValue(ref(db, 'outside'), (snapshot) => {
            const feed = document.getElementById('outside-feed');
            feed.innerHTML = '';
            snapshot.forEach(p => {
                const post = p.val();
                feed.innerHTML += `
                    <div class="post">
                        <div class="post-header">👤 Visitor</div>
                        <div class="post-time">${post.time}</div>
                        <p>${post.content}</p>
                        ${post.image ? `<img src="${post.image}" class="post-img">` : ''}
                        <button onclick="alert('Visiting Profile...')">Visit</button>
                    </div>`;
            });
        });
    }

    // --- Bedroom Logic ---
    window.unlockBedroom = () => {
        const pass = document.getElementById('bedroom-pass-input').value;
        if(pass === "1234") { // Simplified for demo
            document.getElementById('bedroom-lock').style.display = 'none';
            document.getElementById('bedroom-vault').style.display = 'block';
            loadSecrets();
        } else {
            alert("Wrong Password!");
        }
    };

    window.saveSecret = () => {
        const secret = document.getElementById('secret-input').value;
        push(ref(db, `bedrooms/${currentUser.uid}/secrets`), secret);
        document.getElementById('secret-input').value = '';
    };

    function loadSecrets() {
        onValue(ref(db, `bedrooms/${currentUser.uid}/secrets`), (snapshot) => {
            const list = document.getElementById('secrets-list');
            list.innerHTML = '';
            snapshot.forEach(s => {
                list.innerHTML += `<div class="secret-item">🤫 ${s.val()}</div>`;
            });
        });
    }

</script>
</body>
          </html>
