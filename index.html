<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faith Stories App</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",
            authDomain: "zeeworldyhi.firebaseapp.com",
            databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com",
            projectId: "zeeworldyhi",
            storageBucket: "zeeworldyhi.firebasestorage.app",
            messagingSenderId: "154414924399",
            appId: "1:154414924399:web:31c3767fdbea93feba439a",
            measurementId: "G-XD5Z8T76EE"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Function to sign up a new user
        function signUp() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("User signed up successfully!");
                })
                .catch((error) => {
                    alert(error.message);
                });
        }

        // Function to log in an existing user
        function logIn() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("User logged in successfully!");
                    loadStories();
                })
                .catch((error) => {
                    alert(error.message);
                });
        }

        // Function to submit a new story
        function submitStory() {
            const storyTitle = document.getElementById("storyTitle").value;
            const storyContent = document.getElementById("storyContent").value;

            const userId = auth.currentUser.uid;
            const storyData = {
                title: storyTitle,
                content: storyContent,
                userId: userId,
                timestamp: Date.now()
            };

            database.ref('stories/').push(storyData)
                .then(() => {
                    alert("Story submitted successfully!");
                    loadStories();
                })
                .catch((error) => {
                    alert(error.message);
                });
        }

        // Function to load stories from the database
        function loadStories() {
            database.ref('stories/').on('value', (snapshot) => {
                const storiesContainer = document.getElementById("storiesContainer");
                storiesContainer.innerHTML = ""; // Clear existing stories
                snapshot.forEach((childSnapshot) => {
                    const story = childSnapshot.val();
                    const storyElement = document.createElement("div");
                    storyElement.innerHTML = `<h3>${story.title}</h3><p>${story.content}</p>`;
                    storiesContainer.appendChild(storyElement);
                });
            });
        }

        // Function to sign out the user
        function signOut() {
            auth.signOut().then(() => {
                alert("User signed out successfully!");
                document.getElementById("storiesContainer").innerHTML = ""; // Clear stories on sign out
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Faith Stories App</h1>
        
        <div id="authContainer">
            <h2>Sign Up / Log In</h2>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button onclick="signUp()">Sign Up</button>
            <button onclick="logIn()">Log In</button>
            <button onclick="signOut()">Sign Out</button>
        </div>

        <div id="storySubmissionContainer" style="display:none;">
            <h2>Submit a Story</h2>
            <input type="text" id="storyTitle" placeholder="Story Title" required>
            <textarea id="storyContent" placeholder="Write your story here..." required></textarea>
            <button onclick="submitStory()">Submit Story</button>
        </div>

        <div id="storiesContainer">
            <h2>Stories</h2>
            <!-- Stories will be loaded here -->
        </div>
    </div>

    <script>
        // Monitor authentication state
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("storySubmissionContainer").style.display = "block";
                loadStories();
            } else {
                document.getElementById("storySubmissionContainer").style.display = "none";
            }
        });
    </script>
</body>
</html>
