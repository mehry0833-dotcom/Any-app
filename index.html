<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Talks 🗨️</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#032B44;color:#fff}
.screen{display:none;padding:20px;padding-top:60px}
.active{display:block}
.chat-msg{margin:10px 0;padding:10px;border-radius:8px;max-width:70%}
.sent{background:#00BFFF;margin-left:auto}
.received{background:#1E90FF}
.status-post{margin:10px 0;padding:10px;background:#05386B;border-radius:8px}
.nav{position:fixed;top:0;left:0;width:100%;background:#021c2e;padding:10px;text-align:center;z-index:10}
.nav button{background:#1E90FF;color:#fff;border:none;padding:8px 12px;border-radius:20px;margin:3px;cursor:pointer}
img{max-width:100%;border-radius:6px;margin-top:5px}
audio{width:100%;margin-top:5px}
#welcome-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;color:#fff;display:flex;justify-content:center;align-items:center;font-size:24px;z-index:20}
</style>
</head>
<body>

<div id="welcome-screen">Welcome to House Talks! Loading...</div>

<div class="nav">
<button onclick="showScreen('home')">🏠</button>
<button onclick="showScreen('chats')">💬</button>
<button onclick="showScreen('status')">🎵</button>
<button onclick="showScreen('posts')">📝</button>
<button onclick="showScreen('pictures')">🖼️</button>
<button onclick="showScreen('happy')">😊</button>
</div>

<div id="home-screen" class="screen active">
<h2>Welcome to House Talks</h2>
<p>All features working. Explore freely.</p>
</div>

<div id="chats-screen" class="screen">
<h2>Chats</h2>
<input id="name-input" placeholder="Enter your name">
<button onclick="setName()">Save</button><br><br>
<input id="msg-input" placeholder="Message">
<input type="file" id="chat-image" accept="image/*">
<input type="file" id="chat-audio" accept="audio/*">
<button onclick="sendMsg()">Send</button>
<button onclick="clearChats()">Clear</button>
<div id="chat-log"></div>
</div>

<div id="status-screen" class="screen">
<h2>Status</h2>
<input id="status-input" placeholder="What's up?">
<input type="file" id="status-image" accept="image/*">
<input type="file" id="status-music" accept="audio/*">
<button onclick="postStatus()">Post</button>
<div id="status-log"></div>
</div>

<div id="posts-screen" class="screen">
<h2>Posts</h2>
<input id="post-input" placeholder="Share something">
<input type="file" id="post-image" accept="image/*">
<button onclick="post()">Post</button>
<div id="post-log"></div>
</div>

<div id="pictures-screen" class="screen">
<h2>All Pictures</h2>
<div id="pics-log"></div>
</div>

<div id="happy-screen" class="screen">
<h2>Happy Zone</h2>
<input id="happy-input" placeholder="What makes you happy?">
<input type="file" id="happy-image" accept="image/*">
<button onclick="postHappy()">Post</button>
<div id="happy-log"></div>
</div>

<script>
let name=localStorage.getItem('name')||''
let chats=JSON.parse(localStorage.getItem('chats'))||[]
let statuses=JSON.parse(localStorage.getItem('statuses'))||[]
let posts=JSON.parse(localStorage.getItem('posts'))||[]
let happyPosts=JSON.parse(localStorage.getItem('happyPosts'))||[]

setTimeout(()=>{document.getElementById('welcome-screen').style.display='none'},2000)

function showScreen(s){
document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'))
document.getElementById(s+'-screen').classList.add('active')
if(s==='chats')loadChats()
if(s==='status')loadStatuses()
if(s==='posts')loadPosts()
if(s==='pictures')loadPics()
if(s==='happy')loadHappy()
}

function setName(){
name=document.getElementById('name-input').value
localStorage.setItem('name',name)
}

function sendMsg(){
if(!name)return alert('Enter name first')
let msg=document.getElementById('msg-input').value
let img=document.getElementById('chat-image').files[0]
let audio=document.getElementById('chat-audio').files[0]
if(!msg&&!img&&!audio)return
chats.push({from:name,msg,img:img?URL.createObjectURL(img):null,audio:audio?URL.createObjectURL(audio):null,time:new Date().toLocaleTimeString()})
localStorage.setItem('chats',JSON.stringify(chats))
document.getElementById('msg-input').value=''
loadChats()
}

function loadChats(){
let log=document.getElementById('chat-log')
log.innerHTML=''
chats.forEach((c,i)=>{
log.innerHTML+=`<div class="chat-msg ${c.from===name?'sent':'received'}">
<b>${c.from}</b><br>${c.msg||''}
${c.img?`<img src="${c.img}">`:''}
${c.audio?`<audio controls src="${c.audio}"></audio>`:''}
<br><small>${c.time}</small><br>
<button onclick="deleteChat(${i})">Delete</button>
<button onclick="editMsg(${i})">Edit</button>
</div>`
})
}

function deleteChat(i){
chats.splice(i,1)
localStorage.setItem('chats',JSON.stringify(chats))
loadChats()
}

function editMsg(i){
let m=prompt('Edit message',chats[i].msg)
if(m!==null){chats[i].msg=m;localStorage.setItem('chats',JSON.stringify(chats));loadChats()}
}

function clearChats(){
chats=[]
localStorage.removeItem('chats')
loadChats()
}

function postStatus(){
if(!name)return alert('Enter name first')
let status=document.getElementById('status-input').value
let img=document.getElementById('status-image').files[0]
let music=document.getElementById('status-music').files[0]
if(!status&&!img&&!music)return
statuses.push({user:name,status,img:img?URL.createObjectURL(img):null,music:music?URL.createObjectURL(music):null,time:new Date().toLocaleTimeString()})
localStorage.setItem('statuses',JSON.stringify(statuses))
document.getElementById('status-input').value=''
loadStatuses()
}

function loadStatuses(){
let log=document.getElementById('status-log')
log.innerHTML=''
statuses.forEach(s=>{
log.innerHTML+=`<div class="status-post">
<b>${s.user}</b><br>${s.status||''}
${s.img?`<img src="${s.img}">`:''}
${s.music?`<audio controls src="${s.music}"></audio>`:''}
<br><small>${s.time}</small>
</div>`
})
}

function post(){
let txt=document.getElementById('post-input').value
let img=document.getElementById('post-image').files[0]
if(!txt&&!img)return
posts.push({txt,img:img?URL.createObjectURL(img):null,time:new Date().toLocaleTimeString()})
localStorage.setItem('posts',JSON.stringify(posts))
document.getElementById('post-input').value=''
loadPosts()
}

function loadPosts(){
let log=document.getElementById('post-log')
log.innerHTML=''
posts.forEach(p=>{
log.innerHTML+=`<div class="status-post">
${p.txt||''}
${p.img?`<img src="${p.img}">`:''}
<br><small>${p.time}</small>
</div>`
})
}

function loadPics(){
let log=document.getElementById('pics-log')
log.innerHTML=''
;[...chats,...statuses,...posts,...happyPosts].forEach(p=>{
if(p.img)log.innerHTML+=`<img src="${p.img}">`
})
}

function postHappy(){
let txt=document.getElementById('happy-input').value
let img=document.getElementById('happy-image').files[0]
if(!txt&&!img)return
happyPosts.push({txt,img:img?URL.createObjectURL(img):null,time:new Date().toLocaleTimeString()})
localStorage.setItem('happyPosts',JSON.stringify(happyPosts))
document.getElementById('happy-input').value=''
loadHappy()
}

function loadHappy(){
let log=document.getElementById('happy-log')
log.innerHTML=''
happyPosts.forEach(h=>{
log.innerHTML+=`<div class="status-post">
${h.txt||''}
${h.img?`<img src="${h.img}">`:''}
<br><small>${h.time}</small>
</div>`
})
}
</script>

</body>
  </html>
