<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Chat</title>
<style>
  body { font-family: sans-serif; display:flex; flex-direction:column; height:100vh; margin:0; }
  #chat { flex:1; padding:10px; overflow:auto; border-bottom:1px solid #ccc; }
  #chat div { margin:5px 0; }
  #inputArea { display:flex; padding:5px; }
  #msg { flex:1; padding:5px; }
  #send { padding:5px; }
</style>
</head>
<body>
<div id="chat"></div>
<div id="inputArea">
  <input id="msg" placeholder="Type message">
  <button id="send">Send</button>
</div>
<script>
let chat=document.getElementById('chat');
let msg=document.getElementById('msg');
let send=document.getElementById('send');

function addMessage(text){
  if(!text.trim()) return;
  let d=document.createElement('div');
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  msg.value='';
}

send.onclick=()=>addMessage(msg.value);
msg.onkeypress=e=>{if(e.key==='Enter') addMessage(msg.value);};

// Long press example
let t;
send.onmousedown=()=>{ t=setTimeout(()=>addMessage("Long press!"),1000); }
send.onmouseup=()=>clearTimeout(t);
</script>
</body>
</html>
