

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Talks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .nav {
      background-color: #333;
      color: #fff;
      padding: 10px;
      text-align: center;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }
    .nav a:hover {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="#sitting-room">Sitting Room</a>
    <a href="#bedroom">Bedroom</a>
    <a href="#outside">Outside</a>
    <a href="#profile">Profile</a>
  </div>
  <div class="container">
    <div id="auth-container">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="login-btn">Login</button>
      <button id="signup-btn">Sign Up</button>
    </div>
    <div id="app-container" style="display: none;">
      <div id="sitting-room">
        <h2>Sitting Room</h2>
        <div id="visitors"></div>
        <div id="chat-log"></div>
        <input id="message" type="text" placeholder="Message">
        <button id="send-btn">Send</button>
      </div>
      <div id="bedroom" style="display: none;">
        <h2>Bedroom</h2>
        <input id="password-input" type="password" placeholder="Enter password">
        <button id="enter-bedroom-btn">Enter</button>
        <div id="bedroom-content" style="display: none;">
          <input id="secret" type="text" placeholder="Secret">
          <button id="save-secret-btn">Save Secret</button>
          <div id="secrets"></div>
        </div>
      </div>
      <div id="outside" style="display: none;">
        <h2>Outside</h2>
        <input id="post" type="text" placeholder="Post">
        <button id="post-btn">Post</button>
        <div id="posts"></div>
      </div>
      <div id="profile" style="display: none;">
        <h2>Profile</h2>
        <input id="note" type="text" placeholder="Note">
        <button id="save-note-btn">Save Note</button>
        <div id="note-display"></div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
      }
    }
  </script>
  <script type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'firebase/auth';
    import { getDatabase, ref, push, onValue, remove } from 'firebase/database';

    const firebaseConfig = {
      apiKey: "AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",
      authDomain: "zeeworldyhi.firebaseapp.com",
      databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com",
      projectId: "zeeworldyhi",
      storageBucket: "zeeworldyhi.firebasestorage.app",
      messagingSenderId: "154414924399",
      appId: "1:154414924399:web:31c3767fdbea93feba439a",
      measurementId: "G-XD5Z8T76EE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          currentUser = userCredential.user;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
          loadVisitors();
          loadChatLog();
        })
        .catch((error) => {
          console.error(error);
        });
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          currentUser = userCredential.user;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
          loadVisitors();
          loadChatLog();
        })
        .catch((error) => {
          console.error(error);
        });
    });

    function loadVisitors() {
      onValue(ref(db, 'visitors'), (snapshot) => {
        const visitors = [];
        snapshot.forEach((childSnapshot) => {
          visitors.push({ key: childSnapshot.key, ...childSnapshot.val() });
        });
        const visitorsContainer = document.getElementById('visitors');
        visitorsContainer.innerHTML = '';
        visitors.forEach((visitor) => {
          const visitorElement = document.createElement('div');
          visitorElement.innerHTML = `
            <p>${visitor.name}</p>
            <img src="${visitor.profilePicture}" alt="Profile Picture">
          `;
          visitorsContainer.appendChild(visitorElement);
        });
      });
    }

    function loadChatLog() {
      onValue(ref(db, 'chatLog'), (snapshot) => {
        const chatLog = [];
        snapshot.forEach((childSnapshot) => {
          chatLog.push({ key: childSnapshot.key, ...childSnapshot.val() });
        });
        const chatLogContainer = document.getElementById('chat-log');
        chatLogContainer.innerHTML = '';
        chatLog.forEach((message) => {
          const messageElement = document.createElement('div');
          messageElement.innerHTML = `
            <p>${message.text}</p>
            <p>Sent by: ${message.sender}</p>
          `;
          chatLogContainer.appendChild(messageElement);
        });
      });
    }

    document.getElementById('send-btn').addEventListener('click', () => {
      const message = document.getElementById('message').value;
      push(ref(db, 'chatLog'), {
        text: message,
        sender: currentUser.email
      });
      document.getElementById('message').value = '';
    });
  </script>
</body>
</html>
