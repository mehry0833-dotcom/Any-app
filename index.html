ems:center;justify-content:space-between;border:1px solid #e9eef3}.fact-slider{display:flex;align-items:center;gap:20px;color:#1e293b}.fact-slider i{font-size:1.6rem;color:#8b5cf6}.fact-text{font-weight:500}.guide-tip{background:#fff;border-radius:40px;padding:0.5rem 1.5rem;color:#334155;border:1px solid #d9d9d9;font-size:0.95rem}.guide-tip i{margin-right:8px;color:#2563eb}.empty-category{color:#94a3b8;text-align:center;padding:4rem 0;font-style:italic}hr{border:1px solid #f1f5f9;margin:1.5rem 0}.footnote{font-size:0.8rem;color:#94a3b8;display:flex;gap:24px}@media (max-width:750px){.columns{flex-direction:column}.categories-panel{width:100%;border-right:0;border-bottom:1px solid #e2e8f0}}</style></head><body><div class="app-container" id="appContainer"><div id="auth-wall"><div class="auth-card"><div class="auth-header">faith stories ✦</div><div id="auth-forms"><div id="login-form"><div class="input-group"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com"></div><div class="input-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••••"></div><button class="btn" id="login-btn">sign in</button><div class="toggle-link">no account? <span id="show-signup">create one</span></div></div><div id="signup-form" style="display:none;"><div class="input-group"><label>Email</label><input type="email" id="signup-email" placeholder="your@email.com"></div><div class="input-group"><label>Password</label><input type="password" id="signup-password" placeholder="at least 6 chars"></div><button class="btn" id="signup-btn">sign up</button><div class="toggle-link">back to <span id="show-login">login</span></div></div></div></div></div><div id="main-app"><div class="top-bar"><div class="logo-area"><i class="fas fa-hamsa logo-icon"></i><span class="logo-text">parts & novels</span></div><div class="user-area"><span class="user-email" id="user-email-display"></span><button class="logout-btn" id="logout"><i class="fas fa-sign-out-alt"></i> logout</button></div></div><div class="knowledge-bar" id="knowledgeBar"><div class="fact-slider"><i class="fas fa-lightbulb"></i><span class="fact-text" id="didYouKnowSpan">Did you know Facebook was made by Zack?</span></div><div class="guide-tip" id="guideTip"><i class="fas fa-compass"></i> how to read a person</div></div><div class="columns"><div class="categories-panel"><h3>story topics</h3><div class="category-list" id="categoryList"></div><hr><div style="font-size:0.9rem; color:#475569; padding:0.8rem;"><i class="fas fa-heart" style="color:#f43f5e;"></i> your private library</div></div><div class="story-area" id="storyArea"><div class="category-header" id="categoryHeader"><h2 id="currentCategoryTitle">Funny Stories</h2><button class="add-story-btn" id="showAddFormBtn" title="add new story"><i class="fas fa-plus"></i></button></div><div id="storiesContainer" class="stories-grid"></div><div id="addStoryFormContainer" style="display: none;" class="add-form"><h3><i class="fas fa-feather"></i> write a new part</h3><input type="text" id="newStoryTitle" placeholder="story title (e.g. 'The crazy chess man')"><textarea id="newStoryContent" placeholder="amazing details, facts, or story..."></textarea><div class="form-actions"><button class="btn-primary" id="saveNewStory"><i class="fas fa-save"></i> save permanently</button><button class="btn-secondary" id="cancelAddForm">cancel</button></div></div><div class="footnote" id="footnoteArea"></div></div></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi",storageBucket:"zeeworldyhi.firebasestorage.app",messagingSenderId:"154414924399",appId:"1:154414924399:web:31c3767fdbea93feba439a",measurementId:"G-XD5Z8T76EE"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();const categories=[{id:'sad',name:'Sad Stories',icon:'fa-face-frown',defaultStories:[{title:'Alone again',content:'A quiet afternoon turned into a memory.'}]},{id:'funny',name:'Funny Stories',icon:'fa-face-smile',defaultStories:[{title:'The crazy chess man',content:'He talked to pawns and called the queen his wife. Nobody dared to play him twice.'},{title:'Jack and his blind friend',content:'Jack described the movie so vividly his blind friend said “I prefer the book.”'},{title:'Henry and his blind date',content:'She brought her parrot. The parrot kept calling him “next!”'}]},{id:'interesting',name:'Interesting Life',icon:'fa-sparkles',defaultStories:[{title:'The man who collected rain',content:'Every storm, he’d fill jars and label them by date.'}]},{id:'realLife',name:'Real Life Stories',icon:'fa-heart',defaultStories:[{title:'Zoe and Mary',content:'They met at a bus stop and became sisters at heart.'},{title:'The problem child',content:'Teachers thought he was trouble. He just needed someone to listen.'},{title:'The crazy student in class',content:'He built a volcano that actually erupted. Detention, but worth it.'},{title:'The pastor',content:'He secretly paid for everyone’s lunch every Sunday.'}]},{id:'their',name:'Their Stories',icon:'fa-people-group',defaultStories:[{title:'Grandpa’s watch',content:'It still ticks, even after 50 years.'}]},{id:'psychology',name:'Psychology Stories',icon:'fa-brain',defaultStories:[{title:'The spotlight effect',content:'We think people notice us more than they do.'}]},{id:'love',name:'Love Stories',icon:'fa-heart',defaultStories:[{title:'Love in the library',content:'They argued over the same book. Now they share a shelf.'}]},{id:'school',name:'School Stories',icon:'fa-backpack',defaultStories:[{title:'The note that got around',content:'It said “do you like me?” and came back with 14 different answers.'}]},{id:'history',name:'History Stories',icon:'fa-landmark',defaultStories:[{title:'The ink of forgotten scribes',content:'They wrote letters that never got sent.'}]},{id:'ghost',name:'Ghost Stories',icon:'fa-ghost',defaultStories:[{title:'The third stair',content:'It always creaks, even when nobody’s there.'}]},{id:'relationship',name:'Relationship Stories',icon:'fa-hand-holding-heart',defaultStories:[{title:'Why people cheat',content:'Often it’s about unmet emotional needs, not just temptation.'},{title:'How to keep your relationship healthy',content:'Listen more than you speak. Surprise each other.'}]},{id:'comedy',name:'Stand‑up Comedy',icon:'fa-microphone',defaultStories:[{title:'Indian Uber driver',content:'Indians are the boldest when giving directions. I once asked an Indian Uber driver where the hospital was. He said, “When you used to go left, you turn right, left, when you then left, you turn right, right?” I ended up in a different city.'}]}];const didYouKnowFacts=['Did you know Facebook was made by Zack? (Zuckerberg)','Did you know AI doesn’t think? It just predicts.','Did you know horses badger is the most predicted? (weird fact)','Did you know octopuses have three hearts?','Did you know the Eiffel Tower grows in summer?'],guideTips=['how to read a person: watch their feet','how to stay calm: breathe in for 4, hold for 4, out for 6','how to find the guide feature: it’s right here 👆','how to listen: ask “what else?”','how to be interesting: be interested'];setInterval(()=>{const f=document.getElementById('didYouKnowSpan'),t=document.getElementById('guideTip');if(f){let i=Math.floor(Math.random()*didYouKnowFacts.length);f.innerText=didYouKnowFacts[i]}if(t){let i=Math.floor(Math.random()*guideTips.length);t.innerHTML=`<i class="fas fa-compass"></i> ${guideTips[i]}`}},8e3);let currentUser=null,currentCategoryId='funny',storiesListener=null;const authWall=document.getElementById('auth-wall'),mainApp=document.getElementById('main-app'),loginFormDiv=document.getElementById('login-form'),signupFormDiv=document.getElementById('signup-form'),showSignup=document.getElementById('show-signup'),showLogin=document.getElementById('show-login'),loginBtn=document.getElementById('login-btn'),signupBtn=document.getElementById('signup-btn'),logoutBtn=document.getElementById('logout'),userEmailSpan=document.getElementById('user-email-display'),categoryListDiv=document.getElementById('categoryList'),currentCategoryTitle=document.getElementById('currentCategoryTitle'),storiesContainer=document.getElementById('storiesContainer'),addFormContainer=document.getElementById('addStoryFormContainer'),showAddFormBtn=document.getElementById('showAddFormBtn'),cancelAddBtn=document.getElementById('cancelAddForm'),saveNewBtn=document.getElementById('saveNewStory'),newTitle=document.getElementById('newStoryTitle'),newContent=document.getElementById('newStoryContent'),footnoteArea=document.getElementById('footnoteArea');showSignup.addEventListener('click',()=>{loginFormDiv.style.display='none';signupFormDiv.style.display='block'}),showLogin.addEventListener('click',()=>{signupFormDiv.style.display='none';loginFormDiv.style.display='block'}),loginBtn.addEventListener('click',()=>{const e=document.getElementById('login-email').value,p=document.getElementById('login-password').value;auth.signInWithEmailAndPassword(e,p).catch(e=>alert('Login error: '+e.message))}),signupBtn.addEventListener('click',()=>{const e=document.getElementById('signup-email').value,p=document.getElementById('signup-password').value;auth.createUserWithEmailAndPassword(e,p).catch(e=>alert('Signup error: '+e.message))}),logoutBtn.addEventListener('click',()=>auth.signOut()),auth.onAuthStateChanged(async user=>{if(user){currentUser=user;authWall.style.display='none';mainApp.style.display='flex';userEmailSpan.innerText=user.email;renderCategorySidebar();switchCategory(currentCategoryId)}else{currentUser=null;authWall.style.display='block';mainApp.style.display='none';if(storiesListener)storiesListener.off()}});function renderCategorySidebar(){categoryListDiv.innerHTML='';categories.forEach(cat=>{const item=document.createElement('div');item.className=`category-item ${cat.id===currentCategoryId?'active':''}`;item.innerHTML=`<i class="fas ${cat.icon}"></i> ${cat.name}`;item.addEventListener('click',()=>{if(cat.id!==currentCategoryId){currentCategoryId=cat.id;renderCategorySidebar();switchCategory(cat.id)}});categoryListDiv.appendChild(item)})}function switchCategory(catId){const cat=categories.find(c=>c.id===catId);currentCategoryTitle.innerText=cat?cat.name:'Stories';addFormContainer.style.display='none';if(storiesListener)storiesListener.off();const userStoriesRef=db.ref(`users/${currentUser.uid}/stories/${catId}`);userStoriesRef.once('value',snapshot=>{if(!snapshot.exists()){const defaults=cat.defaultStories||[{title:'Empty story',content:'Add your own'}];defaults.forEach(def=>{userStoriesRef.push({title:def.title,content:def.content,votes:0,createdAt:Date.now()})})}});storiesListener=userStoriesRef.on('value',snapshot=>{const storiesObj=snapshot.val()||{},storiesList=Object.keys(storiesObj).map(key=>({id:key,...storiesObj[key]}));renderStories(storiesList,catId);footnoteArea.innerHTML=`<i class="fas fa-bookmark"></i> ${storiesList.length} parts · last added: ${new Date().toLocaleTimeString()}`})}function renderStories(stories,catId){if(!stories.length){storiesContainer.innerHTML='<div class="empty-category">✨ no stories yet. tap + to add one.</div>';return}stories.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let html='';stories.forEach(s=>{const preview=s.content.substring(0,70)+(s.content.length>70?'…':'');html+=`<div class="story-card" data-story-id="${s.id}" data-expanded="false"><div class="story-title">${escapeHtml(s.title)} <i class="fas fa-chevron-down" style="font-size:0.9rem;"></i></div><div class="story-preview">${escapeHtml(preview)}</div><div class="story-full" id="full-${s.id}">${escapeHtml(s.content).replace(/\n/g,'<br>')}</div><div class="story-footer"><button class="vote-btn" data-id="${s.id}" data-votes="${s.votes||0}"><i class="fas fa-heart"></i> <span>${s.votes||0}</span></button></div></div>`});storiesContainer.innerHTML=html;document.querySelectorAll('.story-card').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('.vote-btn'))return;const storyId=card.dataset.storyId,fullDiv=document.getElementById(`full-${storyId}`),previewDiv=card.querySelector('.story-preview'),expanded=card.dataset.expanded==='true';if(expanded){previewDiv.style.display='-webkit-box';fullDiv.style.display='none';card.dataset.expanded='false'}else{previewDiv.style.display='none';fullDiv.style.display='block';card.dataset.expanded='true'}})});document.querySelectorAll('.vote-btn').forEach(btn=>{btn.addEventListener('click',async e=>{e.stopPropagation();const storyId=btn.dataset.id,votesSpan=btn.querySelector('span');let currentVotes=parseInt(btn.dataset.votes)||0;currentVotes+=1;btn.dataset.votes=currentVotes;votesSpan.innerText=currentVotes;await db.ref(`users/${currentUser.uid}/stories/${catId}/${storyId}/votes`).set(currentVotes)})})}function escapeHtml(unsafe){if(!unsafe)return'';return unsafe.replace(/[&<>"]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';if(m==='"')return'&quot;';return m})}showAddFormBtn.addEventListener('click',()=>{addFormContainer.style.display='block';newTitle.value='';newContent.value=''});cancelAddBtn.addEventListener('click',()=>{addFormContainer.style.display='none'});saveNewBtn.addEventListener('click',async()=>{const title=newTitle.value.trim(),content=newContent.value.trim();if(!title||!content){alert('title and content required');return}await db.ref(`users/${currentUser.uid}/stories/${currentCategoryId}`).push({title,content,votes:0,createdAt:Date.now()});addFormContainer.style.display='none'});window.addEventListener('load',()=>{document.getElementById('didYouKnowSpan').innerText=didYouKnowFacts[0];document.getElementById('guideTip').innerHTML=`<i class="fas fa-compass"></i> ${guideTips[0]}`});</script></body></html>
