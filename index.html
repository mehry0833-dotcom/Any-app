<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Talks 🏡</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21}.screen{display:none;min-height:100vh;background:#fff}.active{display:block}.auth-container{max-width:400px;margin:50px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 2px 4px #0000001a}.auth-container h2{text-align:center;color:#1877f2}.auth-container input,.auth-container button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd}.auth-container button{background:#1877f2;color:#fff;font-weight:700;border:none;cursor:pointer}.dashboard-header{background:#1877f2;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:700}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}.dashboard-item{background:#fff;border-radius:8px;box-shadow:0 1px 3px #0000001a;text-align:center;padding:20px;cursor:pointer}.dashboard-item span{font-size:40px}.feature-header{background:#1877f2;color:#fff;padding:15px;display:flex;align-items:center;position:sticky;top:0;z-index:10}.back-btn{background:0 0;border:none;color:#fff;font-size:24px;margin-right:15px;cursor:pointer}.feature-header h3{flex:1;text-align:center}.feature-content{padding:20px}.friend-item,.user-item{padding:12px;margin:5px 0;background:#f0f2f5;border-radius:6px;display:flex;align-items:center;cursor:pointer}.friend-item img,.user-item img{width:40px;height:40px;border-radius:50%;margin-right:10px;object-fit:cover}.chat-messages{max-height:60vh;overflow-y:auto;border:1px solid #ddd;padding:10px;margin-bottom:10px}.chat-msg{padding:8px 12px;margin:5px 0;border-radius:18px;max-width:70%;clear:both}.sent{background:#1877f2;color:#fff;float:right}.received{background:#e4e6eb;float:left}.msg-input-area{display:flex;gap:10px;align-items:center}.msg-input-area input[type=text]{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px}.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}.pics-grid img{width:100%;height:100px;object-fit:cover;border-radius:8px;cursor:pointer}.status-post,.post-item{background:#f0f2f5;padding:15px;border-radius:8px;margin-bottom:10px}.status-post img,.post-item img{max-width:100%;border-radius:8px;margin-top:10px}.profile-pic{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:10px auto;display:block}#img-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000e6;display:none;justify-content:center;align-items:center;z-index:100}#full-img{max-width:95%;max-height:95%;border-radius:10px}audio{max-width:100%}
</style></head><body>
<!-- Login -->
<div id="login-screen" class="screen active"><div class="auth-container"><h2>House Talks</h2><input id="login-email" placeholder="Email"><input id="login-password" type="password" placeholder="Password"><button onclick="login()">Log In</button><p style="text-align:center">No account? <a href="#" onclick="showAuth('signup')">Sign Up</a></p><div id="login-msg" style="color:red"></div></div></div>
<!-- Signup -->
<div id="signup-screen" class="screen"><div class="auth-container"><h2>Create Account</h2><input id="signup-name" placeholder="Full Name"><input id="signup-email" placeholder="Email"><input id="signup-password" type="password" placeholder="Password"><input id="signup-profile-pic" type="file" accept="image/*"><button onclick="signup()">Sign Up</button><p style="text-align:center">Have account? <a href="#" onclick="showAuth('login')">Log In</a></p><div id="signup-msg" style="color:red"></div></div></div>
<!-- Dashboard -->
<div id="dashboard-screen" class="screen"><div class="dashboard-header">House Talks</div><div class="dashboard-grid"><div class="dashboard-item" onclick="goToFeature('chats')"><span>💬</span><p>Chats</p></div><div class="dashboard-item" onclick="goToFeature('friends')"><span>👥</span><p>Friends</p></div><div class="dashboard-item" onclick="goToFeature('status')"><span>🎵</span><p>Status</p></div><div class="dashboard-item" onclick="goToFeature('pictures')"><span>🖼️</span><p>Pictures</p></div><div class="dashboard-item" onclick="goToFeature('happy')"><span>😊</span><p>Happy</p></div><div class="dashboard-item" onclick="goToFeature('profile')"><span>👤</span><p>Profile</p></div><div class="dashboard-item" onclick="goToFeature('settings')"><span>⚙️</span><p>Settings</p></div></div></div>
<!-- Chats -->
<div id="chats-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Chats</h3></div><div class="feature-content"><div id="chat-list"></div><div id="chat-window" style="display:none"><div style="display:flex;gap:10px;margin-bottom:10px"><button onclick="closeChatWindow()">← Back</button><h4 id="chat-with-name"></h4></div><div id="chat-messages" class="chat-messages"></div><div class="msg-input-area"><input id="msg-text" placeholder="Type a message"><input id="chat-img" type="file" accept="image/*" style="display:none"><input id="chat-audio" type="file" accept="audio/*" style="display:none"><button onclick="document.getElementById('chat-img').click()">📷</button><button onclick="document.getElementById('chat-audio').click()">🎤</button><button onclick="sendChatMessage()">Send</button></div></div></div></div>
<!-- Friends -->
<div id="friends-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Friends</h3></div><div class="feature-content"><input id="friend-search-input" placeholder="Search by name"><button onclick="searchUsers()">Search</button><div id="search-results"></div><h4>Your Friends</h4><div id="friend-list"></div></div></div>
<!-- Status -->
<div id="status-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Status</h3></div><div class="feature-content"><textarea id="status-text" rows="3" placeholder="What's on your mind?"></textarea><input id="status-img" type="file" accept="image/*"><input id="status-audio" type="file" accept="audio/*"><button onclick="postStatus()">Post</button><div id="status-feed"></div></div></div>
<!-- Pictures -->
<div id="pictures-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>All Pictures</h3></div><div class="feature-content"><div id="pictures-grid" class="pics-grid"></div></div></div>
<!-- Happy -->
<div id="happy-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Happy Zone</h3></div><div class="feature-content"><textarea id="happy-text" rows="3" placeholder="What makes you happy?"></textarea><input id="happy-img" type="file" accept="image/*"><button onclick="postHappy()">Post</button><div id="happy-feed"></div></div></div>
<!-- Profile -->
<div id="profile-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Profile</h3></div><div class="feature-content"><img id="profile-pic-display" class="profile-pic"><p><strong>Name:</strong> <span id="profile-name"></span></p><p><strong>Email:</strong> <span id="profile-email"></span></p><input id="new-profile-pic" type="file" accept="image/*"><button onclick="updateProfilePic()">Update Picture</button></div></div>
<!-- Settings -->
<div id="settings-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Settings</h3></div><div class="feature-content"><button onclick="logout()" style="background:#f02849;color:#fff;padding:12px;width:100%;border:none;border-radius:6px">Logout</button></div></div>
<!-- Fullscreen image overlay -->
<div id="img-overlay" onclick="this.style.display='none'"><img id="full-img"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase config
firebase.initializeApp({apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi"});
const a=firebase.auth(), d=firebase.database(); let u=null, cid=null, cfr=null, m=null;
function toB64(f,cb){if(!f)cb(null);else if(f.type.startsWith('image/')){let r=new FileReader();r.onload=e=>{let i=new Image();i.src=e.target.result;i.onload=_=>{let C=document.createElement('canvas'),M=800,w=i.width,h=i.height;if(w>M||h>M){if(w>h){h*=M/w;w=M}else{w*=M/h;h=M}}C.width=w;C.height=h;C.getContext('2d').drawImage(i,0,0,w,h);cb(C.toDataURL('image/jpeg',0.7))}};r.readAsDataURL(f)}else{if(f.size>1048576){alert('File too large (max 1MB)');cb(null);return}let r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}}
function showAuth(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s+'-screen').classList.add('active')}
function signup(){let n=document.getElementById('signup-name').value.trim(), e=document.getElementById('signup-email').value.trim(), p=document.getElementById('signup-password').value, f=document.getElementById('signup-profile-pic').files[0]; if(!n||!e||!p)return document.getElementById('signup-msg').innerText='All fields required'; a.createUserWithEmailAndPassword(e,p).then(c=>{toB64(f,b=>{d.ref('users/'+c.user.uid).set({name:n,email:e,profilePic:b||null}).catch(e=>alert('Save failed: '+e))})}).catch(e=>document.getElementById('signup-msg').innerText=e.message)}
function login(){let e=document.getElementById('login-email').value.trim(), p=document.getElementById('login-password').value; a.signInWithEmailAndPassword(e,p).catch(e=>document.getElementById('login-msg').innerText=e.message)}
function logout(){a.signOut()}
a.onAuthStateChanged(user=>{if(user){u=user; d.ref('users/'+user.uid).once('value',s=>{let d=s.val()||{}; document.getElementById('profile-name').innerText=d.name||''; document.getElementById('profile-email').innerText=d.email||''; document.getElementById('profile-pic-display').src=d.profilePic||''}).catch(e=>alert('Load profile error: '+e)); showDashboard()}else{u=null; showAuth('login')}})
function showDashboard(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); document.getElementById('dashboard-screen').classList.add('active')}
function goToDashboard(){showDashboard()}
function goToFeature(f){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); document.getElementById(f+'-screen').classList.add('active'); if(f=='chats')loadChats(); if(f=='friends'){loadFriends(); document.getElementById('search-results').innerHTML=''} if(f=='status')loadStatus(); if(f=='pictures')loadPics(); if(f=='happy')loadHappy()}
// FRIENDS
function searchUsers(){let t=document.getElementById('friend-search-input').value.toLowerCase(); if(!t)return; d.ref('users').once('value',s=>{let h=''; s.forEach(c=>{let u=c.val(); if(c.key!==u&&u.name&&u.name.toLowerCase().includes(t))h+=`<div class="user-item" onclick="addFriend('${c.key}')"><img src="${u.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u.name}</span></div>`}); document.getElementById('search-results').innerHTML=h||'<p>No users found</p>'}).catch(e=>alert('Search error: '+e))}
function addFriend(i){d.ref('friends/'+u.uid+'/'+i).set(true).then(()=>d.ref('friends/'+i+'/'+u.uid).set(true)).then(()=>{alert('Friend added'); loadFriends()}).catch(e=>alert('Add friend error: '+e))}
function loadFriends(){d.ref('friends/'+u.uid).once('value',s=>{let l=document.getElementById('friend-list'), ids=s.val()?Object.keys(s.val()):[]; l.innerHTML=ids.length?'':'<p>No friends yet</p>'; ids.forEach(i=>{d.ref('users/'+i).once('value',s2=>{let u2=s2.val(); if(u2)l.innerHTML+=`<div class="friend-item" onclick="openChat('${i}','${u2.name}')"><img src="${u2.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u2.name}</span></div>`})})}).catch(e=>alert('Load friends error: '+e))}
// CHATS
function loadChats(){let c=document.getElementById('chat-list'); c.innerHTML=''; d.ref('friends/'+u.uid).once('value',s=>{let ids=s.val()?Object.keys(s.val()):[]; if(!ids.length){c.innerHTML='<p>No friends to chat</p>'; return} ids.forEach(i=>{d.ref('users/'+i).once('value',s2=>{let u2=s2.val(); if(u2)c.innerHTML+=`<div class="friend-item" onclick="openChat('${i}','${u2.name}')"><img src="${u2.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u2.name}</span></div>`})})}).catch(e=>alert('Load chats error: '+e))}
function openChat(i,n){cfr={uid:i,name:n}; cid=[u.uid,i].sort().join('_'); document.getElementById('chat-list').style.display='none'; document.getElementById('chat-window').style.display='block'; document.getElementById('chat-with-name').innerText=n; loadMsgs()}
function closeChatWindow(){document.getElementById('chat-window').style.display='none'; document.getElementById('chat-list').style.display='block'; if(cid)d.ref('messages/'+cid).off(); cid=null; m=null}
document.getElementById('chat-img').onchange=e=>{let f=e.target.files[0]; if(f)toB64(f,b=>m={type:'image',data:b})};
document.getElementById('chat-audio').onchange=e=>{let f=e.target.files[0]; if(f)toB64(f,b=>m={type:'audio',data:b})};
function sendChatMessage(){let t=document.getElementById('msg-text').value.trim(); if(!t&&!m)return alert('Type a message or attach media'); let msg={sender:u.uid,timestamp:Date.now(),text:t}; if(m){msg.media=m; m=null} d.ref('messages/'+cid).push(msg).then(()=>{document.getElementById('msg-text').value=''; document.getElementById('chat-img').value=''; document.getElementById('chat-audio').value=''}).catch(e=>alert('Send error: '+e))}
function loadMsgs(){let md=document.getElementById('chat-messages'); d.ref('messages/'+cid).orderByChild('timestamp').on('value',s=>{md.innerHTML=''; s.forEach(c=>{let m=c.val(), div=document.createElement('div'); div.className='chat-msg '+(m.sender===u.uid?'sent':'received'); let ct=m.text?`<div>${m.text}</div>`:''; if(m.media){if(m.media.type==='image')ct+=`<img src="${m.media.data}" style="max-width:200px;border-radius:8px;cursor:pointer" onclick="showFullImage('${m.media.data}')">`; else ct+=`<audio controls src="${m.media.data}"></audio>`} div.innerHTML=ct; md.appendChild(div)}); md.scrollTop=md.scrollHeight},e=>alert('Load msgs error: '+e))}
// STATUS
function postStatus() {
    const text = document.getElementById('status-text').value;
    const imgFile = document.getElementById('status-img').files[0];
    const audioFile = document.getElementById('status-audio').files[0];
    if (!text && !imgFile && !audioFile) return;

    const ref = db.ref('statuses').push();
    const data = {
        user: currentUser.uid,
        status: text,
        time: new Date().toISOString() // Use ISO string for consistent date formatting
    };

    fileToBase64(imgFile, img => {
        data.img = img;
        fileToBase64(audioFile, audio => {
            data.audio = audio;
            ref.set(data).then(loadStatusFeed);
        });
    });

    document.getElementById('status-text').value = '';
    document.getElementById('status-img').value = '';
    document.getElementById('status-audio').value = '';
  }
// PICTURES
function loadPics(){let g=document.getElementById('pictures-grid'); g.innerHTML=''; Promise.all([d.ref('statuses').once('value'), d.ref('happy').once('value')]).then(([s,h])=>{s.forEach(c=>{if(c.val().image)g.innerHTML+=`<img src="${c.val().image}" onclick="showFullImage('${c.val().image}')">`}); h.forEach(c=>{if(c.val().image)g.innerHTML+=`<img src="${c.val().image}" onclick="showFullImage('${c.val().image}')">`}); if(g.innerHTML=='')g.innerHTML='<p>No pictures yet</p>'}).catch(e=>alert('Load pics error: '+e))}
// HAPPY
function postHappy(){let t=document.getElementById('happy-text').value.trim(), fi=document.getElementById('happy-img').files[0]; if(!t&&!fi)return alert('Empty post'); let p={uid:u.uid,timestamp:Date.now(),text:t}; if(fi)toB64(fi,img=>{if(img)p.image=img; d.ref('happy').push(p).then(()=>{document.getElementById('happy-text').value=''; document.getElementById('happy-img').value=''; loadHappy()}).catch(e=>alert('Post error: '+e))}); else d.ref('happy').push(p).then(()=>{document.getElementById('happy-text').value=''; loadHappy()}).catch(e=>alert('Post error: '+e))}
function loadHappy(){d.ref('happy').orderByChild('timestamp').limitToLast(20).once('value',async s=>{let f=document.getElementById('happy-feed'), ps=[]; f.innerHTML=''; s.forEach(c=>ps.push(c.val())); ps.reverse(); for(let p of ps){let us=await d.ref('users/'+p.uid).once('value').catch(()=>null), uu=us?us.val():{name:'Unknown'}; f.innerHTML+=`<div class="post-item"><strong>${uu.name}</strong> <small>${new Date(p.timestamp).toLocaleString()}</small><div>${p.text||''}</div>${p.image?`<img src="${p.image}" onclick="showFullImage('${p.image}')">`:''}</div>`}}).catch(e=>alert('Load happy error: '+e))}
// PROFILE
function updateProfilePic(){let f=document.getElementById('new-profile-pic').files[0]; if(!f)return; toB64(f,b=>{if(b)d.ref('users/'+u.uid+'/profilePic').set(b).then(()=>{document.getElementById('profile-pic-display').src=b; alert('Profile pic updated')}).catch(e=>alert('Update error: '+e))})}
// FULLSCREEN
function showFullImage(s){document.getElementById('full-img').src=s; document.getElementById('img-overlay').style.display='flex'}
</script>
</body></html>
