<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fast Evade Game ⛹️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: sans-serif;
      color: white;
      touch-action: none;
    }

    #gameContainer {
      position: relative;
      width: 360px;
      height: 600px;
      background: #222;
      border: 2px solid #555;
      overflow: hidden;
    }

    #player {
      position: absolute;
      bottom: 10px;
      left: 160px;
      font-size: 28px;
      width: 32px;
      height: 32px;
      text-align: center;
      line-height: 32px;
    }

    .obstacle {
      position: absolute;
      top: -40px;
      width: 30px;
      height: 30px;
      font-size: 24px;
      text-align: center;
      line-height: 30px;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 18px;
    }

    #gameOverScreen {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      display: none;
    }

    #restartBtn {
      margin-top: 10px;
      padding: 6px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div id="score">Score: 0</div>
  <div id="player">⛹️</div>
  <div id="gameOverScreen">
    <div>Game Over!</div>
    <div id="finalScore" style="margin-top:6px;font-size:18px;"></div>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<script>
  const gameContainer = document.getElementById('gameContainer');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');

  const gameWidth = 360;
  const gameHeight = 600;
  const playerSpeed = 15;     // ← increase this if still too slow (e.g. 20)
  const obstacleSpeedStart = 3;
  let obstacleSpeed = obstacleSpeedStart;

  let playerX = 160;
  let obstacles = [];
  let score = 0;
  let gameOver = false;
  let spawnTimer = 0;

  // TOUCH controls (slide left/right on phone)
  let touchStartX = 0;

  gameContainer.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    e.preventDefault();
  });

  gameContainer.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - touchStartX;

    if (dx > 5) {
      // slide right
      playerX = Math.min(playerX + playerSpeed, gameWidth - 40);
      touchStartX = e.touches[0].clientX;
    } else if (dx < -5) {
      // slide left
      playerX = Math.max(playerX - playerSpeed, 0);
      touchStartX = e.touches[0].clientX;
    }
  });

  // --- obstacle emojis ---
  const enemyEmojis = ["😡", "👿", "😈", "💩", "👾", "👺", "👹", "🤡", "💥", "🎃", "🤖", "👽", "🦴"];

  function resetGame() {
    obstacles.forEach(o => o.elem.remove());
    obstacles = [];
    score = 0;
    obstacleSpeed = obstacleSpeedStart;
    gameOver = false;
    spawnTimer = 0;
    scoreEl.textContent = 'Score: 0';
    playerX = 160;
    player.style.left = playerX + 'px';
    gameOverScreen.style.display = 'none';
  }

  function spawnObstacle() {
    const obstacle = document.createElement('div');
    obstacle.className = 'obstacle';
    const x = Math.random() * (gameWidth - 30);
    obstacle.style.left = x + 'px';

    // pick random emoji
    const emoji = enemyEmojis[Math.floor(Math.random() * enemyEmojis.length)];
    obstacle.textContent = emoji;

    gameContainer.appendChild(obstacle);
    obstacles.push({
      elem: obstacle,
      x: x,
      y: -40
    });
  }

  function updatePlayer() {
    player.style.left = playerX + 'px';
  }

  function updateObstacles() {
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += obstacleSpeed;
      o.elem.style.top = o.y + 'px';

      if (o.y > gameHeight) {
        o.elem.remove();
        obstacles.splice(i, 1);
        score += 1;
        scoreEl.textContent = 'Score: ' + score;
        obstacleSpeed = obstacleSpeedStart + score * 0.1;
        continue;
      }

      if (checkCollision(player, o.elem)) {
        endGame();
        return;
      }
    }
  }

  function checkCollision(a, b) {
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    return !(
      ar.right < br.left ||
      ar.left > br.right ||
      ar.bottom < br.top ||
      ar.top > br.bottom
    );
  }

  function endGame() {
    gameOver = true;
    finalScoreEl.textContent = 'Your score: ' + score;
    gameOverScreen.style.display = 'flex';
  }

  function gameLoop() {
    if (!gameOver) {
      updatePlayer();
      updateObstacles();

      spawnTimer++;
      if (spawnTimer > 40) {
        spawnObstacle();
        spawnTimer = 0;
      }
    }
    requestAnimationFrame(gameLoop);
  }

  restartBtn.addEventListener('click', () => {
    resetGame();
  });

  resetGame();
  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
