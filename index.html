<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faith Stories · personal novels</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Roboto,sans-serif;background:#f4f7fb;color:#1e2b3c;line-height:1.5;padding:1rem}.app-container{max-width:1400px;margin:0 auto}.auth-panel{background:#fff;border-radius:32px;padding:2rem;box-shadow:0 12px 30px rgba(0,0,0,.05);margin-bottom:2rem;display:flex;flex-wrap:wrap;gap:2rem;align-items:flex-start}.auth-forms{display:flex;flex-wrap:wrap;gap:2rem;flex:2}.auth-card{background:#f9fafc;padding:1.5rem;border-radius:24px;flex:1 1 250px}.auth-card h3{margin-bottom:1rem;font-weight:500;color:#2c3e50}.auth-card input{width:100%;padding:.8rem 1rem;margin-bottom:.8rem;border:1px solid #dce5ec;border-radius:40px;font-size:1rem;background:#fff}.auth-card button{background:#1e2b3c;color:#fff;border:none;padding:.8rem 1.5rem;border-radius:40px;font-weight:600;cursor:pointer;width:100%}.auth-card button:hover{background:#2c4058}.user-greeting{background:#e1e9f2;border-radius:40px;padding:1rem 2rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}.user-greeting span{font-weight:600}.logout-btn{background:0 0;border:1px solid #1e2b3c;color:#1e2b3c;padding:.5rem 1.8rem;border-radius:40px;font-weight:600;cursor:pointer}.main-app{display:none}.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.8rem;margin-top:2rem}.category-card{background:#fff;border-radius:32px;padding:1.5rem 1.2rem;box-shadow:0 8px 24px rgba(0,0,0,.02);border:1px solid #eef3f8;display:flex;flex-direction:column}.category-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;padding-bottom:.5rem;border-bottom:2px solid #f0f5fa}.category-header h2{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;color:#0b1a2a}.add-story-btn{background:#d4e1f0;border:none;width:40px;height:40px;border-radius:40px;font-size:1.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1e2b3c}.add-story-btn:hover{background:#bacedf}.stories-list{display:flex;flex-direction:column;gap:.8rem;flex:1}.story-item{background:#f9fbfd;border-radius:24px;padding:.7rem 1rem .7rem 1.2rem;border:1px solid #e3eef9}.story-title-bar{display:flex;align-items:center;gap:.5rem;cursor:pointer;flex-wrap:wrap}.story-title{font-weight:600;flex:1;font-size:1.1rem;color:#0b2a41}.vote-btn{background:0 0;border:none;font-size:1.5rem;cursor:pointer;color:#c0cfde;padding:0 .2rem}.vote-btn.voted{color:#e34f6f}.story-content{display:none;margin-top:.8rem;padding:1rem .5rem .3rem;border-top:1px dashed #cdddee;color:#2b4a6b;white-space:pre-line}.story-content.expanded{display:block}.empty-stories{color:#99b2c9;font-style:italic;padding:1rem .5rem;text-align:center}.add-form{background:#eef4fa;border-radius:24px;padding:1rem;margin-bottom:1rem;display:none;flex-direction:column;gap:.6rem}.add-form input,.add-form textarea{border:1px solid #cbdae9;border-radius:30px;padding:.7rem 1rem;font-family:inherit;font-size:.95rem}.add-form-actions{display:flex;gap:.5rem}.add-form-actions button{background:#1e2b3c;border:none;color:#fff;padding:.5rem 1rem;border-radius:30px;font-weight:600;cursor:pointer;flex:1}.add-form-actions button.cancel{background:#b6c7db;color:#1e2b3c}.footer-note{margin-top:4rem;text-align:center;color:#7f99b6}
</style></head><body><div class="app-container"><div class="auth-panel" id="authPanel"><div class="auth-forms" id="authForms"><div class="auth-card"><h3>🔐 Sign in</h3><input type="email" id="loginEmail" placeholder="Email"><input type="password" id="loginPassword" placeholder="Password"><button id="loginBtn">Sign in</button></div><div class="auth-card"><h3>📝 Sign up</h3><input type="email" id="signupEmail" placeholder="Email"><input type="password" id="signupPassword" placeholder="Password"><button id="signupBtn">Create account</button></div></div><div id="userInfo" style="display:none" class="user-greeting"><span>👤 <span id="userEmail"></span></span><button class="logout-btn" id="logoutBtn">Sign out</button></div></div><div class="main-app" id="mainApp"><h1 style="font-weight:500;font-size:2rem;">📖 Faith stories · parts & novels</h1><p style="color:#446688;">Tap on any title to read full story. ❤️ marks your favorite. Use + to add your own.</p><div id="categoriesContainer" class="categories-grid"></div><div class="footer-note">— your private story space, saved forever —</div></div></div><script>
const fc={apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi",storageBucket:"zeeworldyhi.firebasestorage.app",messagingSenderId:"154414924399",appId:"1:154414924399:web:31c3767fdbea93feba439a",measurementId:"G-XD5Z8T76EE"};firebase.initializeApp(fc);const auth=firebase.auth(),db=firebase.database();let currentUser=null;const CATEGORIES=["Sad Stories","Funny Stories","Interesting Life Stories","Real Life Stories","Their Stories","Psychology Stories","Love Stories","School Stories","History Stories","Ghost Stories","Relationship Stories","Stand-up Comedy","Facts & Guides"],DEFAULT_SEED={"Funny Stories":[{title:"The crazy chess man",content:"He would move knights like bishops and claim he was playing 4D chess. One day he checkmated himself and smiled."},{title:"Jack and his blind friend",content:"Jack described movies so vividly that his blind friend said 'I prefer your version.'"},{title:"Henry and his blind date",content:"Henry showed up at the wrong restaurant, but the woman was so kind they laughed all night. He still calls it 'the best mistake'."}],"Real Life Stories":[{title:"Zoe and Mary",content:"Zoe and Mary met in a queue for coffee. Zoe’s dog had the same name as Mary’s late cat. They've been inseparable for 12 years."},{title:"The problem child",content:"Little Sam painted the neighbour's fence rainbow. The neighbour loved it so much he paid Sam for a mural."}],"Stand-up Comedy":[{title:"Indian directions",content:"Indians are the boldest when giving directions. I once asked an Uber driver: 'Is the hospital near?' He said: 'When you used to go left, you turn right, left, when you then left, you turn right, right?' – I ended up in a different city."}],"Facts & Guides":[{title:"Did you know Facebook was made by Zack?",content:"Mark Zuckerberg built Facebook from his dorm. Now it connects billions."},{title:"Did you know AI doesn't think?",content:"AI mimics patterns but has no consciousness. It's a sophisticated parrot."},{title:"How to read a person",content:"Notice eye direction, posture shifts, and micro-expressions. Practice with friends."},{title:"How to stay calm",content:"Breathe in 4 seconds, hold 4, exhale 6. Repeat. Name 5 things you see."}],"Relationship Stories":[{title:"Why people cheat (real stories)",content:"Often it's about unmet emotional needs, not just attraction. One spouse felt invisible; another craved adventure."},{title:"How to keep your relationship healthy",content:"Daily check-ins, appreciate loudly, argue softly. Never stop being curious about each other."}],"Ghost Stories":[{title:"The old library",content:"Every night at 2am, books rearrange themselves. The librarian leaves them, because readers prefer it that way."}],"Interesting Life Stories":[{title:"The pastor who forgot his sermon",content:"He spoke from the heart for 40 minutes. People said it was his best sermon ever."}]};function userStoriesRef(uid,category){return db.ref(`users/${uid}/stories/${category}`);}
const authForms=document.getElementById('authForms'),userInfoDiv=document.getElementById('userInfo'),userEmailSpan=document.getElementById('userEmail'),mainApp=document.getElementById('mainApp');function showAuthState(user){if(user){currentUser=user;authForms.style.display='none';userInfoDiv.style.display='flex';userEmailSpan.innerText=user.email;mainApp.style.display='block';initializeAppForUser(user.uid);}else{currentUser=null;authForms.style.display='flex';userInfoDiv.style.display='none';mainApp.style.display='none';}}
async function seedIfNewUser(uid){const snap=await db.ref(`users/${uid}/stories`).once('value');if(snap.exists())return;const updates={};for(const[cat,stories]of Object.entries(DEFAULT_SEED)){if(stories&&stories.length){stories.forEach((s,idx)=>{const newId=db.ref().push().key;updates[`users/${uid}/stories/${cat}/${newId}`]={title:s.title,content:s.content,liked:false,createdAt:Date.now()-idx*1000};});}}await db.ref().update(updates);}
function initializeAppForUser(uid){seedIfNewUser(uid).then(()=>renderAllCategories(uid));}
function renderAllCategories(uid){const container=document.getElementById('categoriesContainer');container.innerHTML='';CATEGORIES.forEach(category=>{const card=document.createElement('div');card.className='category-card';card.dataset.category=category;const header=document.createElement('div');header.className='category-header';header.innerHTML=`<h2>${category}</h2>`;const addBtn=document.createElement('button');addBtn.className='add-story-btn';addBtn.innerHTML='+';header.appendChild(addBtn);card.appendChild(header);const storiesDiv=document.createElement('div');storiesDiv.className='stories-list';card.appendChild(storiesDiv);const formDiv=document.createElement('div');formDiv.className='add-form';formDiv.style.display='none';formDiv.innerHTML=`<input type="text" placeholder="Title" class="new-title" /><textarea rows="2" placeholder="Story content..." class="new-content"></textarea><div class="add-form-actions"><button class="save-new">Save</button><button class="cancel">Cancel</button></div>`;card.appendChild(formDiv);addBtn.addEventListener('click',()=>{formDiv.style.display='flex';addBtn.style.display='none';});formDiv.querySelector('.cancel').addEventListener('click',()=>{formDiv.style.display='none';addBtn.style.display='flex';formDiv.querySelector('.new-title').value='';formDiv.querySelector('.new-content').value='';});formDiv.querySelector('.save-new').addEventListener('click',()=>{const t=formDiv.querySelector('.new-title'),c=formDiv.querySelector('.new-content');if(!t.value.trim()||!c.value.trim())return alert('Both fields needed');userStoriesRef(uid,category).push().set({title:t.value.trim(),content:c.value.trim(),liked:false,createdAt:Date.now()}).then(()=>{t.value='';c.value='';formDiv.style.display='none';addBtn.style.display='flex';});});container.appendChild(card);userStoriesRef(uid,category).on('value',(snap)=>{renderStoryList(category,snap.val()||{},storiesDiv,uid);});});}
function renderStoryList(category,storiesObj,container,uid){if(!storiesObj||Object.keys(storiesObj).length===0){container.innerHTML='<div class="empty-stories">✨ no stories yet. tap + to add.</div>';return;}
const entries=Object.entries(storiesObj).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));let html='';entries.forEach(([id,story])=>{const likedClass=story.liked?'voted':'';html+=`<div class="story-item" data-id="${id}" data-category="${category}"><div class="story-title-bar"><span class="story-title">${escape(story.title)||'untitled'}</span><button class="vote-btn ${likedClass}" data-id="${id}" data-liked="${story.liked}">❤️</button></div><div class="story-content" data-id="${id}">${escape(story.content)||''}</div></div>`;});container.innerHTML=html;
container.querySelectorAll('.story-title-bar').forEach(bar=>{bar.addEventListener('click',(e)=>{if(e.target.classList.contains('vote-btn'))return;bar.closest('.story-item').querySelector('.story-content').classList.toggle('expanded');});});
container.querySelectorAll('.vote-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{e.stopPropagation();const id=btn.dataset.id,cat=btn.closest('.story-item').dataset.category,liked=btn.dataset.liked==='true';db.ref(`users/${uid}/stories/${cat}/${id}/liked`).set(!liked).then(()=>{btn.dataset.liked=!liked;btn.classList.toggle('voted',!liked);});});});}
function escape(unsafe){if(!unsafe)return unsafe;return unsafe.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
auth.onAuthStateChanged(user=>showAuthState(user));document.getElementById('loginBtn').addEventListener('click',()=>{const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPassword').value;auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message));});document.getElementById('signupBtn').addEventListener('click',()=>{const e=document.getElementById('signupEmail').value,p=document.getElementById('signupPassword').value;auth.createUserWithEmailAndPassword(e,p).catch(err=>alert(err.message));});document.getElementById('logoutBtn').addEventListener('click',()=>auth.signOut());showAuthState(null);
</script><!-- FIREBASE RULES: {"rules":{"users":{"$uid":{".read":"$uid === auth.uid",".write":"$uid === auth.uid","stories":{"$category":{".read":"$uid === auth.uid",".write":"$uid === auth.uid","$storyId":{".validate":"newData.hasChildren(['title','content','liked','createdAt'])","title":{".validate":"newData.isString()"},"content":{".validate":"newData.isString()"},"liked":{".validate":"newData.isBoolean()"},"createdAt":{".validate":"newData.isNumber()"}}}}}}} -->
</body></html>
