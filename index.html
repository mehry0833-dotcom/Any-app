<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evade Game ⛹️</title>
  <style>
    /* Center the game area */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: sans-serif;
      color: white;
    }

    #gameContainer {
      position: relative;
      width: 400px;
      height: 600px;
      background: #222;
      border: 2px solid #555;
      overflow: hidden;
    }

    /* Player (the ⛹️ character) */
    #player {
      position: absolute;
      bottom: 10px;
      left: 180px; /* centered approx */
      font-size: 32px;
      width: 32px;
      height: 32px;
      text-align: center;
      line-height: 32px;
    }

    /* Falling obstacles */
    .obstacle {
      position: absolute;
      top: -40px;
      width: 30px;
      height: 30px;
      background: crimson;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 18px;
    }

    #gameOverScreen {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      display: none;
    }

    #restartBtn {
      margin-top: 10px;
      padding: 6px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div id="score">Score: 0</div>
  <div id="player">⛹️</div>
  <div id="gameOverScreen">
    <div>Game Over!</div>
    <div id="finalScore" style="margin-top:6px;font-size:18px;"></div>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<script>
  const gameContainer = document.getElementById('gameContainer');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');

  const gameWidth = 400;
  const gameHeight = 600;
  const playerSpeed = 8;
  const obstacleSpeedStart = 3;
  let obstacleSpeed = obstacleSpeedStart;

  let leftPressed = false;
  let rightPressed = false;
  let obstacles = [];
  let score = 0;
  let gameOver = false;
  let spawnTimer = 0;

  // Keyboard controls
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
    if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
    if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
  });

  function resetGame() {
    // Reset state
    obstacles.forEach(o => o.elem.remove());
    obstacles = [];
    score = 0;
    obstacleSpeed = obstacleSpeedStart;
    gameOver = false;
    spawnTimer = 0;
    scoreEl.textContent = 'Score: 0';
    player.style.left = (gameWidth / 2 - 16) + 'px';
    gameOverScreen.style.display = 'none';
  }

  function spawnObstacle() {
    const obstacle = document.createElement('div');
    obstacle.className = 'obstacle';
    const x = Math.random() * (gameWidth - 30);
    obstacle.style.left = x + 'px';
    gameContainer.appendChild(obstacle);
    obstacles.push({
      elem: obstacle,
      x: x,
      y: -40
    });
  }

  function updatePlayer() {
    const rect = player.getBoundingClientRect();
    // Get current left relative to container
    const playerLeft = parseFloat(player.style.left || (gameWidth / 2 - 16));
    let newLeft = playerLeft;

    if (leftPressed) newLeft -= playerSpeed;
    if (rightPressed) newLeft += playerSpeed;

    if (newLeft < 0) newLeft = 0;
    if (newLeft > gameWidth - 32) newLeft = gameWidth - 32;

    player.style.left = newLeft + 'px';
  }

  function updateObstacles() {
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += obstacleSpeed;
      o.elem.style.top = o.y + 'px';

      // Remove if off screen and give score
      if (o.y > gameHeight) {
        o.elem.remove();
        obstacles.splice(i, 1);
        score += 1;
        scoreEl.textContent = 'Score: ' + score;
        // Increase speed slowly
        obstacleSpeed = obstacleSpeedStart + score * 0.1;
        continue;
      }

      // Collision with player
      if (checkCollision(player, o.elem)) {
        endGame();
        return;
      }
    }
  }

  function checkCollision(a, b) {
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    // Because getBoundingClientRect is relative to viewport, compare directly
    return !(
      ar.right < br.left ||
      ar.left > br.right ||
      ar.bottom < br.top ||
      ar.top > br.bottom
    );
  }

  function endGame() {
    gameOver = true;
    finalScoreEl.textContent = 'Your score: ' + score;
    gameOverScreen.style.display = 'flex';
  }

  function gameLoop() {
    if (!gameOver) {
      updatePlayer();
      updateObstacles();

      // Spawn new obstacles over time
      spawnTimer++;
      if (spawnTimer > 40) { // lower number = more frequent spawns
        spawnObstacle();
        spawnTimer = 0;
      }
    }
    requestAnimationFrame(gameLoop);
  }

  restartBtn.addEventListener('click', () => {
    resetGame();
  });

  // Start
  resetGame();
  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
