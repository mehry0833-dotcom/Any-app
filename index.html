rder-radius:60px;box-shadow:0 4px 12px rgba(0,0,0,.02)}.btn-group{display:flex;gap:.5rem;flex-wrap:wrap}.icon-btn{background:#eef4fa;border:none;width:40px;height:40px;border-radius:40px;font-size:1.3rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.dark .icon-btn{background:#3a3a3a;color:#ddd}.owner-badge{background:#dceafa;padding:.3rem 1rem;border-radius:30px;font-size:.9rem}.screen{display:none}.screen.active{display:block}.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin:1rem 0}.category-tile{background:#fff;border-radius:32px;padding:1.8rem 1rem;box-shadow:0 4px 10px rgba(0,0,0,.02);border:1px solid #edf2f7;font-size:1.4rem;font-weight:600;text-align:center;cursor:pointer}.widget-row{display:flex;flex-wrap:wrap;gap:2rem;margin:2rem 0;padding:1rem;background:#fff;border-radius:40px}.dark .widget-row{background:#2a2a2a}.widget{flex:1 1 200px}.back-bar{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}.back-btn{background:#fff;border:1px solid #dce5ec;font-size:2rem;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.add-btn{background:#d4e1f0;border:none;width:48px;height:48px;border-radius:50%;font-size:2rem;display:none;align-items:center;justify-content:center;cursor:pointer}.add-btn.visible{display:flex}.story-item{background:#fff;border-radius:28px;padding:1rem 1.2rem;margin-bottom:1rem;border:1px solid #e6edf6}.story-title-bar{display:flex;align-items:center;gap:.5rem;cursor:pointer;flex-wrap:wrap}.story-title{font-weight:600;font-size:1.2rem;flex:1}.story-meta{font-size:.8rem;color:#7f99b6;display:flex;gap:1rem;margin-left:auto}.delete-btn,.bookmark-btn,.share-btn,.tts-btn,.report-btn{background:0 0;border:none;font-size:1.3rem;cursor:pointer;display:none;color:#b0c6dd}.delete-btn.visible,.bookmark-btn.visible,.share-btn.visible,.tts-btn.visible,.report-btn.visible{display:inline-block}.story-content{display:none;margin-top:1rem;padding:1rem .5rem;border-top:1px dashed #d2e0f0}.story-content.expanded{display:block}.comments-section{margin-top:1.5rem;padding:.5rem;background:#f9fbfd;border-radius:20px}.dark .comments-section{background:#2a2a2a}.comment{margin:.5rem 0;padding:.5rem;border-bottom:1px solid #ddd}.comment small{color:#7f99b6}.add-comment{display:flex;gap:.5rem;margin-top:1rem}.add-comment input{flex:2;padding:.5rem;border-radius:30px;border:1px solid #ccc}.add-comment button{padding:.5rem 1rem;border-radius:30px;background:#1e2b3c;color:#fff;border:none}.tag{display:inline-block;background:#eef4fa;border-radius:30px;padding:.2rem 1rem;margin:.2rem;font-size:.8rem}.empty-stories{color:#9cb2cf;font-style:italic;padding:2rem;text-align:center}.add-form{background:#eef4fa;border-radius:28px;padding:1rem;margin-top:1rem;display:none;flex-direction:column;gap:.5rem}.owner-only{display:none}.owner-only.visible{display:block}.footer-note{margin-top:3rem;text-align:center;color:#8ba5c2}.search-box{width:100%;padding:1rem;border-radius:60px;border:1px solid #ccc;margin-bottom:1rem;font-size:1.1rem}</style></head><body><div class="app-container"><div class="top-bar"><h1>📖 Faith stories</h1><div class="btn-group"><button class="icon-btn" id="darkToggle">🌙</button><button class="icon-btn" id="randomBtn">🎲</button><button class="icon-btn" id="myListBtn">📌</button><span id="ownerBadge" class="owner-badge" style="display:none;">👑</span><button class="icon-btn" id="adminLoginBtn">🔐</button><button class="icon-btn" id="adminLogoutBtn" style="display:none;">🚪</button></div></div><div id="homeScreen" class="screen active"><input type="text" id="searchInput" class="search-box" placeholder="🔍 search stories..."><div id="categoryGrid" class="category-grid"></div><div class="widget-row"><div class="widget"><h3>⭐ Story of the day</h3><div id="storyOfDay"></div></div><div class="widget"><h3>🔥 Most liked</h3><div id="mostLiked"></div></div><div class="widget"><h3>🕒 Recent</h3><div id="recentStories"></div></div></div><div class="widget-row" id="tagCloud"><h3>🏷️ Tags</h3><div id="tagList"></div></div></div><div id="categoryScreen" class="screen"><div class="back-bar"><span class="back-btn" id="backHomeBtn">←</span><h2 id="currentCategoryTitle"></h2><button class="add-btn" id="addStoryBtn" title="add story">+</button></div><div id="storiesContainer" class="stories-list"></div><div class="add-form owner-only" id="addForm"><input id="newTitle" placeholder="Title"><textarea id="newContent" rows="2" placeholder="Story content..."></textarea><input id="newTags" placeholder="tags (comma separated)"><div class="form-actions"><button id="saveNewBtn">Save</button><button class="cancel" id="cancelAddBtn">Cancel</button></div></div></div><div id="myListScreen" class="screen"><div class="back-bar"><span class="back-btn" id="backFromListBtn">←</span><h2>📌 My reading list</h2></div><div id="bookmarkList" class="stories-list"></div></div><div class="footer-note">— all features: like, comment, share, tts, report, export —</div></div><script>
const firebaseConfig={apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi",storageBucket:"zeeworldyhi.firebasestorage.app",messagingSenderId:"154414924399",appId:"1:154414924399:web:31c3767fdbea93feba439a",measurementId:"G-XD5Z8T76EE"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
let ownerUid=null,isOwner=!1,currentCategory=null,dark=localStorage.getItem('dark')==='true',bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]'),likedStories=JSON.parse(localStorage.getItem('likedStories')||'{}');
const $=id=>document.getElementById(id);
const home=$('homeScreen'),catScreen=$('categoryScreen'),listScreen=$('myListScreen'),catGrid=$('categoryGrid'),searchIn=$('searchInput'),darkToggle=$('darkToggle'),randomBtn=$('randomBtn'),myListBtn=$('myListBtn'),adminLogin=$('adminLoginBtn'),adminLogout=$('adminLogoutBtn'),ownerBadge=$('ownerBadge'),backHome=$('backHomeBtn'),backList=$('backFromListBtn'),catTitle=$('currentCategoryTitle'),addStoryBtn=$('addStoryBtn'),addForm=$('addForm'),newTitle=$('newTitle'),newContent=$('newContent'),newTags=$('newTags'),saveNew=$('saveNewBtn'),cancelAdd=$('cancelAddBtn'),storiesDiv=$('storiesContainer'),storyOfDayDiv=$('storyOfDay'),mostLikedDiv=$('mostLiked'),recentDiv=$('recentStories'),tagListDiv=$('tagList'),bookmarkDiv=$('bookmarkList');
let allStoriesCache={},categories=[];
if(dark)document.body.classList.add('dark');
darkToggle.onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('dark',dark);};
auth.onAuthStateChanged(u=>{if(u&&u.email===localStorage.getItem('ownerEmail')){ownerUid=u.uid;isOwner=!0;ownerBadge.style.display='inline-block';adminLogin.style.display='none';adminLogout.style.display='inline-block';}else{ownerUid=null;isOwner=!1;ownerBadge.style.display='none';adminLogin.style.display='inline-block';adminLogout.style.display='inline-block';}updateOwnerUI();});
adminLogin.onclick=async()=>{let e=prompt('Owner email');if(!e)return;let p=prompt('Owner password');if(!p)return;try{await auth.signInWithEmailAndPassword(e,p);localStorage.setItem('ownerEmail',e);}catch(err){if(err.code.includes('user-not-found')||err.code.includes('invalid-login-credentials')){if(confirm('Owner not found. Create now?')){try{await auth.createUserWithEmailAndPassword(e,p);localStorage.setItem('ownerEmail',e);}catch(e){alert(e.message);}}}else alert(err.message);}};
adminLogout.onclick=()=>{auth.signOut();localStorage.removeItem('ownerEmail');};
function updateOwnerUI(){if(currentCategory)addStoryBtn.classList.toggle('visible',isOwner);document.querySelectorAll('.delete-btn').forEach(b=>b.classList.toggle('visible',isOwner));document.querySelectorAll('.owner-only').forEach(e=>e.classList.toggle('visible',isOwner));}
async function loadCategories(){let snap=await db.ref('public/categories').once('value');if(!snap.exists()){categories=["Sad Stories","Funny Stories","Real Life Stories","Stand-up Comedy","Facts & Guides"];await db.ref('public/categories').set(categories);}else categories=snap.val();renderHome();}
function renderHome(){catGrid.innerHTML='';categories.forEach(c=>{let tile=document.createElement('div');tile.className='category-tile';tile.textContent=c;tile.onclick=()=>openCategory(c);catGrid.appendChild(tile);});loadWidgets();}
async function loadWidgets(){let snap=await db.ref('public/stories').once('value');allStoriesCache=snap.val()||{};let flat=[];Object.entries(allStoriesCache).forEach(([cat,st])=>Object.entries(st||{}).forEach(([id,s])=>flat.push({id,cat,...s})));flat.sort((a,b)=>(b.likes||0)-(a.likes||0));mostLikedDiv.innerHTML=flat.slice(0,3).map(s=>`<div>❤️ ${s.likes||0} <b>${escape(s.title)}</b> (${s.cat})</div>`).join('')||'none';flat.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));recentDiv.innerHTML=flat.slice(0,3).map(s=>`<div>🕒 ${escape(s.title)} (${s.cat})</div>`).join('')||'none';let daySeed=Math.floor(Date.now()/86400000)%flat.length;let sotd=flat[daySeed];storyOfDayDiv.innerHTML=sotd?`<div><b>${escape(sotd.title)}</b><br>${escape(sotd.cat)}</div>`:'no stories';let tags=[...new Set(flat.flatMap(s=>s.tags||[]))];tagListDiv.innerHTML=tags.map(t=>`<span class="tag" onclick="filterByTag('${t}')">#${t}</span>`).join('')||'no tags';}
window.filterByTag=(tag)=>{searchIn.value=tag;searchStories();};
function searchStories(){let term=searchIn.value.toLowerCase();if(!term){renderHome();return;}let results=[];Object.entries(allStoriesCache).forEach(([cat,st])=>Object.entries(st||{}).forEach(([id,s])=>{if(s.title.toLowerCase().includes(term)||s.content.toLowerCase().includes(term))results.push(`<div class="story-item" onclick="openCategory('${cat}')">📖 ${escape(s.title)} <small>(${cat})</small></div>`);}));catGrid.innerHTML=results.join('')||'no results';}
searchIn.addEventListener('input',searchStories);
function openCategory(cat){currentCategory=cat;catTitle.textContent=cat;home.classList.remove('active');catScreen.classList.add('active');listScreen.classList.remove('active');loadStories(cat);updateOwnerUI();}
backHome.onclick=()=>{catScreen.classList.remove('active');home.classList.add('active');currentCategory=null;};
backList.onclick=()=>{listScreen.classList.remove('active');home.classList.add('active');};
myListBtn.onclick=()=>{home.classList.remove('active');listScreen.classList.add('active');renderBookmarks();};
async function loadStories(cat){let ref=db.ref(`public/stories/${cat}`);ref.off();ref.on('value',snap=>{let st=snap.val()||{};renderStories(cat,st);});}
function renderStories(cat,obj){let entries=Object.entries(obj).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));let html='';entries.forEach(([id,s])=>{let liked=likedStories[id]?'voted':'';let readingTime=Math.ceil((s.content||'').split(' ').length/200);html+=`<div class="story-item" data-id="${id}"><div class="story-title-bar"><span class="story-title">${escape(s.title)||'untitled'}</span><span class="story-meta">❤️ <span id="like-${id}">${s.likes||0}</span> · ${readingTime} min</span><button class="vote-btn ${liked}" data-id="${id}">❤️</button><button class="bookmark-btn ${bookmarks.includes(id)?'visible':''}" data-id="${id}">🔖</button><button class="share-btn visible" data-id="${id}">📤</button><button class="tts-btn visible" data-id="${id}">🔊</button><button class="delete-btn ${isOwner?'visible':''}" data-id="${id}">🗑️</button><button class="report-btn visible" data-id="${id}">🚩</button></div><div class="story-content">${escape(s.content)||''}<br>${(s.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join(' ')}<div class="comments-section" id="comments-${id}"></div><div class="add-comment"><input id="comment-${id}" placeholder="write a comment..."><button onclick="addComment('${id}')">💬</button></div></div></div>`;});storiesDiv.innerHTML=html||'<div class="empty-stories">no stories</div>';
document.querySelectorAll('.vote-btn').forEach(b=>{let id=b.dataset.id;b.onclick=e=>{e.stopPropagation();let liked=!likedStories[id];likedStories[id]=liked;localStorage.setItem('likedStories',JSON.stringify(likedStories));b.classList.toggle('voted',liked);let delta=liked?1:-1;db.ref(`public/stories/${cat}/${id}/likes`).transaction(l=>(l||0)+delta);};});
document.querySelectorAll('.bookmark-btn').forEach(b=>{let id=b.dataset.id;b.onclick=e=>{e.stopPropagation();if(bookmarks.includes(id))bookmarks=bookmarks.filter(i=>i!==id);else bookmarks.push(id);localStorage.setItem('bookmarks',JSON.stringify(bookmarks));b.classList.toggle('visible',bookmarks.includes(id));};});
document.querySelectorAll('.share-btn').forEach(b=>{let id=b.dataset.id;b.onclick=e=>{e.stopPropagation();let s=Object.values(allStoriesCache).flatMap(c=>Object.entries(c||{})).find(([i])=>i===id)?.[1];if(navigator.share)navigator.share({title:s.title,text:s.content});else prompt('Copy story ID:',id);};});
document.querySelectorAll('.tts-btn').forEach(b=>{b.onclick=e=>{e.stopPropagation();let content=b.closest('.story-item').querySelector('.story-content').innerText;speechSynthesis.speak(new SpeechSynthesisUtterance(content));};});
document.querySelectorAll('.delete-btn').forEach(b=>{if(!isOwner)return;b.onclick=e=>{e.stopPropagation();let id=b.dataset.id;if(confirm('Delete?'))db.ref(`public/stories/${cat}/${id}`).remove();};});
document.querySelectorAll('.report-btn').forEach(b=>{b.onclick=e=>{e.stopPropagation();let id=b.dataset.id,r=prompt('Why report?');if(r)db.ref(`public/reports/${id}`).push({r,timestamp:Date.now()});alert('Reported');};});
document.querySelectorAll('.story-title-bar').forEach(bar=>{bar.addEventListener('click',(e)=>{if(e.target.closest('button'))return;let item=bar.closest('.story-item'),content=item.querySelector('.story-content'),expanded=content.classList.toggle('expanded');if(expanded)loadComments(item.dataset.id);});});}
async function loadComments(id){let snap=await db.ref(`public/comments/${id}`).once('value');let cs=snap.val()||{};let html=Object.entries(cs).map(([cid,c])=>`<div class="comment"><b>${escape(c.name||'Anonymous')}</b> <small>${new Date(c.timestamp).toLocaleString()}</small><br>${escape(c.text)} ${isOwner?`<button onclick="delComment('${id}','${cid}')">❌</button>`:''}</div>`).join('');document.getElementById(`comments-${id}`).innerHTML=html||'<i>no comments</i>';}
window.addComment=async(id)=>{let inp=document.getElementById(`comment-${id}`);if(!inp.value)return;let name=prompt('Your name (optional)')||'Anonymous';await db.ref(`public/comments/${id}`).push({name,text:inp.value,timestamp:Date.now()});inp.value='';loadComments(id);};
window.delComment=(id,cid)=>isOwner&&confirm('Delete?')&&db.ref(`public/comments/${id}/${cid}`).remove();
function renderBookmarks(){let items=[];Object.entries(allStoriesCache).forEach(([cat,st])=>Object.entries(st||{}).forEach(([id,s])=>{if(bookmarks.includes(id))items.push(`<div class="story-item" onclick="openCategory('${cat}')">🔖 ${escape(s.title)} <small>(${cat})</small></div>`);}));bookmarkDiv.innerHTML=items.join('')||'no bookmarks';}
addStoryBtn.onclick=()=>{if(!isOwner)return;addForm.style.display='flex';addStoryBtn.classList.remove('visible');};
cancelAdd.onclick=()=>{addForm.style.display='none';addStoryBtn.classList.add('visible');newTitle.value=newContent.value=newTags.value='';};
saveNew.onclick=()=>{if(!isOwner)return;let t=newTitle.value.trim(),c=newContent.value.trim(),tags=newTags.value.split(',').map(s=>s.trim()).filter(Boolean);if(!t||!c)return;db.ref(`public/stories/${currentCategory}`).push({title:t,content:c,tags,createdAt:Date.now(),likes:0}).then(()=>{addForm.style.display='none';addStoryBtn.classList.add('visible');newTitle.value=newContent.value=newTags.value='';});};
randomBtn.onclick=()=>{let flat=[];Object.entries(allStoriesCache).forEach(([cat,st])=>Object.entries(st||{}).forEach(([id,s])=>flat.push({cat,id,...s})));if(!flat.length)return;let r=flat[Math.floor(Math.random()*flat.length)];openCategory(r.cat);};
window.exportData=()=>{if(!isOwner)return;let data=JSON.stringify(allStoriesCache),b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='faith_stories_backup.json';a.click();};
let exportBtn=document.createElement('button');exportBtn.className='icon-btn';exportBtn.innerHTML='📥';exportBtn.onclick=exportData;document.querySelector('.btn-group').appendChild(exportBtn);
function escape(s){if(!s)return s;return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
loadCategories();
// Seed default stories if empty (optional)
(async()=>{let snap=await db.ref('public/stories').once('value');if(!snap.exists()){let def={"Sad Stories":[{"title":"The last thing she said","content":"My mother called on a Tuesday... I never got to say goodbye.","tags":["loss","family"],"createdAt":Date.now(),"likes":0}],"Funny Stories":[{"title":"The crazy chess man","content":"He moved knights like bishops...","tags":["humor"],"createdAt":Date.now(),"likes":0}]};for(let [cat,stories]of Object.entries(def)){for(let s of stories){await db.ref(`public/stories/${cat}`).push(s);}}}})();
</script></body></html>
