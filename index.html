<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App</title>
</head>

<body>
    <h1>Welcome to the Social App</h1>
    <div id="loginForm">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p>Don't have an account? <a href="#" onclick="showSignupForm()">Signup</a></p>
    </div>

    <div id="signupForm" style="display: none;">
        <h2>Signup</h2>
        <input type="text" id="name" placeholder="Name">
        <input type="file" id="profilePic" accept="image/*">
        <button onclick="signup()">Create Account</button>
        <p>Already have an account? <a href="#" onclick="showLoginForm()">Login</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID",
            measurementId: "YOUR_MEASUREMENT_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Implement login functionality using Firebase authentication
            // For demonstration purposes, you can console log the email and password
            console.log("Email: " + email);
            console.log("Password: " + password);
        }

        function signup() {
            const name = document.getElementById('name').value;
            const profilePic = document.getElementById('profilePic').files[0];

            // Implement signup functionality including uploading profile picture to Firebase Storage
            // For demonstration purposes, you can console log the name and profile picture
            console.log("Name: " + name);
            console.log("Profile Picture: " + profilePic.name);
        }

        function showSignupForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        }

        function showLoginForm() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }
    </script>
</body>

    </html>
