<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henicks Auto Photo Enhance</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: #fff;
    text-align: center;
}
header {
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
}
.container {
    padding: 15px;
    position: relative;
}
button, input {
    padding: 10px 14px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
}
button {
    background: #00e5ff;
    color: #000;
    cursor: pointer;
}
button:hover { opacity: 0.85; }
canvas {
    max-width: 100%;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}
#messageBox{
    position:absolute;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    padding:12px 20px;
    border-radius:12px;
    font-size:16px;
    display:none;
}
.sliderContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
}
.sliderBox {
    margin:5px;
    background: rgba(255,255,255,0.1);
    padding:5px 10px;
    border-radius:8px;
}
.sliderBox label {
    font-size:12px;
}
.sliderBox input {
    width:120px;
}
</style>
</head>
<body>

<header>Henicks Auto Photo Enhance</header>

<div class="container">
<input type="file" id="upload" accept="image/*"><br>
<button onclick="autoEnhance()">Ultra Clean Enhance</button>
<button onclick="blackWhite()">Black & White</button>
<button onclick="vivid()">Vivid Mode</button>
<button onclick="softSkin()">Soft Skin</button>
<button onclick="warmTone()">Warm Tone</button>
<button onclick="coolTone()">Cool Tone</button>
<button onclick="downloadImage()">Save Photo</button>
<div id="messageBox"></div>
<br>
<canvas id="canvas"></canvas>

<div class="sliderContainer" id="sliders">
    <!-- Sliders will be generated here -->
</div>
</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const msgBox = document.getElementById("messageBox");
let original = new Image();
let imgData = null;

// Slider settings
const sliderSettings = [
    {name:"Brightness", min:-100, max:100, val:0},
    {name:"Contrast", min:0, max:300, val:120},
    {name:"Saturation", min:0, max:300, val:115},
    {name:"Hue", min:-180, max:180, val:0},
    {name:"Warmth", min:-100, max:100, val:0},
    {name:"Exposure", min:-100, max:100, val:0},
    {name:"Highlights", min:-100, max:100, val:0},
    {name:"Shadows", min:-100, max:100, val:0},
    {name:"Midtones", min:-100, max:100, val:0},
    {name:"Sharpness", min:0, max:10, val:1},
    {name:"Noise Reduction", min:0, max:10, val:1},
    {name:"Skin Smooth", min:0, max:10, val:1},
    {name:"Eye Detail", min:0, max:10, val:1},
    {name:"Teeth Bright", min:0, max:10, val:1},
    {name:"Lips Color", min:0, max:10, val:1},
    {name:"Hair Shine", min:0, max:10, val:1},
    {name:"Glow", min:0, max:10, val:1},
    {name:"Vignette", min:0, max:10, val:0},
    {name:"Blur", min:0, max:10, val:0},
    {name:"Edge Enhance", min:0, max:10, val:1},
    {name:"Temperature", min:-100, max:100, val:0},
    {name:"Tint", min:-100, max:100, val:0},
    {name:"Clarity", min:0, max:10, val:1},
    {name:"Color Balance R", min:0, max:255, val:128},
    {name:"Color Balance G", min:0, max:255, val:128},
    {name:"Color Balance B", min:0, max:255, val:128},
    {name:"Gamma", min:0.1, max:3, val:1},
    {name:"Vibrance", min:0, max:300, val:100},
    {name:"Shadow Tint", min:-100, max:100, val:0},
    {name:"Highlight Tint", min:-100, max:100, val:0},
    {name:"Fade", min:0, max:100, val:0},
    {name:"Grain", min:0, max:10, val:0}
];

const sliderContainer = document.getElementById("sliders");

// Generate sliders dynamically
sliderSettings.forEach((s,i)=>{
    const box = document.createElement("div");
    box.className="sliderBox";
    box.innerHTML = `<label>${s.name}</label><br><input type="range" min="${s.min}" max="${s.max}" value="${s.val}" id="slider${i}">`;
    sliderContainer.appendChild(box);
    box.querySelector("input").addEventListener("input", applySliders);
});

upload.addEventListener("change", function(e){
    const reader = new FileReader();
    reader.onload = function(event){
        original.onload = function(){
            canvas.width = original.width;
            canvas.height = original.height;
            ctx.drawImage(original,0,0);
            imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        }
        original.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

// Messages for Auto Enhance
const messages=[
    "Your photo?🙄",
    "Your photo looks good, jealous down 👇.",
    "If you don't post this amazing photo on Facebook, chai, I will get shocked.😲",
    "Okay, your photo is cooked, ready to be eaten 🥪🌭",
    "How do you look, amazing, right?😁"
];

function showMessages(){
    let index=0;
    msgBox.style.display="block";
    const interval = setInterval(()=>{
        if(index>=messages.length){
            msgBox.style.display="none";
            clearInterval(interval);
            return;
        }
        msgBox.innerText=messages[index];
        index++;
    },1500);
}

// Clamp helper
function clamp(v){ return Math.max(0, Math.min(255, v)); }

// Apply all sliders
function applySliders(){
    if(!imgData) return;
    let d = new Uint8ClampedArray(imgData.data);
    const w = canvas.width;
    const h = canvas.height;

    const brightness = parseFloat(document.getElementById("slider0").value);
    const contrast = parseFloat(document.getElementById("slider1").value)/100;
    const saturation = parseFloat(document.getElementById("slider2").value)/100;
    const hue = parseFloat(document.getElementById("slider3").value);

    for(let i=0;i<d.length;i+=4){
        // Basic brightness/contrast
        for(let c=0;c<3;c++){
            d[i+c] = clamp((d[i+c]-128)*contrast + 128 + brightness);
        }
        // Saturation (simple)
        const avg = (d[i]+d[i+1]+d[i+2])/3;
        for(let c=0;c<3;c++){
            d[i+c] = clamp(avg + (d[i+c]-avg)*saturation);
        }
        // Hue adjustment skipped for simplicity (requires more complex math)
    }
    ctx.putImageData(new ImageData(d,w,h),0,0);
}

// Auto Enhance
function autoEnhance(){
    if(!imgData) return;
    showMessages();
    applySliders();
    canvas.style.filter="contrast(120%) saturate(115%)";
}

// Predefined filters
function blackWhite(){
    if(!imgData) return;
    const d = new Uint8ClampedArray(imgData.data);
    for(let i=0;i<d.length;i+=4){
        const avg = (d[i]+d[i+1]+d[i+2])/3;
        d[i]=d[i+1]=d[i+2]=avg;
    }
    ctx.putImageData(new ImageData(d,canvas.width,canvas.height),0,0);
    canvas.style.filter="none";
}
function vivid(){ canvas.style.filter="contrast(130%) saturate(140%)"; }
function softSkin(){ canvas.style.filter="blur(1px) contrast(105%)"; }
function warmTone(){ canvas.style.filter="contrast(115%) saturate(110%) sepia(0.15)"; }
function coolTone(){ canvas.style.filter="contrast(115%) saturate(110%) hue-rotate(180deg)"; }

// Download & clear
function downloadImage(){
    const link=document.createElement("a");
    link.download="henicks_auto_enhance.png";
    link.href=canvas.toDataURL("image/png");
    link.click();

    setTimeout(()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        upload.value="";
        canvas.style.filter="none";
    },500);
}
</script>

</body>
    </html>
