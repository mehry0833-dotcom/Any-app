<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Talks 🏡</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21}.screen{display:none;min-height:100vh;background:#fff}.active{display:block}.auth-container{max-width:400px;margin:50px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 2px 4px #0000001a}.auth-container h2{text-align:center;margin-bottom:20px;color:#1877f2}.auth-container input,.auth-container button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd}.auth-container button{background:#1877f2;color:#fff;font-weight:700;border:none;cursor:pointer}.dashboard-header{background:#1877f2;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:700}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}.dashboard-item{background:#fff;border-radius:8px;box-shadow:0 1px 3px #0000001a;text-align:center;padding:20px;cursor:pointer}.dashboard-item span{font-size:40px}.feature-header{background:#1877f2;color:#fff;padding:15px;display:flex;align-items:center;position:sticky;top:0;z-index:10}.back-btn{background:0 0;border:none;color:#fff;font-size:24px;margin-right:15px;cursor:pointer}.feature-header h3{flex:1;text-align:center}.feature-content{padding:20px}.friend-item,.user-item{padding:12px;margin:5px 0;background:#f0f2f5;border-radius:6px;display:flex;align-items:center;cursor:pointer}.friend-item img,.user-item img{width:40px;height:40px;border-radius:50%;margin-right:10px;object-fit:cover}.chat-messages{max-height:60vh;overflow-y:auto;border:1px solid #ddd;padding:10px;margin-bottom:10px}.chat-msg{padding:8px 12px;margin:5px 0;border-radius:18px;max-width:70%;clear:both}.sent{background:#1877f2;color:#fff;float:right}.received{background:#e4e6eb;float:left}.msg-input-area{display:flex;gap:10px;align-items:center}.msg-input-area input[type=text]{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px}.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}.pics-grid img{width:100%;height:100px;object-fit:cover;border-radius:8px;cursor:pointer}.status-post,.post-item{background:#f0f2f5;padding:15px;border-radius:8px;margin-bottom:10px}.status-post img,.post-item img{max-width:100%;border-radius:8px;margin-top:10px}.profile-pic{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:10px auto;display:block}#img-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000e6;display:none;justify-content:center;align-items:center;z-index:100}#full-img{max-width:95%;max-height:95%;border-radius:10px}audio{max-width:100%}
</style></head><body>
<!-- screens abbreviated -->
<div id="login-screen" class="screen active"><div class="auth-container"><h2>House Talks</h2><input id="login-email" placeholder="Email"><input id="login-password" type="password" placeholder="Password"><button onclick="login()">Log In</button><p style="text-align:center">No account? <a href="#" onclick="showAuth('signup')">Sign Up</a></p><div id="login-msg"></div></div></div>
<div id="signup-screen" class="screen"><div class="auth-container"><h2>Create Account</h2><input id="signup-name" placeholder="Full Name"><input id="signup-email" placeholder="Email"><input id="signup-password" type="password" placeholder="Password"><input id="signup-profile-pic" type="file" accept="image/*"><button onclick="signup()">Sign Up</button><p style="text-align:center">Have account? <a href="#" onclick="showAuth('login')">Log In</a></p><div id="signup-msg"></div></div></div>
<div id="dashboard-screen" class="screen"><div class="dashboard-header">House Talks</div><div class="dashboard-grid"><div class="dashboard-item" onclick="goToFeature('chats')"><span>💬</span><p>Chats</p></div><div class="dashboard-item" onclick="goToFeature('friends')"><span>👥</span><p>Friends</p></div><div class="dashboard-item" onclick="goToFeature('status')"><span>🎵</span><p>Status</p></div><div class="dashboard-item" onclick="goToFeature('pictures')"><span>🖼️</span><p>Pictures</p></div><div class="dashboard-item" onclick="goToFeature('happy')"><span>😊</span><p>Happy</p></div><div class="dashboard-item" onclick="goToFeature('profile')"><span>👤</span><p>Profile</p></div><div class="dashboard-item" onclick="goToFeature('settings')"><span>⚙️</span><p>Settings</p></div></div></div>
<div id="chats-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Chats</h3></div><div class="feature-content"><div id="chat-list"></div><div id="chat-window" style="display:none"><div><button onclick="closeChatWindow()">← Back</button><h4 id="chat-with-name"></h4></div><div id="chat-messages" class="chat-messages"></div><div class="msg-input-area"><input id="msg-text" placeholder="Type a message"><input id="chat-img" type="file" accept="image/*" style="display:none" onchange="attachMedia('image')"><input id="chat-audio" type="file" accept="audio/*" style="display:none" onchange="attachMedia('audio')"><button onclick="document.getElementById('chat-img').click()">📷</button><button onclick="document.getElementById('chat-audio').click()">🎤</button><button onclick="sendChatMessage()">Send</button></div></div></div></div>
<div id="friends-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Friends</h3></div><div class="feature-content"><input id="friend-search-input" placeholder="Search..."><button onclick="searchUsers()">Search</button><div id="search-results"></div><h4>Your Friends</h4><div id="friend-list"></div></div></div>
<div id="status-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Status</h3></div><div class="feature-content"><textarea id="status-text" rows="3" placeholder="What's on your mind?"></textarea><input id="status-img" type="file" accept="image/*"><input id="status-audio" type="file" accept="audio/*"><button onclick="postStatus()">Post</button><div id="status-feed"></div></div></div>
<div id="pictures-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>All Pictures</h3></div><div class="feature-content"><div id="pictures-grid" class="pics-grid"></div></div></div>
<div id="happy-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Happy Zone</h3></div><div class="feature-content"><textarea id="happy-text" rows="3" placeholder="What makes you happy?"></textarea><input id="happy-img" type="file" accept="image/*"><button onclick="postHappy()">Post</button><div id="happy-feed"></div></div></div>
<div id="profile-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Profile</h3></div><div class="feature-content"><img id="profile-pic-display" class="profile-pic"><p><strong>Name:</strong> <span id="profile-name"></span></p><p><strong>Email:</strong> <span id="profile-email"></span></p><input id="new-profile-pic" type="file" accept="image/*"><button onclick="updateProfilePic()">Update Picture</button></div></div>
<div id="settings-screen" class="screen feature-screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Settings</h3></div><div class="feature-content"><button onclick="logout()" style="background:#f02849;color:#fff;padding:12px;width:100%;border:none;border-radius:6px">Logout</button></div></div>
<div id="img-overlay" onclick="this.style.display='none'"><img id="full-img"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const fc={apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi"};firebase.initializeApp(fc);const auth=firebase.auth(),db=firebase.database();let cu=null,ccid=null,ccf=null,media=null;
function fileToBase64(f,cb){if(!f){cb(null);return}if(f.type.startsWith('image/')){const r=new FileReader();r.onload=e=>{const i=new Image;i.src=e.target.result;i.onload=()=>{const c=document.createElement('canvas'),MAX=800;let w=i.width,h=i.height;if(w>MAX||h>MAX){if(w>h){h*=MAX/w;w=MAX}else{w*=MAX/h;h=MAX}}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);cb(c.toDataURL('image/jpeg',0.7))}};r.readAsDataURL(f)}else{if(f.size>1048576){alert('File too large');cb(null);return}const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}}
function showAuth(s){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(s+'-screen').classList.add('active')}
function signup(){const n=document.getElementById('signup-name').value.trim(),e=document.getElementById('signup-email').value.trim(),p=document.getElementById('signup-password').value,f=document.getElementById('signup-profile-pic').files[0];if(!n||!e||!p)return document.getElementById('signup-msg').innerText='All fields required';auth.createUserWithEmailAndPassword(e,p).then(c=>{fileToBase64(f,b=>{db.ref('users/'+c.user.uid).set({name:n,email:e,profilePic:b||null})})}).catch(e=>document.getElementById('signup-msg').innerText=e.message)}
function login(){const e=document.getElementById('login-email').value.trim(),p=document.getElementById('login-password').value;auth.signInWithEmailAndPassword(e,p).catch(e=>document.getElementById('login-msg').innerText=e.message)}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{if(u){cu=u;db.ref('users/'+u.uid).once('value',s=>{const d=s.val()||{};document.getElementById('profile-name').innerText=d.name||'';document.getElementById('profile-email').innerText=d.email||'';document.getElementById('profile-pic-display').src=d.profilePic||''});showDashboard()}else{cu=null;showAuth('login')}});
function showDashboard(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('dashboard-screen').classList.add('active')}
function goToDashboard(){showDashboard()}
function goToFeature(f){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(f+'-screen').classList.add('active');if(f=='chats')loadChatList();if(f=='friends'){loadFriendList();document.getElementById('search-results').innerHTML=''}if(f=='status')loadStatusFeed();if(f=='pictures')loadAllPictures();if(f=='happy')loadHappyFeed()}
function searchUsers(){const t=document.getElementById('friend-search-input').value.toLowerCase();if(!t)return;db.ref('users').once('value',s=>{let h='';Object.entries(s.val()||{}).forEach(([i,u])=>{if(i!==cu.uid&&u.name&&u.name.toLowerCase().includes(t))h+=`<div class="user-item" onclick="addFriend('${i}')"><img src="${u.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u.name}</span></div>`});document.getElementById('search-results').innerHTML=h||'None'})}
function addFriend(i){db.ref('friends/'+cu.uid+'/'+i).set(true);db.ref('friends/'+i+'/'+cu.uid).set(true);alert('Friend added');loadFriendList()}
function loadFriendList(){db.ref('friends/'+cu.uid).once('value',s=>{const l=document.getElementById('friend-list');l.innerHTML='';Object.keys(s.val()||{}).forEach(i=>{db.ref('users/'+i).once('value',s2=>{const u=s2.val();if(u)l.innerHTML+=`<div class="friend-item" onclick="openChat('${i}','${u.name}')"><img src="${u.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u.name}</span></div>`})})})}
function loadChatList(){const c=document.getElementById('chat-list');c.innerHTML='';db.ref('friends/'+cu.uid).once('value',s=>{Object.keys(s.val()||{}).forEach(i=>{db.ref('users/'+i).once('value',s2=>{const u=s2.val();if(u)c.innerHTML+=`<div class="friend-item" onclick="openChat('${i}','${u.name}')"><img src="${u.profilePic||''}" onerror="this.src='https://via.placeholder.com/40'"><span>${u.name}</span></div>`})})})}
function openChat(i,n){ccf={uid:i,name:n};ccid=[cu.uid,i].sort().join('_');document.getElementById('chat-list').style.display='none';document.getElementById('chat-window').style.display='block';document.getElementById('chat-with-name').innerText=n;loadChatMessages()}
function closeChatWindow(){document.getElementById('chat-window').style.display='none';document.getElementById('chat-list').style.display='block';if(ccid)db.ref('messages/'+ccid).off();ccid=null}
function attachMedia(t){const f=document.getElementById(t=='image'?'chat-img':'chat-audio').files[0];if(f)fileToBase64(f,b=>media={type:t,data:b})}
function sendChatMessage(){const t=document.getElementById('msg-text').value.trim();if(!t&&!media)return;const m={sender:cu.uid,timestamp:Date.now(),text:t};if(media){m.media=media;media=null}db.ref('messages/'+ccid).push(m).then(()=>{document.getElementById('msg-text').value='';document.getElementById('chat-img').value='';document.getElementById('chat-audio').value=''})}
function loadChatMessages(){const d=document.getElementById('chat-messages');db.ref('messages/'+ccid).orderByChild('timestamp').on('value',s=>{d.innerHTML='';s.forEach(c=>{const m=c.val(),div=document.createElement('div');div.className='chat-msg '+(m.sender===cu.uid?'sent':'received');let ct=m.text?`<div>${m.text}</div>`:'';if(m.media){if(m.media.type==='image')ct+=`<img src="${m.media.data}" style="max-width:200px;border-radius:8px;" onclick="showFullImage('${m.media.data}')">`;else if(m.media.type==='audio')ct+=`<audio controls src="${m.media.data}"></audio>`}div.innerHTML=ct;d.appendChild(div)});d.scrollTop=d.scrollHeight})}
function postStatus(){const t=document.getElementById('status-text').value.trim(),fi=document.getElementById('status-img').files[0],fa=document.getElementById('status-audio').files[0];if(!t&&!fi&&!fa)return alert('Empty');const p={uid:cu.uid,timestamp:Date.now(),text:t};Promise.all([fi?new Promise(r=>fileToBase64(fi,r)):null,fa?new Promise(r=>fileToBase64(fa,r)):null]).then(([img,aud])=>{if(img)p.image=img;if(aud)p.audio=aud;db.ref('statuses').push(p).then(()=>{document.getElementById('status-text').value='';document.getElementById('status-img').value='';document.getElementById('status-audio').value='';loadStatusFeed()})})}
function loadStatusFeed(){db.ref('statuses').orderByChild('timestamp').limitToLast(20).once('value',async s=>{const f=document.getElementById('status-feed');f.innerHTML='';const ps=[];s.forEach(c=>ps.push(c.val()));ps.reverse().forEach(async p=>{const u=(await db.ref('users/'+p.uid).once('value')).val()||{name:'Unknown'};f.innerHTML+=`<div class="status-post"><strong>${u.name}</strong> <small>${new Date(p.timestamp).toLocaleString()}</small><div>${p.text||''}</div>${p.image?`<img src="${p.image}" onclick="showFullImage('${p.image}')">`:''}${p.audio?`<audio controls src="${p.audio}"></audio>`:''}</div>`})})}
function loadAllPictures(){const g=document.getElementById('pictures-grid');g.innerHTML='';db.ref('statuses').once('value',s=>{s.forEach(c=>{const p=c.val();if(p.image)g.innerHTML+=`<img src="${p.image}" onclick="showFullImage('${p.image}')">`})});db.ref('happy').once('value',s=>{s.forEach(c=>{const p=c.val();if(p.image)g.innerHTML+=`<img src="${p.image}" onclick="showFullImage('${p.image}')">`})})}
function postHappy(){const t=document.getElementById('happy-text').value.trim(),f=document.getElementById('happy-img').files[0];if(!t&&!f)return alert('Empty');const p={uid:cu.uid,timestamp:Date.now(),text:t};if(f)fileToBase64(f,i=>{if(i)p.image=i;db.ref('happy').push(p).then(()=>{document.getElementById('happy-text').value='';document.getElementById('happy-img').value='';loadHappyFeed()})});else db.ref('happy').push(p).then(()=>{document.getElementById('happy-text').value='';loadHappyFeed()})}
function loadHappyFeed(){db.ref('happy').orderByChild('timestamp').limitToLast(20).once('value',async s=>{const f=document.getElementById('happy-feed');f.innerHTML='';const ps=[];s.forEach(c=>ps.push(c.val()));ps.reverse().forEach(async p=>{const u=(await db.ref('users/'+p.uid).once('value')).val()||{name:'Unknown'};f.innerHTML+=`<div class="post-item"><strong>${u.name}</strong> <small>${new Date(p.timestamp).toLocaleString()}</small><div>${p.text||''}</div>${p.image?`<img src="${p.image}" onclick="showFullImage('${p.image}')">`:''}</div>`})})}
function updateProfilePic(){const f=document.getElementById('new-profile-pic').files[0];if(!f)return;fileToBase64(f,b=>{if(b)db.ref('users/'+cu.uid+'/profilePic').set(b).then(()=>{document.getElementById('profile-pic-display').src=b;alert('Profile pic updated')})})}
function showFullImage(s){document.getElementById('full-img').src=s;document.getElementById('img-overlay').style.display='flex'}
</script>
</body></html>
