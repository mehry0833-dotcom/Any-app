<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Talks 🗨️</title>
<style>
body{margin:0;padding:0;font-family:sans-serif;background:#032B44;color:#fff}
.screen{display:none;padding:20px;padding-top:60px}
.active{display:block}
.nav{position:fixed;top:0;width:100%;background:#021c2e;padding:10px;text-align:center;z-index:10}
.nav button{background:#1E90FF;color:#fff;border:none;padding:8px 12px;border-radius:20px;margin:3px;cursor:pointer}
input{padding:6px;margin:5px 0;width:calc(100% - 12px);border-radius:5px;border:none}
button{cursor:pointer}
.chat-msg,.status-post{padding:10px;margin:10px 0;border-radius:8px;background:#05386B}
.sent{background:#00BFFF;margin-left:auto}
.received{background:#1E90FF}
img{max-width:100%;border-radius:6px;margin-top:5px}
audio{width:100%;margin-top:5px}
</style>
</head>
<body>

<div class="nav">
<button onclick="showScreen('home')">🏠</button>
<button onclick="showScreen('chats')">💬</button>
<button onclick="showScreen('status')">🎵</button>
<button onclick="showScreen('posts')">📝</button>
<button onclick="showScreen('pictures')">🖼️</button>
<button onclick="showScreen('happy')">😊</button>
</div>

<div id="home-screen" class="screen active">
<h2>Welcome to House Talks</h2>
<p>All features working. Explore freely.</p>
</div>

<div id="chats-screen" class="screen">
<h2>Chats</h2>
<input id="name-input" placeholder="Enter your name">
<button onclick="setName()">Save</button>
<input id="msg-input" placeholder="Message">
<input type="file" id="chat-image" accept="image/*">
<input type="file" id="chat-audio" accept="audio/*">
<button onclick="sendMsg()">Send</button>
<button onclick="clearChats()">Clear All</button>
<div id="chat-log"></div>
</div>

<div id="status-screen" class="screen">
<h2>Status</h2>
<input id="status-input" placeholder="What's up?">
<input type="file" id="status-image" accept="image/*">
<input type="file" id="status-music" accept="audio/*">
<button onclick="postStatus()">Post</button>
<div id="status-log"></div>
</div>

<div id="posts-screen" class="screen">
<h2>Posts</h2>
<input id="post-input" placeholder="Share something">
<input type="file" id="post-image" accept="image/*">
<button onclick="post()">Post</button>
<div id="post-log"></div>
</div>

<div id="pictures-screen" class="screen">
<h2>All Pictures</h2>
<div id="pics-log"></div>
</div>

<div id="happy-screen" class="screen">
<h2>Happy Zone</h2>
<input id="happy-input" placeholder="What makes you happy?">
<input type="file" id="happy-image" accept="image/*">
<button onclick="postHappy()">Post</button>
<div id="happy-log"></div>
</div>

<script>
// Storage
let name = localStorage.getItem('name') || '';
let chats = JSON.parse(localStorage.getItem('chats')||'[]');
let statuses = JSON.parse(localStorage.getItem('statuses')||'[]');
let posts = JSON.parse(localStorage.getItem('posts')||'[]');
let happyPosts = JSON.parse(localStorage.getItem('happyPosts')||'[]');

function showScreen(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screen+'-screen').classList.add('active');
  if(screen==='chats') loadChats();
  if(screen==='status') loadStatuses();
  if(screen==='posts') loadPosts();
  if(screen==='happy') loadHappy();
  if(screen==='pictures') loadPics();
}

// Name
function setName(){ 
  name = document.getElementById('name-input').value.trim();
  if(name) localStorage.setItem('name', name);
}

// Chat Functions
function sendMsg(){
  if(!name){alert('Enter your name first'); return;}
  let msg = document.getElementById('msg-input').value;
  let img = document.getElementById('chat-image').files[0];
  let audio = document.getElementById('chat-audio').files[0];
  if(!msg && !img && !audio) return;
  chats.push({from:name,msg:msg||'',img:img?URL.createObjectURL(img):null,audio:audio?URL.createObjectURL(audio):null,time:new Date().toLocaleTimeString()});
  localStorage.setItem('chats', JSON.stringify(chats));
  document.getElementById('msg-input').value=''; document.getElementById('chat-image').value=''; document.getElementById('chat-audio').value='';
  loadChats();
}
function loadChats(){
  let log = document.getElementById('chat-log'); log.innerHTML='';
  chats.forEach((c,i)=>{
    log.innerHTML += `<div class="chat-msg ${c.from===name?'sent':'received'}">
      <b>${c.from}</b><br>${c.msg||''}
      ${c.img?`<img src="${c.img}">`:''}
      ${c.audio?`<audio controls src="${c.audio}"></audio>`:''}
      <br><small>${c.time}</small><br>
      <button onclick="deleteChat(${i})">Delete</button>
    </div>`;
  });
}
function deleteChat(i){ chats.splice(i,1); localStorage.setItem('chats',JSON.stringify(chats)); loadChats(); }
function clearChats(){ chats=[]; localStorage.removeItem('chats'); loadChats(); }

// Status
function postStatus(){
  if(!name){alert('Enter your name first'); return;}
  let txt=document.getElementById('status-input').value;
  let img=document.getElementById('status-image').files[0];
  let music=document.getElementById('status-music').files[0];
  if(!txt && !img && !music) return;
  statuses.push({user:name,status:txt||'',img:img?URL.createObjectURL(img):null,music:music?URL.createObjectURL(music):null,time:new Date().toLocaleTimeString()});
  localStorage.setItem('statuses', JSON.stringify(statuses));
  document.getElementById('status-input').value=''; document.getElementById('status-image').value=''; document.getElementById('status-music').value='';
  loadStatuses();
}
function loadStatuses(){
  let log=document.getElementById('status-log'); log.innerHTML='';
  statuses.forEach((s,i)=>{
    log.innerHTML += `<div class="status-post">
      <b>${s.user}</b><br>${s.status||''}
      ${s.img?`<img src="${s.img}">`:''}
      ${s.music?`<audio controls src="${s.music}"></audio>`:''}
      <br><small>${s.time}</small><br>
      <button onclick="deleteStatus(${i})">Delete</button>
    </div>`;
  });
}
function deleteStatus(i){statuses.splice(i,1); localStorage.setItem('statuses',JSON.stringify(statuses)); loadStatuses();}

// Posts
function post(){
  let txt=document.getElementById('post-input').value;
  let img=document.getElementById('post-image').files[0];
  if(!txt && !img) return;
  posts.push({txt:txt||'',img:img?URL.createObjectURL(img):null,time:new Date().toLocaleTimeString()});
  localStorage.setItem('posts',JSON.stringify(posts));
  document.getElementById('post-input').value=''; document.getElementById('post-image').value='';
  loadPosts();
}
function loadPosts(){
  let log=document.getElementById('post-log'); log.innerHTML='';
  posts.forEach((p,i)=>{
    log.innerHTML += `<div class="status-post">
      ${p.txt||''}
      ${p.img?`<img src="${p.img}">`:''}
      <br><small>${p.time}</small><br>
      <button onclick="deletePost(${i})">Delete</button>
    </div>`;
  });
}
function deletePost(i){posts.splice(i,1); localStorage.setItem('posts',JSON.stringify(posts)); loadPosts();}

// Happy
function postHappy(){
  let txt=document.getElementById('happy-input').value;
  let img=document.getElementById('happy-image').files[0];
  if(!txt && !img) return;
  happyPosts.push({txt:txt||'',img:img?URL.createObjectURL(img):null,time:new Date().toLocaleTimeString()});
  localStorage.setItem('happyPosts',JSON.stringify(happyPosts));
  document.getElementById('happy-input').value=''; document.getElementById('happy-image').value='';
  loadHappy();
}
function loadHappy(){
  let log=document.getElementById('happy-log'); log.innerHTML='';
  happyPosts.forEach((h,i)=>{
    log.innerHTML += `<div class="status-post">
      ${h.txt||''}
      ${h.img?`<img src="${h.img}">`:''}
      <br><small>${h.time}</small><br>
      <button onclick="deleteHappy(${i})">Delete</button>
    </div>`;
  });
}
function deleteHappy(i){happyPosts.splice(i,1); localStorage.setItem('happyPosts',JSON.stringify(happyPosts)); loadHappy();}

// Pictures
function loadPics(){
  let log=document.getElementById('pics-log'); log.innerHTML='';
  [...chats,...statuses,...posts,...happyPosts].forEach(p=>{ if(p.img) log.innerHTML += `<img src="${p.img}">`});
}

</script>
</body>
  </html>
