<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>House Talks</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f0f2f5;color:#1c1e21}.screen{display:none;min-height:100vh;background:#fff}.active{display:block}.auth-container{max-width:400px;margin:50px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}.auth-container h2{text-align:center;margin-bottom:20px;color:#1877f2}.auth-container input,.auth-container button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd;font-size:16px}.auth-container button{background:#1877f2;color:#fff;font-weight:700;border:none;cursor:pointer}.dashboard-header{background:#1877f2;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:700}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}.dashboard-item{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:center;padding:20px;cursor:pointer}.dashboard-item span{font-size:40px;display:block}.feature-header{background:#1877f2;color:#fff;padding:15px;display:flex;align-items:center;position:sticky;top:0;z-index:10}.back-btn{background:none;border:none;color:#fff;font-size:28px;margin-right:15px;cursor:pointer}.chat-messages{max-height:60vh;overflow-y:auto;border:1px solid #ddd;padding:10px;margin-bottom:10px}.chat-msg{padding:8px 12px;margin:5px 0;border-radius:18px;max-width:70%;clear:both;word-wrap:break-word}.sent{background:#1877f2;color:#fff;float:right}.received{background:#e4e6eb;float:left}.msg-input-area{display:flex;gap:8px;align-items:center}.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}
    </style>
</head>
<body>
<div id="login-screen" class="screen active">
    <div class="auth-container">
        <h2>House Talks</h2>
        <input type="email" id="login-email" placeholder="Email"><input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <p style="text-align:center">No account? <a href="#" onclick="showAuth('signup')">Sign Up</a></p>
        <div id="login-msg"></div>
    </div>
</div>
<div id="signup-screen" class="screen">
    <div class="auth-container">
        <h2>Create Account</h2>
        <input type="text" id="signup-name" placeholder="Name"><input type="email" id="signup-email" placeholder="Email"><input type="password" id="signup-password" placeholder="Password"><input type="file" id="signup-profile-pic" accept="image/*">
        <button onclick="signup()">Sign Up</button>
        <p style="text-align:center">Have account? <a href="#" onclick="showAuth('login')">Log In</a></p>
        <div id="signup-msg"></div>
    </div>
</div>
<div id="dashboard-screen" class="screen">
    <div class="dashboard-header">House Talks</div>
    <div class="dashboard-grid">
        <div class="dashboard-item" onclick="goToFeature('chats')"><span>💬</span><p>Chats</p></div>
        <div class="dashboard-item" onclick="goToFeature('friends')"><span>👥</span><p>Friends</p></div>
        <div class="dashboard-item" onclick="goToFeature('status')"><span>🎵</span><p>Status</p></div>
        <div class="dashboard-item" onclick="goToFeature('pictures')"><span>🖼️</span><p>Pictures</p></div>
        <div class="dashboard-item" onclick="goToFeature('happy')"><span>😊</span><p>Happy</p></div>
        <div class="dashboard-item" onclick="goToFeature('profile')"><span>👤</span><p>Profile</p></div>
        <div class="dashboard-item" onclick="goToFeature('settings')"><span>⚙️</span><p>Settings</p></div>
    </div>
</div>
<div id="chats-screen" class="screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Chats</h3></div><div class="feature-content"><div id="chat-list"></div><div id="chat-window" style="display:none"><button onclick="closeChatWindow()">← Back</button><h4 id="chat-with-name"></h4><div id="chat-messages" class="chat-messages"></div><div class="msg-input-area"><input type="text" id="msg-text"><button onclick="sendChatMessage()">Send</button></div></div></div></div>
<div id="friends-screen" class="screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Friends</h3></div><div class="feature-content"><input id="friend-search-input"><button onclick="searchUsers()">Search</button><div id="friend-list"></div></div></div>
<div id="status-screen" class="screen"><div class="feature-header"><button class="back-btn" onclick="goToDashboard()">←</button><h3>Status</h3></div></div>
</body>
                                                                 </html>
