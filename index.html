<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zee Web to App</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

header {
    background: #000;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
}

input {
    width: 80%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 20px;
    font-size: 16px;
}

button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    background: #00ff88;
    font-weight: bold;
    cursor: pointer;
}

iframe {
    width: 100%;
    height: 80vh;
    border: none;
    margin-top: 10px;
    background: white;
}
</style>
</head>

<body>

<header>Zee Simple Web → App Viewer</header>

<input id="urlInput" placeholder="Enter full URL (https://example.com)">
<br>
<button onclick="loadSite()">Load Website</button>

<iframe id="viewer"></iframe>

<script>
function loadSite() {
    let url = document.getElementById("urlInput").value.trim();

    if (!url.startsWith("http")) {
        alert("Enter full URL starting with https://");
        return;
    }

    document.getElementById("viewer").src = url;
}
</script>

</body>
</html>
