<!doctype html>
<html><head><meta charset="utf-8"/><title>Mini Social</title><style>
body{font-family:Arial; margin:0; padding:0; background:#f5f5f5}
header{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#222; color:#fff}
.tabs{display:flex; gap:8px; padding:6px}
.tab{background:#333; color:#fff; border:1px solid #555; padding:8px 12px; cursor:pointer}
.tab.active{background:#fff; color:#000; border-color:#ccc}
.screen{display:none; padding:12px}
.screen.active{display:block}
.card{border:1px solid #ddd; background:#fff; padding:8px; border-radius:6px; margin:6px 0}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
img{max-width:100%; height:auto; display:block}
</style></head>
<body onload="initApp()">
<header>
  <div>Mini Social</div>
  <div id="notif" aria-live="polite"></div>
</header>

<div class="tabs" aria-label="Main sections">
  <button class="tab active" onclick="show('chats')">Chats</button>
  <button class="tab" onclick="show('status')">Status</button>
  <button class="tab" onclick="show('posts')">Posts</button>
  <button class="tab" onclick="show('pictures')">Pictures</button>
  <button class="tab" onclick="show('happy')">What makes me happy</button>
</div>

<div id="chats" class="screen active">
  <div id="chatList"></div>
  <input id="chatName" placeholder="Your name" style="width:40%; margin-right:6px"/>
  <input id="chatInput" placeholder="Type a message" style="width:40%"/>
  <input type="file" id="chatImage" accept="image/*" style="display:none" />
  <button onclick="document.getElementById('chatImage').click()">Attach</button>
  <button onclick="sendChat()">Send</button>
</div>

<div id="status" class="screen">
  <div id="statusList"></div>
  <textarea id="statusText" placeholder="What's new?" style="width:100%; height:60px"></textarea>
  <input type="file" id="statusImage" accept="image/*" style="display:block"/>
  <input type="file" id="statusSong" accept="audio/*" style="display:block"/>
  <button onclick="postStatus()">Post</button>
</div>

<div id="posts" class="screen">
  <div class="card" style="padding:6px 0">
    <input id="postText" placeholder="Share something..." style="width:70%"/>
    <input type="file" id="postImage" accept="image/*" style="display:inline-block"/>
    <button onclick="addPost()">Post</button>
  </div>
  <div id="postFeed"></div>
</div>

<div id="pictures" class="screen grid" style="padding-top:6px"></div>

<div id="happy" class="screen">
  <div class="card" style="padding:6px 0">
    <textarea id="happyText" placeholder="What makes you happy?" style="width:100%; height:60px"></textarea>
    <input type="file" id="happyImage" accept="image/*"/>
    <button onclick="postHappy()">Post</button>
  </div>
  <div id="happyFeed"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('miniSocial')) || {
  chats: [], statuses: [], posts: [], pictures: [], happy: []
};
function save(){ localStorage.setItem('miniSocial', JSON.stringify(data)); }
function show(id){ document.querySelectorAll('.screen').forEach(n=>n.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function renderAll(){ renderChats(); renderStatuses(); renderPosts(); renderPics(); renderHappy(); }

function renderChats(){
  const el = document.getElementById('chatList');
  el.innerHTML = data.chats.map(m => `<div class="card"><strong>${escape(m.name||'Guest')}</strong>: ${escape(m.text||'')} ${m.image? `<br><img src="${m.image}" style="max-width:100%">`:''}</div>`).join('');
}
function renderStatuses(){
  const el = document.getElementById('statusList');
  el.innerHTML = data.statuses.map(s => `<div class="card">${escape(s.text||'')} ${s.image? `<br><img src="${s.image}" style="max-width:100%">`:''} ${s.song? `<br><audio controls src="${s.song}"></audio>`:''}</div>`).join('');
}
function renderPosts(){
  const el = document.getElementById('postFeed');
  el.innerHTML = data.posts.map(p => `<div class="card">${escape(p.text||'')} ${p.image? `<br><img src="${p.image}" style="max-width:100%">`:''}</div>`).join('');
}
function renderPics(){
  const el = document.getElementById('pictures');
  el.innerHTML = data.pictures.map(p => `<img src="${p}" />`).join('');
}
function renderHappy(){
  const el = document.getElementById('happyFeed');
  el.innerHTML = data.happy.map(h => `<div class="card">${escape(h.text||'')} ${h.image? `<br><img src="${h.image}" style="max-width:100%">`:''}</div>`).join('');
}
function escape(t){ return (''+t).replace(/[&<>"']/g, m => ({&:'&amp;',<:'&lt;',>: '&gt;', '"':'&quot;', "'":'&#39;'}[m])); }

function initApp(){
  renderAll();
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', ()=>{}));
}
function sendChat(){
  const name = (document.getElementById('chatName').value || 'Guest');
  const text = document.getElementById('chatInput').value;
  if(!text) return;
  const img = document.getElementById('chatImage').files[0];
  if(img){
    const r = new FileReader();
    r.onload = e => {
      data.chats.push({name, text, image:e.target.result});
      save(); renderChats(); document.getElementById('chatInput').value=''; document.getElementById('chatName').value=''; document.getElementById('chatImage').value='';
      show('chats'); document.getElementById('notif').textContent='Message sent';
    }; r.readAsDataURL(img);
  } else {
    data.chats.push({name, text});
    save(); renderChats(); document.getElementById('chatInput').value=''; document.getElementById('chatName').value='';
    document.getElementById('notif').textContent='Message sent';
  }
}
function postStatus(){
  const t = document.getElementById('statusText').value;
  if(!t) return;
  const img = document.getElementById('statusImage').files[0];
  const song = document.getElementById('statusSong').files[0];
  if(img){
    const r = new FileReader();
    r.onload = e => {
      const item = { text:t, image:e.target.result };
      if(song){
        const sr = new FileReader();
        sr.onload = ee => { item.song = ee.target.result; data.statuses.push(item); save(); renderStatuses(); };
        sr.readAsDataURL(song);
      } else { data.statuses.push(item); save(); renderStatuses(); }
    }; r.readAsDataURL(img);
  } else if(song){
    const sr = new FileReader();
    sr.onload = ee => { data.statuses.push({ text: t, song: ee.target.result }); save(); renderStatuses(); };
    sr.readAsDataURL(song);
  } else { data.statuses.push({ text: t }); save(); renderStatuses(); }
  document.getElementById('statusText').value=''; document.getElementById('statusImage').value=''; document.getElementById('statusSong').value='';
  show('status'); document.getElementById('notif').textContent='Status posted';
}
function addPost(){
  const t = document.getElementById('postText').value; if(!t) return;
  const img = document.getElementById('postImage').files[0];
  if(img){
    const r = new FileReader();
    r.onload = e => { data.posts.push({ text:t, image:e.target.result }); save(); renderPosts(); document.getElementById('postText').value=''; document.getElementById('postImage').value=''; };
    r.readAsDataURL(img);
  } else { data.posts.push({ text:t }); save(); renderPosts(); document.getElementById('postText').value=''; }
}
function postHappy(){
  const t = document.getElementById('happyText').value; if(!t) return;
  const img = document.getElementById('happyImage').files[0];
  if(img){
    const r=new FileReader();
    r.onload=e=>{ data.happy.push({ text:t, image:e.target.result }); save(); renderHappy(); document.getElementById('happyText').value=''; document.getElementById('happyImage').value=''; };
    r.readAsDataURL(img);
  } else { data.happy.push({ text:t }); save(); renderHappy(); document.getElementById('happyText').value=''; }
}
initApp();
</script>
</body></html>
