<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zee Ultra Chat</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,sans-serif;
background:linear-gradient(135deg,#1f2937,#111827);
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

nav{
display:flex;
justify-content:center;
gap:15px;
padding:10px;
}

nav button{
padding:8px 15px;
border:none;
border-radius:20px;
background:#2563eb;
color:white;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.screen{
flex:1;
display:none;
overflow-y:auto;
padding:15px;
}

#chatScreen{display:block;}

.message{
max-width:75%;
padding:12px;
margin:10px 0;
border-radius:18px;
position:relative;
animation:fade .3s ease;
}

.left{
background:linear-gradient(135deg,#374151,#4b5563);
align-self:flex-start;
}

.right{
background:linear-gradient(135deg,#2563eb,#3b82f6);
align-self:flex-end;
}

.sender{
font-size:12px;
opacity:.8;
margin-bottom:5px;
}

.time{
font-size:10px;
opacity:.6;
margin-top:5px;
}

.options{
font-size:12px;
opacity:.7;
cursor:pointer;
margin-top:5px;
}

.reactions{
margin-top:5px;
font-size:14px;
display:flex;
gap:10px;
cursor:pointer;
}

.inputArea{
display:flex;
gap:5px;
padding:10px;
background:#111827;
}

input{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

.sendBtn{
width:45px;
border:none;
border-radius:50%;
background:#10b981;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.statusBox{
text-align:center;
}

.statusImg{
width:200px;
border-radius:15px;
margin-top:10px;
}

.typing{
font-size:12px;
opacity:.6;
margin-top:5px;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>Zee Ultra Chat</header>

<nav>
<button onclick="showChat()">Chat</button>
<button onclick="showStatus()">Status</button>
</nav>

<div id="chatScreen" class="screen"></div>

<div id="statusScreen" class="screen">
<div class="statusBox">
<input type="file" id="statusInput">
<br><br>
<button onclick="postStatus()">Post Status</button>
<br>
<img id="statusImage" class="statusImg">
</div>
</div>

<div class="typing" id="typing"></div>

<div class="inputArea">
<input id="nameInput" placeholder="Your name">
<input id="messageInput" placeholder="Type message">
<button class="sendBtn" onclick="sendMessage()">🗨️</button>
</div>

<script>

let messages=JSON.parse(localStorage.getItem("zeeMessages"))||[]
let side=true

function save(){
localStorage.setItem("zeeMessages",JSON.stringify(messages))
}

function render(){
chatScreen.innerHTML=""
messages.forEach((m,i)=>{
let div=document.createElement("div")
div.className="message "+(side?"right":"left")
side=!side

div.innerHTML=`
<div class="sender">${m.name}</div>
<div>${m.text}</div>
<div class="time">${m.time}</div>
<div class="options" onclick="menu(${i})">(:)</div>
<div class="reactions">
<span onclick="react(${i},'👍')">👍</span>
<span onclick="react(${i},'❤️')">❤️</span>
<span onclick="react(${i},'👎')">👎</span>
</div>
`

chatScreen.appendChild(div)
})
chatScreen.scrollTop=chatScreen.scrollHeight
}

function sendMessage(){
let name=nameInput.value.trim()
let text=messageInput.value.trim()
if(!name||!text)return alert("Enter name and message")

messages.push({
name:name,
text:text,
time:new Date().toLocaleString()
})

save()
render()
messageInput.value=""
}

function menu(i){
let action=prompt("Type: edit / delete / info")
if(action==="edit"){
let newText=prompt("Edit message",messages[i].text)
if(newText){
messages[i].text=newText
save()
render()
}
}
if(action==="delete"){
messages.splice(i,1)
save()
render()
}
if(action==="info"){
alert("Sent at: "+messages[i].time+
"\nType: "+
(messages[i].text.endsWith("?")?"Question":
messages[i].text.endsWith("!")?"Excited":"Normal"))
}
}

function react(i,emoji){
messages[i].text+=" "+emoji
save()
render()
}

function showChat(){
chatScreen.style.display="block"
statusScreen.style.display="none"
}

function showStatus(){
chatScreen.style.display="none"
statusScreen.style.display="block"
}

function postStatus(){
let file=statusInput.files[0]
if(!file)return
let reader=new FileReader()
reader.onload=e=>{
statusImage.src=e.target.result
localStorage.setItem("zeeStatus",e.target.result)
setTimeout(()=>{
statusImage.src=""
localStorage.removeItem("zeeStatus")
},180000)
}
reader.readAsDataURL(file)
}

messageInput.addEventListener("input",()=>{
typing.innerText="Typing..."
clearTimeout(window.typingTimer)
window.typingTimer=setTimeout(()=>typing.innerText="",1000)
})

let savedStatus=localStorage.getItem("zeeStatus")
if(savedStatus)statusImage.src=savedStatus

render()

</script>

</body>
  </html>
