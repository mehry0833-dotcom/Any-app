<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zee Social Pro</title>
<style>
body{margin:0;background:#0d0d0f;color:#eee;font-family:sans-serif;padding-bottom:70px}
.screen{display:none;padding:15px}.active{display:block}
input,textarea,select{width:100%;padding:8px;margin:6px 0;border-radius:8px;
border:1px solid #333;background:#1a1a1d;color:#eee}
textarea{min-height:60px}
button{border:0;cursor:pointer}
.primary{width:100%;padding:10px;background:#10b981;color:#fff;border-radius:8px;margin-top:8px}
#chatList,#statusList,#postList,#happyList{max-height:55vh;overflow-y:auto}
.chatBubble{max-width:80%;padding:8px;border-radius:10px;margin:6px 0;font-size:14px}
.me{background:#10b981;color:#fff;margin-left:auto}
.other{background:#1f1f22;margin-right:auto}
.chatMedia img,video{width:100%;border-radius:10px;margin-top:6px}
nav{position:fixed;bottom:0;left:0;width:100%;background:#111;display:flex;
justify-content:space-around;padding:6px 0;border-top:1px solid #222}
.navBtn{background:none;color:#aaa;font-size:12px;text-align:center}
.navBtn.active{color:#10b981}
#moreMenu{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
justify-content:flex-end;align-items:flex-end}
#moreMenu.active{display:flex}
#moreSheet{width:100%;background:#1a1a1d;padding:20px;border-radius:20px 20px 0 0;
animation:up .25s}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.moreItem{width:100%;padding:12px;background:#333;color:#fff;border-radius:10px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;height:90px;object-fit:cover;border-radius:8px}
</style></head><body>

<div id="home" class="screen active"><h2>Welcome, Zee Flame</h2>
<p>Everything is saved locally on your phone.</p></div>

<div id="chats" class="screen"><h2>Chats</h2>
<div id="typing"></div><div id="chatList"></div>
<input id="chatName" placeholder="Your name">
<input id="chatMsg" placeholder="Type a message">
<input id="chatFile" type="file" accept="image/*,video/*,audio/*">
<button id="recBtn">🎙 Record</button><div id="recState"></div>
<button id="sendChat" class="primary">Send</button></div>

<div id="status" class="screen"><h2>Status</h2>
<textarea id="statusText" placeholder="Write something..."></textarea>
<input id="statusImg" type="file" accept="image/*">
<input id="statusMusic" type="file" accept="audio/*">
<select id="statusSticker"><option value="">Sticker</option><option>🔥</option>
<option>😂</option><option>❤️</option><option>🎧</option><option>💃</option></select>
<button id="postStatus" class="primary">Post Status</button>
<div id="statusList"></div></div>

<div id="posts" class="screen"><h2>Posts</h2>
<textarea id="postText" placeholder="Say something..."></textarea>
<input id="postImg" type="file" accept="image/*">
<button id="addPost" class="primary">Post</button>
<div id="postList"></div></div>

<div id="pictures" class="screen"><h2>Pictures</h2>
<div id="picGrid" class="grid"></div></div>

<div id="happy" class="screen"><h2>What Makes Me Happy</h2>
<textarea id="happyText" placeholder="What makes you happy?"></textarea>
<input id="happyAct" placeholder="Activity">
<input id="happyImg" type="file" accept="image/*">
<button id="addHappy" class="primary">Post</button>
<div id="happyList"></div></div>

<div id="moreMenu"><div id="moreSheet">
<button class="moreItem" data-go="pictures">🖼 Pictures</button>
<button class="moreItem" data-go="happy">⭐ What I Like</button>
<button id="closeMore" class="moreItem">Close</button></div></div>

<nav>
<button class="navBtn active" data-go="home">🏠<br>Home</button>
<button class="navBtn" data-go="chats">💬<br>Chats</button>
<button class="navBtn" data-go="status">🎵<br>Status</button>
<button class="navBtn" data-go="posts">📝<br>Posts</button>
<button id="moreBtn" class="navBtn">⋯<br>More</button>
</nav>

<script>
const $=id=>document.getElementById(id);
let chats=JSON.parse(localStorage.chats||"[]"),
statuses=JSON.parse(localStorage.statuses||"[]"),
posts=JSON.parse(localStorage.posts||"[]"),
happy=JSON.parse(localStorage.happy||"[]"),
pics=JSON.parse(localStorage.pics||"[]");

function save(){localStorage.chats=JSON.stringify(chats);
localStorage.statuses=JSON.stringify(statuses);
localStorage.posts=JSON.stringify(posts);
localStorage.happy=JSON.stringify(happy);
localStorage.pics=JSON.stringify(pics);}

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
$(id).classList.add("active");
document.querySelectorAll(".navBtn").forEach(b=>b.classList.remove("active"));
document.querySelector(`[data-go="${id}"]`)?.classList.add("active");
}

document.querySelectorAll(".navBtn").forEach(b=>{
b.onclick=()=>{if(b.id==="moreBtn")return $("moreMenu").classList.add("active");
show(b.dataset.go);}
});
$("closeMore").onclick=()=>$("moreMenu").classList.remove("active");
document.querySelectorAll(".moreItem").forEach(b=>{
b.onclick=()=>{if(b.dataset.go){show(b.dataset.go);} $("moreMenu").classList.remove("active");}
});

function t(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}

/* CHATS */
function renderChats(){
$("chatList").innerHTML="";
chats.forEach((c,i)=>{
let d=document.createElement("div");
d.className="chatBubble "+(i%2?"other":"me");
let m="";
if(c.img)m+=`<div class='chatMedia'><img src='${c.img}'></div>`;
if(c.vid)m+=`<div class='chatMedia'><video controls src='${c.vid}'></video></div>`;
if(c.aud)m+=`<div class='chatMedia'><audio controls src='${c.aud}'></audio></div>`;
d.innerHTML=`${c.name?("<b>"+c.name+"</b><br>"):""}${c.text||""}${m}`;
$("chatList").appendChild(d);
});
$("chatList").scrollTop=999999;
}
renderChats();

$("chatMsg").oninput=()=>$("typing").innerText=$("chatMsg").value?"Typing...":"";

$("sendChat").onclick=()=>{
let n=$("chatName").value.trim(),m=$("chatMsg").value.trim(),f=$("chatFile").files[0];
if(!m&&!f)return;
let o={name:n,text:m,time:t()};
if(f){
let r=new FileReader();
r.onload=()=>{
if(f.type.startsWith("image")){o.img=r.result;pics.push(r.result);}
else if(f.type.startsWith("video"))o.vid=r.result;
else o.aud=r.result;
chats.push(o);save();renderChats();
};
r.readAsDataURL(f);
}else{chats.push(o);save();renderChats();}
$("chatMsg").value="";$("chatName").value="";$("chatFile").value="";
$("typing").innerText="";
};

/* RECORDING */
let rec,chunks=[];
$("recBtn").onclick=async()=>{
if(rec&&rec.state==="recording"){rec.stop();$("recState").innerText="Saving...";return;}
let s=await navigator.mediaDevices.getUserMedia({audio:true});
rec=new MediaRecorder(s);
rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{
let b=new Blob(chunks,{type:"audio/webm"});chunks=[];
let r=new FileReader();
r.onload=()=>{chats.push({aud:r.result,time:t()});save();renderChats();$("recState").innerText="Saved";};
r.readAsDataURL(b);
};
rec.start();$("recState").innerText="Recording...";
};

/* STATUS */
function renderStatus(){
$("statusList").innerHTML="";
statuses.forEach((s,i)=>{
let d=document.createElement("div");
d.className="statusCard";
let img=s.img?`<img src='${s.img}'>`:"";
let mus=s.mus?`<audio controls src='${s.mus}' style='width:100%'></audio>`:"";
d.innerHTML=`<div class='statusTop'><span>${s.time}</span>
<span>${s.views||0} views · ${s.likes||0} likes</span></div>
${img}<div>${s.text||""}</div>${s.sticker||""}${mus}
<div class='statusActions'>
<button onclick='likeStatus(${i})'>Like</button>
<button onclick='viewStatus(${i})'>Viewed</button>
${s.img?`<a href='${s.img}' download='status.png'><button>Save</button></a>`:""}
</div>`;
$("statusList").appendChild(d);
});
}
renderStatus();

function likeStatus(i){statuses[i].likes=(statuses[i].likes||0)+1;save();renderStatus();}
function viewStatus(i){statuses[i].views=(statuses[i].views||0)+1;save();renderStatus();}

$("postStatus").onclick=()=>{
let t=$("statusText").value.trim(),fi=$("statusImg").files[0],fm=$("statusMusic").files[0],st=$("statusSticker").value;
let o={text:t,sticker:st,time:t(),likes:0,views:0};
let p=[];
if(fi){let r=new FileReader();p.push(new Promise(res=>{r.onload=()=>{o.img=r.result;pics.push(r.result);res();};}));r.readAsDataURL(fi);}
if(fm){let r=new FileReader();p.push(new Promise(res=>{r.onload=()=>{o.mus=r.result;res();};}));r.readAsDataURL(fm);}
Promise.all(p).then(()=>{statuses.unshift(o);save();renderStatus();renderPics();
$("statusText").value="";$("statusImg").value="";$("statusMusic").value="";$("statusSticker").value="";});
};

/* POSTS */
function renderPosts(){
$("postList").innerHTML="";
posts.forEach((p,i)=>{
let d=document.createElement("div");
d.className="postCard";
let img=p.img?`<img src='${p.img}'>`:"";
let c=(p.comments||[]).map(x=>`<div class='comment'>${x}</div>`).join("");
d.innerHTML=`<div>${p.time}</div><div>${p.text}</div>${img}
<div class='postActions'>
<button onclick='likePost(${i})'>Like (${p.likes||0})</button>
<button onclick='alert("Shared")'>Share</button></div>
<input class='commentInput' data-i='${i}' placeholder='Comment...'>
${c}`;
$("postList").appendChild(d);
});
}
renderPosts();

function likePost(i){posts[i].likes=(posts[i].likes||0)+1;save();renderPosts();}

$("postList").addEventListener("keydown",e=>{
if(e.key==="Enter"&&e.target.classList.contains("commentInput")){
let i=e.target.dataset.i,txt=e.target.value.trim();if(!txt)return;
posts[i].comments=posts[i].comments||[];posts[i].comments.push(txt);
e.target.value="";save();renderPosts();
}});

$("addPost").onclick=()=>{
let t=$("postText").value.trim(),f=$("postImg").files[0];
if(!t&&!f)return;
let o={text:t,time:t(),likes:0,comments:[]};
if(f){let r=new FileReader();r.onload=()=>{o.img=r.result;pics.push(r.result);
posts.unshift(o);save();renderPosts();renderPics();};r.readAsDataURL(f);}
else{posts.unshift(o);save();renderPosts();}
$("postText").value="";$("postImg").value="";
};

/* HAPPY */
function renderHappy(){
$("happyList").innerHTML="";
happy.forEach((h,i)=>{
let d=document.createElement("div");
d.className="postCard";
let img=h.img?`<img src='${h.img}'>`:"";
let c=(h.comments||[]).map(x=>`<div class='comment'>${x}</div>`).join("");
d.innerHTML=`<div>${h.time}</div><div>${h.text}</div>
${h.act?`<div>Activity: ${h.act}</div>`:""}${img}
<input class='commentInput' data-i='${i}' placeholder='Comment...'>${c}`;
$("happyList").appendChild(d);
});
}
renderHappy();

$("happyList").addEventListener("keydown",e=>{
if(e.key==="Enter"&&e.target.classList.contains("commentInput")){
let i=e.target.dataset.i,txt=e.target.value.trim();if(!txt)return;
happy[i].comments=happy[i].comments||[];happy[i].comments.push(txt);
e.target.value="";save();renderHappy();
}});

$("addHappy").onclick=()=>{
let t=$("happyText").value.trim(),a=$("happyAct").value.trim(),f=$("happyImg").files[0];
if(!t&&!a&&!f)return;
let o={text:t,act:a,time:t(),comments:[]};
if(f){let r=new FileReader();r.onload=()=>{o.img=r.result;pics.push(r.result);
happy.unshift(o);save();renderHappy();renderPics();};r.readAsDataURL(f);}
else{happy.unshift(o);save();renderHappy();}
$("happyText").value="";$("happyAct").value="";$("happyImg").value="";
};

/* PICTURES */
function renderPics(){
$("picGrid").innerHTML="";
pics.forEach(s=>{let i=document.createElement("img");i.src=s;$("picGrid").appendChild(i);});
}
renderPics();
</script>
</body></html>
