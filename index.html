<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henicks Auto Photo Enhance</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: #fff;
    text-align: center;
}
header {
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
}
.container {
    padding: 15px;
    position: relative;
}
button, input {
    padding: 12px 16px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
}
button {
    background: #00e5ff;
    color: #000;
    cursor: pointer;
}
button:hover { opacity: 0.85; }
canvas {
    max-width: 100%;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}
#messageBox{
    position:absolute;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    padding:12px 20px;
    border-radius:12px;
    font-size:16px;
    display:none;
}
</style>
</head>
<body>

<header>Henicks Auto Photo Enhance</header>

<div class="container">
<input type="file" id="upload" accept="image/*"><br>
<button onclick="autoEnhance()">Ultra Clean Enhance</button>
<button onclick="blackWhite()">Black & White</button>
<button onclick="vivid()">Vivid Mode</button>
<button onclick="softSkin()">Soft Skin</button>
<button onclick="warmTone()">Warm Tone</button>
<button onclick="coolTone()">Cool Tone</button>
<button onclick="downloadImage()">Save Photo</button>
<div id="messageBox"></div>
<br>
<canvas id="canvas"></canvas>
</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const msgBox = document.getElementById("messageBox");
let original = new Image();

upload.addEventListener("change", function(e){
    const reader = new FileReader();
    reader.onload = function(event){
        original.onload = function(){
            canvas.width = original.width;
            canvas.height = original.height;
            ctx.drawImage(original,0,0);
        }
        original.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

// clamp helper
function clamp(v){ return Math.max(0, Math.min(255, v)); }

// Auto Enhance
function autoEnhance(){
    // Messages for fun pro effect
    const messages=[
        "Your photo?🙄",
        "Your photo looks good, jealous down 👇.",
        "If you don't post this amazing photo on Facebook, chai, I will get shocked.😲",
        "Okay, your photo is cooked, ready to be eaten 🥪🌭",
        "How do you look, amazing, right?😁"
    ];
    let index=0;
    msgBox.style.display="block";
    const interval = setInterval(()=>{
        if(index>=messages.length){
            msgBox.style.display="none";
            clearInterval(interval);
            return;
        }
        msgBox.innerText=messages[index];
        index++;
    },1500); // each message shows 1.5 seconds

    // Image enhancement logic
    ctx.drawImage(original,0,0);
    let img = ctx.getImageData(0,0,canvas.width,canvas.height);
    let d = img.data;
    const w = canvas.width;
    const h = canvas.height;
    const copy = new Uint8ClampedArray(d);

    for(let y=1;y<h-1;y++){
        for(let x=1;x<w-1;x++){
            const idx = (y*w + x)*4;
            const dx = Math.abs(copy[idx]-copy[idx+4]) + Math.abs(copy[idx+1]-copy[idx+5]) + Math.abs(copy[idx+2]-copy[idx+6]);
            const dy = Math.abs(copy[idx]-copy[idx+w*4]) + Math.abs(copy[idx+1]-copy[idx+w*4+1]) + Math.abs(copy[idx+2]-copy[idx+w*4+2]);
            const edge = dx + dy;
            if(edge < 60){
                for(let c=0;c<3;c++){
                    d[idx+c] = (copy[idx-4+c]+copy[idx+c]+copy[idx+4+c]+copy[idx-w*4+c]+copy[idx+w*4+c])/5;
                }
            } else {
                for(let c=0;c<3;c++){
                    const sharpen = copy[idx+c]*1.3 - (copy[idx-4+c]+copy[idx+4+c]+copy[idx-w*4+c]+copy[idx+w*4+c])/5*0.3;
                    d[idx+c] = clamp(sharpen);
                }
            }
        }
    }

    for(let i=0;i<d.length;i+=4){
        d[i]+=12; d[i+1]+=12; d[i+2]+=12;
        const contrast = 1.2;
        d[i] = clamp((d[i]-128)*contrast+128);
        d[i+1] = clamp((d[i+1]-128)*contrast+128);
        d[i+2] = clamp((d[i+2]-128)*contrast+128);
    }

    ctx.putImageData(img,0,0);
    canvas.style.filter="contrast(120%) saturate(115%)";
}

// Black & White
function blackWhite(){
    let img = ctx.getImageData(0,0,canvas.width,canvas.height);
    let d = img.data;
    for(let i=0;i<d.length;i+=4){
        let avg=(d[i]+d[i+1]+d[i+2])/3;
        d[i]=d[i+1]=d[i+2]=avg;
    }
    ctx.putImageData(img,0,0);
    canvas.style.filter="none";
}

// Vivid
function vivid(){ canvas.style.filter="contrast(130%) saturate(140%)"; }

// Soft Skin
function softSkin(){ canvas.style.filter="blur(1px) contrast(105%)"; }

// Warm Tone
function warmTone(){ canvas.style.filter="contrast(115%) saturate(110%) sepia(0.15)"; }

// Cool Tone
function coolTone(){ canvas.style.filter="contrast(115%) saturate(110%) hue-rotate(180deg)"; }

// Download & auto-clear
function downloadImage(){
    const link=document.createElement("a");
    link.download="henicks_auto_enhance.png";
    link.href=canvas.toDataURL("image/png");
    link.click();

    setTimeout(()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        upload.value="";
        canvas.style.filter="none";
    },500);
}
</script>

</body>
    </html>
