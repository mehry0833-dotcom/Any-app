<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Talks 🗨️</title>
<style>
body{margin:0;padding:0;font-family:sans-serif;background:#032B44;color:#fff}
.screen{display:none;padding:20px;padding-top:60px}
.active{display:block}
.nav{position:fixed;top:0;width:100%;background:#021c2e;padding:10px;text-align:center;z-index:10}
.nav button{background:#1E90FF;color:#fff;border:none;padding:8px 12px;border-radius:20px;margin:3px;cursor:pointer}
input{padding:6px;margin:5px 0;width:calc(100% - 12px);border-radius:5px;border:none}
button{cursor:pointer}
.chat-msg,.status-post{padding:10px;margin:10px 0;border-radius:8px;background:#05386B}
.sent{background:#00BFFF;margin-left:auto}
.received{background:#1E90FF}
img{max-width:100%;border-radius:6px;margin-top:5px}
audio{width:100%;margin-top:5px}
.pics-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;}
.pics-grid img {width:100%;height:100px;object-fit:cover;border-radius:8px;cursor:pointer;transition: transform 0.2s;}
.pics-grid img:hover { transform: scale(1.05); }
.friend-item{padding:6px;margin:5px 0;border-radius:6px;background:#064663;cursor:pointer;}
</style>
</head>
<body>
<div class="nav">
<button onclick="showScreen('home')">🏠</button>
<button onclick="showScreen('friends')">👥 Friends</button>
<button onclick="showScreen('chats')">💬 Chats</button>
<button onclick="showScreen('status')">🎵 Status</button>
<button onclick="showScreen('posts')">📝 Posts</button>
<button onclick="showScreen('pictures')">🖼️ Pictures</button>
<button onclick="showScreen('happy')">😊 Happy</button>
<button onclick="logout()" style="background:#FF4500">🚪 Logout</button>
</div>

<!-- Login / Signup -->
<div id="login-screen" class="screen active">
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Password" type="password">
<input id="username" placeholder="Username">
<input type="file" id="profile-pic" accept="image/*">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<div id="login-msg" style="color: #ffcc00;"></div>
</div>

<!-- Home -->
<div id="home-screen" class="screen">
<h2>Welcome to House Talks</h2>
<p id="current-user"></p>
</div>

<!-- Friends -->
<div id="friends-screen" class="screen">
<h2>Search Friends</h2>
<input id="friend-search" placeholder="Type username">
<div id="search-results"></div>
<h3>Your Friends</h3>
<div id="friend-list"></div>
</div>

<!-- Chats -->
<div id="chats-screen" class="screen">
<h2>Chats</h2>
<div id="chat-rooms"></div>
<div id="chat-window" style="display:none;">
<h3 id="chat-with"></h3>
<input id="msg-input" placeholder="Message">
<input type="file" id="chat-image" accept="image/*">
<input type="file" id="chat-audio" accept="audio/*">
<button onclick="sendMsg()">Send</button>
<button onclick="leaveChat()">Leave Chat</button>
<div id="chat-log"></div>
</div>
</div>

<!-- Status -->
<div id="status-screen" class="screen">
<h2>Status</h2>
<input id="status-input" placeholder="What's up?">
<input type="file" id="status-image" accept="image/*">
<input type="file" id="status-music" accept="audio/*">
<button onclick="postStatus()">Post</button>
<div id="status-log"></div>
</div>

<!-- Posts -->
<div id="posts-screen" class="screen">
<h2>Posts</h2>
<input id="post-input" placeholder="Share something">
<input type="file" id="post-image" accept="image/*">
<button onclick="post()">Post</button>
<div id="post-log"></div>
</div>

<!-- Pictures -->
<div id="pictures-screen" class="screen">
<h2>All Pictures</h2>
<div id="pics-log" class="pics-grid"></div>
</div>

<!-- Happy -->
<div id="happy-screen" class="screen">
<h2>Happy Zone</h2>
<input id="happy-input" placeholder="What makes you happy?">
<input type="file" id="happy-image" accept="image/*">
<button onclick="postHappy()">Post</button>
<div id="happy-log"></div>
</div>

<!-- Fullscreen overlay for swipe gallery -->
<div id="img-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;z-index:50;overflow:hidden;">
  <img id="full-img" src="" style="max-width:95%;max-height:95%;border-radius:10px;touch-action:none">
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ================= COMPLETE FIREBASE CONFIG =================
// Replace the placeholder values below with your own Firebase project config
// (from Project settings in Firebase console). The databaseURL is already provided.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",            // <-- Replace with your API key
  authDomain: "YOUR_AUTH_DOMAIN",    // <-- e.g., your-project-id.firebaseapp.com
  databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com/",
  projectId: "YOUR_PROJECT_ID",      // <-- Your project ID
  storageBucket: "YOUR_STORAGE_BUCKET", // <-- e.g., your-project-id.appspot.com
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// =============================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const MAX_FILE_SIZE = 1*1024*1024; // 1MB

let currentUser = null;
let allImages = [], currentIndex = 0;
let currentChatId = null;
let currentChatWith = null;

// --- Auth ---
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    showScreen('home');
    document.getElementById('current-user').innerText = 'Logged in as: '+user.email;
    loadFriends(); loadChats(); loadStatuses(); loadPosts(); loadHappy();
  } else {
    currentUser = null;
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('login-screen').classList.add('active');
  }
});

function signup(){
  let email=document.getElementById('email').value.trim();
  let password=document.getElementById('password').value;
  let username=document.getElementById('username').value.trim();
  let file=document.getElementById('profile-pic').files[0];
  if(!username){ alert('Enter username'); return; }
  auth.createUserWithEmailAndPassword(email,password)
    .then(res=>{
      let uid=res.user.uid;
      fileToBase64(file,data=>{
        db.ref('users/'+uid).set({username,email,profilePic:data||null})
          .then(() => {
            document.getElementById('login-msg').innerText="Sign Up Successful!";
          });
      });
    }).catch(e=>{
      document.getElementById('login-msg').innerText='Error: '+e.message;
    });
}

function login(){
  let email=document.getElementById('email').value.trim();
  let password=document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email,password)
    .then(()=>document.getElementById('login-msg').innerText="")
    .catch(e=>{
      document.getElementById('login-msg').innerText='Login failed: '+e.message;
    });
}

function logout(){ auth.signOut(); }

function showScreen(screen){
  if(!currentUser) return;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screen+'-screen').classList.add('active');
  if(screen === 'pictures') loadPics();
}

// --- File to Base64 ---
function fileToBase64(file, callback){
  if(!file){ callback(null); return; }
  if(file.type.startsWith('image/')){
    let img = new Image();
    let reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; img.onload = ()=>{
      const MAX_DIM = 800;
      let w=img.width, h=img.height;
      if(w>MAX_DIM || h>MAX_DIM){ if(w>h){ h=h*(MAX_DIM/w); w=MAX_DIM; } else { w=w*(MAX_DIM/h); h=MAX_DIM; } }
      let canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      let ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.7));
    };};
    reader.readAsDataURL(file);
  } else {
    if(file.size>MAX_FILE_SIZE){ alert('File too large!'); callback(null); return; }
    let reader = new FileReader(); reader.onload = e=>callback(e.target.result); reader.readAsDataURL(file);
  }
}

// --- Friends ---
function loadFriends(){
  db.ref('friends/'+currentUser.uid).once('value',snap=>{
    let friends=snap.val()||{};
    let list=document.getElementById('friend-list'); list.innerHTML='';
    Object.keys(friends).forEach(uid=>{
      db.ref('users/'+uid).once('value',s=>{ let u=s.val(); if(u) list.innerHTML+='<div class="friend-item" onclick="openChat(\''+uid+'\',\''+u.username+'\')">'+u.username+'</div>'; });
    });
  });
}

document.getElementById('friend-search')?.addEventListener('input', e=>{
  let term=e.target.value.trim().toLowerCase();
  if(!term) { document.getElementById('search-results').innerHTML=''; return; }
  db.ref('users').once('value',snap=>{
    let users=snap.val()||{}; let res='';
    Object.keys(users).forEach(uid=>{
      let u=users[uid];
      if(u.username.toLowerCase().includes(term) && uid!==currentUser.uid){
        res+='<div class="friend-item" onclick="addFriend(\''+uid+'\',\''+u.username+'\')">'+u.username+'</div>';
      }
    });
    document.getElementById('search-results').innerHTML=res;
  });
});

function addFriend(uid,name){
  db.ref('friends/'+currentUser.uid+'/'+uid).set(true);
  db.ref('friends/'+uid+'/'+currentUser.uid).set(true);
  alert('You are now friends with '+name);
  loadFriends();
}

// --- Chat Functions ---
function loadChats(){ loadFriends(); }
function openChat(friendUid,friendName){
  currentChatWith=friendName;
  document.getElementById('chat-with').innerText='Chat with '+friendName;
  document.getElementById('chat-window').style.display='block';
  let chatId = [currentUser.uid,friendUid].sort().join('_');
  currentChatId=chatId;
  loadChatMessages();
}
function leaveChat(){ document.getElementById('chat-window').style.display='none'; currentChatId=null; currentChatWith=null; document.getElementById('chat-log').innerHTML=''; }
function sendMsg(){
  if(!currentChatId) return alert('Open a chat first');
  let msg=document.getElementById('msg-input').value;
  let imgFile=document.getElementById('chat-image').files[0];
  let audioFile=document.getElementById('chat-audio').files[0];
  if(!msg&&!imgFile&&!audioFile) return;
  let msgRef=db.ref('chats/'+currentChatId+'/messages').push();
  let msgData={from:currentUser.uid,msg:msg||'',img:null,audio:null,time:new Date().toLocaleTimeString()};
  fileToBase64(imgFile,imgData=>{ msgData.img=imgData; fileToBase64(audioFile,audioData=>{ msgData.audio=audioData; msgRef.set(msgData).then(()=>{ document.getElementById('msg-input').value=''; document.getElementById('chat-image').value=''; document.getElementById('chat-audio').value=''; loadChatMessages(); }); }); });
}
function loadChatMessages(){
  if(!currentChatId) return;
  db.ref('chats/'+currentChatId+'/messages').once('value',snap=>{
    let msgs=snap.val()||{}; let log=document.getElementById('chat-log'); log.innerHTML='';
    Object.keys(msgs).forEach(k=>{
      let m=msgs[k]; let cls=m.from===currentUser.uid?'sent':'received';
      log.innerHTML+='<div class="chat-msg '+cls+'">'+m.msg+(m.img?'<br><img src="'+m.img+'">':'')+(m.audio?'<br><audio controls src="'+m.audio+'"></audio>':'')+'<br><small>'+m.time+'</small></div>';
    });
    log.scrollTop=log.scrollHeight;
  });
}

// --- Status / Posts / Happy / Pictures ---
function postStatus(){ if(!currentUser) return alert('Login first'); let txt=document.getElementById('status-input').value; let img=document.getElementById('status-image').files[0]; let music=document.getElementById('status-music').files[0]; if(!txt&&!img&&!music) return; let ref=db.ref('statuses').push(); let data={user:currentUser.uid,status:txt||'',img:null,music:null,time:new Date().toLocaleTimeString()}; fileToBase64(img,i=>{ data.img=i; fileToBase64(music,a=>{ data.music=a; ref.set(data).then(()=>{ loadStatuses(); }); }); }); document.getElementById('status-input').value=''; document.getElementById('status-image').value=''; document.getElementById('status-music').value=''; }
function loadStatuses(){ db.ref('statuses').once('value',snap=>{ let s=snap.val()||{}; let log=document.getElementById('status-log'); log.innerHTML=''; Object.keys(s).forEach(k=>{ let v=s[k]; db.ref('users/'+v.user).once('value',u=>{ if(u.val()) log.innerHTML+='<div class="status-post"><b>'+u.val().username+'</b><br>'+v.status+(v.img?'<br><img src="'+v.img+'">':'')+(v.music?'<br><audio controls src="'+v.music+'"></audio>':'')+'<br><small>'+v.time+'</small></div>'; }); }); }); }
function post(){ let txt=document.getElementById('post-input').value; let img=document.getElementById('post-image').files[0]; if(!txt&&!img) return; let ref=db.ref('posts').push(); let data={txt:txt||'',img:null,time:new Date().toLocaleTimeString()}; fileToBase64(img,i=>{ data.img=i; ref.set(data).then(()=>{ loadPosts(); }); }); document.getElementById('post-input').value=''; document.getElementById('post-image').value=''; }
function loadPosts(){ db.ref('posts').once('value',snap=>{ let s=snap.val()||{}; let log=document.getElementById('post-log'); log.innerHTML=''; Object.keys(s).forEach(k=>{ let v=s[k]; log.innerHTML+='<div class="status-post">'+v.txt+(v.img?'<br><img src="'+v.img+'">':'')+'<br><small>'+v.time+'</small></div>'; }); }); }
function postHappy(){ let txt=document.getElementById('happy-input').value; let img=document.getElementById('happy-image').files[0]; if(!txt&&!img) return; let ref=db.ref('happyPosts').push(); let data={txt:txt||'',img:null,time:new Date().toLocaleTimeString()}; fileToBase64(img,i=>{ data.img=i; ref.set(data).then(()=>{ loadHappy(); }); }); document.getElementById('happy-input').value=''; document.getElementById('happy-image').value=''; }
function loadHappy(){ db.ref('happyPosts').once('value',snap=>{ let s=snap.val()||{}; let log=document.getElementById('happy-log'); log.innerHTML=''; Object.keys(s).forEach(k=>{ let v=s[k]; log.innerHTML+='<div class="status-post">'+v.txt+(v.img?'<br><img src="'+v.img+'">':'')+'<br><small>'+v.time+'</small></div>'; }); }); }

function loadPics(){
  allImages=[];
  let log=document.getElementById('pics-log');
  log.innerHTML='';
  Promise.all([
    db.ref('chats').once('value'),
    db.ref('statuses').once('value'),
    db.ref('posts').once('value'),
    db.ref('happyPosts').once('value')
  ]).then(([cSnap,sSnap,pSnap,hSnap])=>{
    let items = [
      ...Object.values(cSnap.val()||{}),
      ...Object.values(sSnap.val()||{}),
      ...Object.values(pSnap.val()||{}),
      ...Object.values(hSnap.val()||{})
    ];
    items.forEach(p=>{
      if(p.messages){
        Object.values(p.messages).forEach(m=>{
          if(m.img){
            allImages.push(m.img);
            let imgEl=document.createElement('img');
            imgEl.src=m.img;
            imgEl.onclick=()=>{ openFullScreen(allImages.indexOf(m.img)); };
            log.appendChild(imgEl);
          }
        });
      } else if(p.img){
        allImages.push(p.img);
        let imgEl=document.createElement('img');
        imgEl.src=p.img;
        imgEl.onclick=()=>{ openFullScreen(allImages.indexOf(p.img)); };
        log.appendChild(imgEl);
      }
    });
  });
}

function openFullScreen(index){
  currentIndex=index;
  document.getElementById('full-img').src=allImages[currentIndex];
  document.getElementById('img-overlay').style.display='flex';
}

// --- Fullscreen swipe gallery ---
let overlay = document.getElementById('img-overlay');
let fullImg = document.getElementById('full-img');
let startX = 0;

// Click to close
overlay.addEventListener('click', function() {
  overlay.style.display = 'none';
});

// Swipe navigation for touch devices
overlay.addEventListener('touchstart', function(e) {
  e.stopPropagation();
  startX = e.touches[0].clientX;
});

overlay.addEventListener('touchend', function(e) {
  if (startX === 0) return;
  let endX = e.changedTouches[0].clientX;
  let diff = endX - startX;
  if (Math.abs(diff) > 50) { // threshold
    if (diff > 0) {
      // swipe right -> previous
      currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
    } else {
      // swipe left -> next
      currentIndex = (currentIndex + 1) % allImages.length;
    }
    fullImg.src = allImages[currentIndex];
  }
  startX = 0;
});

// Prevent accidental page scroll while swiping
overlay.addEventListener('touchmove', function(e) {
  e.preventDefault();
}, { passive: false });

</script>
</body>
  </html>
