<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Talks</title><style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f0f2f5}#loginContainer{max-width:400px;margin:50px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px #0000001a}#appContainer{max-width:900px;margin:20px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0000001a}input,textarea,button{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}button{background:#4CAF50;color:#fff;border:none;cursor:pointer;font-weight:700}button:hover{background:#45a049}#logoutBtn{background:#f44336;width:auto;margin:10px}.tab-bar{display:flex;background:#333;color:#fff}.tab{flex:1;text-align:center;padding:12px;cursor:pointer;transition:.2s}.tab.active{background:#4CAF50;font-weight:700}.tab-content{display:none;padding:20px}.tab-content.active{display:block}.visitors-section{background:#e9e9e9;padding:15px;border-radius:8px;margin-bottom:20px}.visitors-list{display:flex;flex-wrap:wrap;gap:20px}.visitor-item{display:flex;flex-direction:column;align-items:center;width:80px}.visitor-item img{width:60px;height:60px;border-radius:50%;object-fit:cover}.chat-messages{height:300px;overflow-y:auto;border:1px solid #ccc;padding:10px;background:#fafafa;margin-bottom:10px;border-radius:8px}.message{display:flex;align-items:center;gap:10px;margin-bottom:10px}.message img{width:30px;height:30px;border-radius:50%}.post-item{border:1px solid #ddd;padding:15px;margin-bottom:15px;border-radius:8px;background:#fff}.post-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}.post-header img{width:40px;height:40px;border-radius:50%}.post-time{font-size:12px;color:gray}.secrets-list{margin-top:20px}.secret-item{background:#f9f9f9;padding:10px;border-left:4px solid #4CAF50;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.secret-item button{width:auto;background:#ff4444;margin:0;padding:5px 10px}.stories-container{display:flex;gap:15px;overflow-x:auto;padding:10px 0}.story{min-width:80px;text-align:center;cursor:pointer}.story img{width:70px;height:70px;border-radius:50%;border:3px solid #4CAF50}.bedroom-locked,.bedroom-unlocked{text-align:center;padding:20px}.profile-pic-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:10px auto;display:block}.flex-row{display:flex;gap:10px;align-items:center}.small-btn{width:auto;padding:5px 12px;margin:0}
</style></head><body>
<div id="loginContainer"><h2 style="text-align:center;">🏠 House Talks</h2><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><input type="text" id="name" placeholder="Full Name (sign up)"><input type="file" id="profilePic" accept="image/*"><button id="loginBtn">Login</button><button id="signupBtn">Sign Up</button></div>
<div id="appContainer" style="display:none;"><div style="display:flex;justify-content:space-between;align-items:center;background:#4CAF50;color:#fff;padding:10px 20px"><span id="userInfo">Loading...</span><button id="logoutBtn" class="small-btn">Logout</button></div><div class="tab-bar"><div class="tab active" data-tab="sittingRoom">Sitting Room</div><div class="tab" data-tab="bedroom">Bedroom</div><div class="tab" data-tab="outside">Outside</div><div class="tab" data-tab="profile">Profile</div></div>
<div id="sittingRoom" class="tab-content active"><div class="visitors-section"><h3>Visitors</h3><div id="visitorsList" class="visitors-list"></div></div><h3>Global Chat</h3><div id="chatMessages" class="chat-messages"></div><div class="flex-row"><input type="text" id="chatInput" placeholder="Type a message..." style="flex:1"><button id="sendChatBtn" class="small-btn">Send</button></div></div>
<div id="bedroom" class="tab-content"><div id="bedroomLocked" class="bedroom-locked"><h3>🔒 Bedroom locked</h3><input type="password" id="bedroomPassword" placeholder="Password (secret123)"><button id="unlockBedroomBtn">Unlock</button></div><div id="bedroomUnlocked" class="bedroom-unlocked" style="display:none"><h3>🛏️ Private Space</h3><textarea id="newSecret" rows="3" placeholder="Write a secret..."></textarea><button id="addSecretBtn">Save Secret</button><div id="secretsList" class="secrets-list"></div><button id="lockBedroomBtn" class="small-btn" style="background:#f44336">Lock</button></div></div>
<div id="outside" class="tab-content"><h3>🌍 Public Feed</h3><textarea id="postContent" rows="3" placeholder="What's on your mind?"></textarea><button id="createPostBtn">Post</button><div id="postsFeed"></div></div>
<div id="profile" class="tab-content"><h3>👤 Your Profile</h3><img id="profilePicDisplay" class="profile-pic-preview" src=""><p><strong>Name:</strong> <span id="profileName"></span></p><p><strong>Email:</strong> <span id="profileEmail"></span></p><label>Mood:</label><select id="profileMood"><option value="😊 Happy">😊 Happy</option><option value="😢 Sad">😢 Sad</option><option value="😴 Tired">😴 Tired</option><option value="🤩 Excited">🤩 Excited</option></select><label>Status Note:</label><input type="text" id="profileNote" placeholder="e.g., Just joined!"><button id="updateProfileBtn">Update Profile</button><hr><h4>Stories (24h demo)</h4><div class="stories-container" id="storiesList"><div class="story"><img src="https://via.placeholder.com/70"> <span>User1</span></div><div class="story"><img src="https://via.placeholder.com/70"> <span>User2</span></div></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import{getDatabase,ref,set,push,onChildAdded,onValue,remove,update,get}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
import{getStorage,ref as storageRef,uploadBytesResumable,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
const firebaseConfig={apiKey:"AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",authDomain:"zeeworldyhi.firebaseapp.com",databaseURL:"https://zeeworldyhi-default-rtdb.firebaseio.com",projectId:"zeeworldyhi",storageBucket:"zeeworldyhi.firebasestorage.app",messagingSenderId:"154414924399",appId:"1:154414924399:web:31c3767fdbea93feba439a",measurementId:"G-XD5Z8T76EE"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);const storage=getStorage(app);
const EL=(id)=>document.getElementById(id);
const loginContainer=EL('loginContainer'),appContainer=EL('appContainer'),emailInput=EL('email'),passwordInput=EL('password'),nameInput=EL('name'),profilePicInput=EL('profilePic'),loginBtn=EL('loginBtn'),signupBtn=EL('signupBtn'),logoutBtn=EL('logoutBtn'),userInfoSpan=EL('userInfo');
const visitorsList=EL('visitorsList'),chatMessages=EL('chatMessages'),chatInput=EL('chatInput'),sendChatBtn=EL('sendChatBtn');
const bedroomLocked=EL('bedroomLocked'),bedroomUnlocked=EL('bedroomUnlocked'),bedroomPassword=EL('bedroomPassword'),unlockBtn=EL('unlockBedroomBtn'),lockBtn=EL('lockBedroomBtn'),newSecret=EL('newSecret'),addSecretBtn=EL('addSecretBtn'),secretsList=EL('secretsList');
const postContent=EL('postContent'),createPostBtn=EL('createPostBtn'),postsFeed=EL('postsFeed');
const profilePicDisplay=EL('profilePicDisplay'),profileName=EL('profileName'),profileEmail=EL('profileEmail'),profileMood=EL('profileMood'),profileNote=EL('profileNote'),updateProfileBtn=EL('updateProfileBtn');
let currentUser=null,currentUserData=null,bedroomUnlockedState=false;
async function uploadProfilePic(file,userId){const fRef=storageRef(storage,`profilePics/${userId}`);await uploadBytesResumable(fRef,file);return await getDownloadURL(fRef);}
signupBtn.onclick=async()=>{const e=emailInput.value.trim(),p=passwordInput.value,n=nameInput.value.trim(),f=profilePicInput.files[0];if(!e||!p||!n)return alert('Fill all fields');try{const uc=await createUserWithEmailAndPassword(auth,e,p);const user=uc.user;let url='';if(f)url=await uploadProfilePic(f,user.uid);await set(ref(db,`users/${user.uid}`),{name:n,email:e,photoURL:url,mood:'😊 Happy',note:'Just joined!',createdAt:Date.now()});await set(ref(db,`visitors/${user.uid}`),{name:n,photoURL:url,lastSeen:Date.now()});alert('Account created!');}catch(err){alert('Sign up error: '+err.message);}};
loginBtn.onclick=async()=>{try{await signInWithEmailAndPassword(auth,emailInput.value.trim(),passwordInput.value);}catch(err){alert('Login error: '+err.message);}};
logoutBtn.onclick=async()=>{await signOut(auth);};
onAuthStateChanged(auth,async(user)=>{if(user){currentUser=user;const userRef=ref(db,`users/${user.uid}`);onValue(userRef,(snap)=>{currentUserData=snap.val();if(currentUserData){userInfoSpan.textContent=`Logged in as: ${currentUserData.name}`;profileName.textContent=currentUserData.name;profileEmail.textContent=currentUserData.email;profilePicDisplay.src=currentUserData.photoURL||'https://via.placeholder.com/100';profileMood.value=currentUserData.mood||'😊 Happy';profileNote.value=currentUserData.note||'';}});await set(ref(db,`visitors/${user.uid}`),{name:currentUserData?.name||'User',photoURL:currentUserData?.photoURL||'',lastSeen:Date.now()});loginContainer.style.display='none';appContainer.style.display='block';listenVisitors();listenMessages();listenPosts();listenSecrets();}else{currentUser=currentUserData=null;bedroomUnlockedState=false;loginContainer.style.display='block';appContainer.style.display='none';[emailInput,passwordInput,nameInput,profilePicInput].forEach(i=>i.value='');visitorsList.innerHTML=chatMessages.innerHTML=postsFeed.innerHTML=secretsList.innerHTML='';}});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(tab=>tab.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));EL(t.dataset.tab).classList.add('active');}));
function listenVisitors(){onValue(ref(db,'visitors'),(snap)=>{const d=snap.val();visitorsList.innerHTML='';if(d){Object.keys(d).forEach(k=>{const v=d[k];const div=document.createElement('div');div.className='visitor-item';div.innerHTML=`<img src="${v.photoURL||'https://via.placeholder.com/60'}"><span>${v.name}</span>`;visitorsList.appendChild(div);});}else visitorsList.innerHTML='<em>No visitors online</em>';});}
function listenMessages(){onChildAdded(ref(db,'sittingRoom/messages'),(snap)=>{const m=snap.val();const d=document.createElement('div');d.className='message';d.innerHTML=`<img src="${m.userAvatar||'https://via.placeholder.com/30'}"><strong>${m.userName}:</strong> ${m.text}<span style="font-size:0.8em;color:gray;">${new Date(m.createdAt).toLocaleTimeString()}</span>`;chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight;});}
sendChatBtn.onclick=()=>{const t=chatInput.value.trim();if(!t||!currentUser||!currentUserData)return;push(ref(db,'sittingRoom/messages'),{text:t,userId:currentUser.uid,userName:currentUserData.name,userAvatar:currentUserData.photoURL||'',createdAt:Date.now()});chatInput.value='';};chatInput.addEventListener('keypress',e=>e.key==='Enter'&&sendChatBtn.click());
unlockBtn.onclick=()=>{if(bedroomPassword.value==='secret123'){bedroomUnlockedState=true;bedroomLocked.style.display='none';bedroomUnlocked.style.display='block';loadSecrets();}else alert('Wrong password!');};
lockBtn.onclick=()=>{bedroomUnlockedState=false;bedroomLocked.style.display='block';bedroomUnlocked.style.display='none';bedroomPassword.value='';};
function listenSecrets(){if(!currentUser)return;onValue(ref(db,`bedrooms/${currentUser.uid}/secrets`),()=>{if(bedroomUnlockedState)loadSecrets();});}
async function loadSecrets(){if(!currentUser)return;const snap=await get(ref(db,`bedrooms/${currentUser.uid}/secrets`));const data=snap.val();secretsList.innerHTML='';if(data){Object.keys(data).forEach(k=>{const s=data[k];const div=document.createElement('div');div.className='secret-item';div.innerHTML=`<span>${s.text}</span><button data-id="${k}" class="deleteSecretBtn">Delete</button>`;secretsList.appendChild(div);});document.querySelectorAll('.deleteSecretBtn').forEach(btn=>btn.onclick=async(e)=>{await remove(ref(db,`bedrooms/${currentUser.uid}/secrets/${e.target.dataset.id}`));});}else secretsList.innerHTML='<em>No secrets yet.</em>';}
addSecretBtn.onclick=async()=>{const t=newSecret.value.trim();if(!t||!currentUser)return;await push(ref(db,`bedrooms/${currentUser.uid}/secrets`),{text:t,createdAt:Date.now()});newSecret.value='';};
function listenPosts(){onChildAdded(ref(db,'outside/posts'),(snap)=>{const p=snap.val();displayPost(snap.key,p);});}
function displayPost(id,p){const d=document.createElement('div');d.className='post-item';d.dataset.id=id;d.innerHTML=`<div class="post-header"><img src="${p.userAvatar||'https://via.placeholder.com/40'}"><div><strong>${p.userName}</strong><div class="post-time">${new Date(p.createdAt).toLocaleString()}</div></div></div><p>${p.text}</p><div style="display:flex;gap:15px;margin-top:8px;"><button class="likeBtn" data-id="${id}">❤️ Like (${p.likes||0})</button></div>`;postsFeed.prepend(d);d.querySelector('.likeBtn').onclick=async(e)=>{const postId=e.target.dataset.id;const postRef=ref(db,`outside/posts/${postId}`);const snap=await get(postRef);if(snap.exists()){const likes=(snap.val().likes||0)+1;await update(postRef,{likes});e.target.textContent=`❤️ Like (${likes})`;}};}
createPostBtn.onclick=async()=>{const t=postContent.value.trim();if(!t||!currentUser||!currentUserData)return;await push(ref(db,'outside/posts'),{text:t,userId:currentUser.uid,userName:currentUserData.name,userAvatar:currentUserData.photoURL||'',createdAt:Date.now(),likes:0});postContent.value='';};
updateProfileBtn.onclick=async()=>{if(!currentUser)return;await update(ref(db,`users/${currentUser.uid}`),{mood:profileMood.value,note:profileNote.value});alert('Profile updated!');};
</script></body></html>
