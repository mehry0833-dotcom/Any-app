    <h1>Welcome to the Social App</h1>

    <div id="login-screen">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="signup-screen">
        <h2>Signup</h2>
        <input type="text" id="name" placeholder="Name">
        <input type="file" id="profile-pic" accept="image/*">
        <button onclick="signup()">Create Account</button>
    </div>

    <div id="main-app" style="display: none;">
        <h2>Welcome to the Main App</h2>
        <button onclick="logout()">Logout</button>
        
        <div id="chats-screen" style="display: none;">

            <div id="message-display"></div>
            <input type="text" id="message-input" placeholder="Type your message">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div id="friends-screen" style="display: none;">
            <h3>Friends</h3>
            <input type="text" id="search-friends" placeholder="Search Friends">
            <button onclick="searchFriends()">Search</button>
            <div id="friends-list"></div>
        </div>

        <div id="pictures-screen" style="display: none;">
            <h3>Pictures</h3>
            <input type="file" id="picture-upload" accept="image/*">
            <button onclick="uploadPicture()">Upload Picture</button>
            <div id="pictures-display"></div>
        </div>
    </div>
