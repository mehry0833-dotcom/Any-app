<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith Stories</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .story {
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
    }
    .story-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .story-content {
      font-size: 16px;
      margin-bottom: 10px;
    }
    .story-actions {
      text-align: right;
    }
    .story-actions button {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Faith Stories</h1>
    <div id="auth-container">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="login-btn">Login</button>
      <button id="signup-btn">Sign Up</button>
    </div>
    <div id="story-container" style="display: none;">
      <button id="add-story-btn">Add Story</button>
      <div id="story-form" style="display: none;">
        <input id="story-title" type="text" placeholder="Story Title">
        <textarea id="story-content" placeholder="Story Content"></textarea>
        <button id="save-story-btn">Save Story</button>
      </div>
      <div id="stories"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
      }
    }
  </script>
  <script type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'firebase/auth';
    import { getDatabase, ref, push, onValue, remove } from 'firebase/database';

    const firebaseConfig = {
      apiKey: "AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",
      authDomain: "zeeworldyhi.firebaseapp.com",
      databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com",
      projectId: "zeeworldyhi",
      storageBucket: "zeeworldyhi.firebasestorage.app",
      messagingSenderId: "154414924399",
      appId: "1:154414924399:web:31c3767fdbea93feba439a",
      measurementId: "G-XD5Z8T76EE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          currentUser = userCredential.user;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('story-container').style.display = 'block';
          loadStories();
        })
        .catch((error) => {
          console.error(error);
        });
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          currentUser = userCredential.user;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('story-container').style.display = 'block';
          loadStories();
        })
        .catch((error) => {
          console.error(error);
        });
    });

    document.getElementById('add-story-btn').addEventListener('click', () => {
      document.getElementById('story-form').style.display = 'block';
    });

    document.getElementById('save-story-btn').addEventListener('click', () => {
      const title = document.getElementById('story-title').value;
      const content = document.getElementById('story-content').value;
      push(ref(db, 'stories'), {
        title,
        content,
        userId: currentUser.uid
      })
        .then(() => {
          document.getElementById('story-form').style.display = 'none';
          document.getElementById('story-title').value = '';
          document.getElementById('story-content').value = '';
        })
        .catch((error) => {
          console.error(error);
        });
    });

    function loadStories() {
      onValue(ref(db, 'stories'), (snapshot) => {
        const stories = [];
        snapshot.forEach((childSnapshot) => {
          stories.push({ key: childSnapshot.key, ...childSnapshot.val() });
        });
        const storiesContainer = document.getElementById('stories');
        storiesContainer.innerHTML = '';
        stories.forEach((story) => {
          const storyElement = document.createElement('div');
          storyElement.className = 'story';
          storyElement.innerHTML = `
            <h2>${story.title}</h2>
            <p>${story.content}</p>
            <button onclick="deleteStory('${story.key}')">Delete</button>
          `;
          storiesContainer.appendChild(storyElement);
        });
      });
    }

    window.deleteStory = (key) => {
      remove(ref(db, 'stories/' + key));
    };
  </script>
</body>
  </html>
