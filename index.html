<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zee Social Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;background:#ece5dd;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{background:#075e54;color:white;padding:15px;font-weight:bold;text-align:center;font-size:20px;}
.tabs{display:flex;justify-content:space-around;background:white;border-bottom:1px solid #ddd;}
.tabs button{flex:1;padding:10px;font-size:14px;border:none;background:white;cursor:pointer;}
.tabs button.active{background:#128c7e;color:white;font-weight:bold;}
.screen{flex:1;overflow-y:auto;padding:5px;display:none;}
#chatScreen,#statusScreen,#postsScreen,#picturesScreen,#happyScreen,#homeScreen{display:none;}
.message{max-width:75%;padding:10px;margin:5px;border-radius:12px;position:relative;word-wrap:break-word;}
.left{background:white;align-self:flex-start;}
.right{background:#dcf8c6;align-self:flex-end;}
.sender{font-size:12px;font-weight:bold;margin-bottom:3px;}
.time{font-size:10px;opacity:.6;margin-top:3px;}
.options{font-size:11px;cursor:pointer;margin-top:2px;opacity:.7;}
.reactions{font-size:14px;margin-top:3px;display:flex;gap:10px;cursor:pointer;}
#typing{font-size:12px;padding-left:10px;color:#555;}
.inputBar{display:flex;padding:5px;background:white;gap:5px;}
.inputBar input[type=text]{flex:1;padding:8px;border-radius:20px;border:1px solid #ccc;}
.inputBar button{border:none;border-radius:20px;padding:8px 12px;background:#128c7e;color:white;cursor:pointer;}
.statusImg{width:100%;border-radius:10px;margin-top:5px;object-fit:cover;max-height:250px;}
.statusAudio,.statusVideo{width:100%;margin-top:5px;}
.postBox{border:1px solid #ccc;padding:8px;border-radius:10px;margin-bottom:8px;background:white;}
.likeCommentShare{display:flex;justify-content:space-around;font-size:12px;margin-top:5px;cursor:pointer;}
.pictureItem{width:100%;margin-bottom:5px;border-radius:10px;object-fit:cover;}
.commentBox{border-top:1px solid #ccc;margin-top:5px;padding-top:5px;}
</style>
</head>
<body>

<header>Zee Social Pro</header>
<div class="tabs">
<button id="homeTab" class="active" onclick="showScreen('home')">Home</button>
<button onclick="showScreen('chat')">Chats</button>
<button onclick="showScreen('status')">Status</button>
<button onclick="showScreen('posts')">Posts</button>
<button onclick="showScreen('pictures')">Pictures</button>
<button onclick="showScreen('happy')">What I Like</button>
</div>

<!-- Home Screen -->
<div id="homeScreen" class="screen">
<h3 style="text-align:center;">Welcome to Zee Social</h3>
<p style="text-align:center;">Notifications will appear here</p>
<div id="notifications"></div>
</div>

<!-- Chat Screen -->
<div id="chatScreen" class="screen">
<div id="chat"></div>
<div id="typing">Typing...</div>
<div class="inputBar">
<input id="nameInput" placeholder="Your name">
<input id="messageInput" placeholder="Type a message">
<button onclick="sendMessage()">Send</button>
<button onclick="recordAudio()">🎤</button>
<input type="file" id="chatFileInput" hidden>
<button onclick="chatFileInput.click()">+</button>
</div>
</div>

<!-- Status Screen -->
<div id="statusScreen" class="screen">
<input type="text" id="statusText" placeholder="Write something for your status">
<input type="file" id="statusFile">
<input type="file" id="statusMusic" accept="audio/*">
<button onclick="postStatus()">Post Status</button>
<div id="statusDisplay"></div>
</div>

<!-- Posts Screen -->
<div id="postsScreen" class="screen">
<input type="text" id="postText" placeholder="What's on your mind?">
<input type="file" id="postFile">
<button onclick="postPost()">Post</button>
<div id="postsDisplay"></div>
</div>

<!-- Pictures Screen -->
<div id="picturesScreen" class="screen">
<div id="picturesDisplay"></div>
</div>

<!-- Happiness Screen -->
<div id="happyScreen" class="screen">
<input type="text" id="happyText" placeholder="What makes you happy?">
<input type="file" id="happyFile">
<input type="text" id="happyActivity" placeholder="Activity">
<button onclick="postHappy()">Post</button>
<div id="happyDisplay"></div>
</div>

<script>
// Storage
let messages=JSON.parse(localStorage.getItem("zeeChat"))||[];
let statusData=JSON.parse(localStorage.getItem("zeeStatus"))||[];
let postsData=JSON.parse(localStorage.getItem("zeePosts"))||[];
let picturesData=JSON.parse(localStorage.getItem("zeePictures"))||[];
let happyData=JSON.parse(localStorage.getItem("zeeHappy"))||[];

// Tabs
function showScreen(screen){
document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById(screen+'Screen').style.display='flex';
if(screen==='home') homeTab.classList.add('active');
else if(screen==='chat') event.target.classList.add('active');
}

// Notifications placeholder
let notifications=[];

// Chat Functions
function saveChat(){localStorage.setItem("zeeChat",JSON.stringify(messages));}
function renderChat(){
chat.innerHTML="";let side=true;
messages.forEach((m,i)=>{
let div=document.createElement("div");
div.className="message "+(side?"right":"left");side=!side;
let media=m.media||"";
div.innerHTML=`<div class="sender">${m.name}</div><div>${m.text}</div>${media}<div class="time">${m.time}</div><div class="options" onclick="chatMenu(${i})">(:)</div><div class="reactions"><span onclick="chatReact(${i},'👍')">👍</span><span onclick="chatReact(${i},'❤️')">❤️</span><span onclick="chatReact(${i},'👎')">👎</span></div>`;
chat.appendChild(div);
});chat.scrollTop=chat.scrollHeight;
}
function sendMessage(){
let name=nameInput.value.trim();
let text=messageInput.value.trim();
if(!name||!text)return alert("Enter name & message");
messages.push({name,text,time:new Date().toLocaleTimeString()});
saveChat();renderChat();
messageInput.value="";nameInput.value="";
}
function chatMenu(i){
let action=prompt("edit/delete/info");
if(action==='edit'){let t=prompt("Edit",messages[i].text);if(t){messages[i].text=t;saveChat();renderChat();}}
if(action==='delete'){messages.splice(i,1);saveChat();renderChat();}
if(action==='info'){alert("Sent at: "+messages[i].time);}
}
function chatReact(i,e){messages[i].text+=" "+e;saveChat();renderChat();}

// Record audio
function recordAudio(){
navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
let mediaRecorder=new MediaRecorder(stream);
let chunks=[];
mediaRecorder.start();
mediaRecorder.ondataavailable=e=>chunks.push(e.data);
mediaRecorder.onstop=()=>{
let blob=new Blob(chunks);
let url=URL.createObjectURL(blob);
messages.push({name:nameInput.value||"Unknown",text:"Voice message",media:`<audio controls src='${url}'></audio>`,time:new Date().toLocaleTimeString()});
saveChat();renderChat();nameInput.value="";
}
setTimeout(()=>mediaRecorder.stop(),3000);
});
}

// Chat File Input
chatFileInput.addEventListener("change",()=>{
let file=chatFileInput.files[0];let reader=new FileReader();
reader.onload=e=>{
let tag=file.type.startsWith("video")?`<video controls src='${e.target.result}' class='statusVideo'></video>`:`<img src='${e.target.result}' class='statusImg'>`;
messages.push({name:nameInput.value||"Unknown",text:"Media",media:tag,time:new Date().toLocaleTimeString()});
saveChat();renderChat();nameInput.value="";
}
reader.readAsDataURL(file);
});

// Status Functions
function saveStatus(){localStorage.setItem("zeeStatus",JSON.stringify(statusData));}
function renderStatus(){
statusDisplay.innerHTML="";
statusData.forEach((s)=>{
let html=`<p>${s.text}</p><img src='${s.photo}' class='statusImg'>`;
if(s.music) html+=`<audio controls src='${s.music}' class='statusAudio'></audio>`;
html+=`<p>Likes: ${s.likes.length} | Viewed: ${s.viewed.length} | Time: ${s.time}</p>`;
statusDisplay.innerHTML+=html;
});
}
function postStatus(){
let text=statusText.value;
let file=statusFile.files[0];
let music=statusMusic.files[0];
if(!music)return alert("Please select music before posting status");
let reader1=new FileReader();
reader1.onload=e1=>{
let photoData=e1.target.result||"";
if(music){
let reader2=new FileReader();
reader2.onload=e2=>{
let musicData=e2.target.result;
statusData.push({text,text,photo:photoData,music:musicData,time:new Date().toLocaleString(),likes:[],viewed:[]});
saveStatus();renderStatus();
statusText.value="";statusFile.value="";statusMusic.value="";
picturesData.push(photoData);localStorage.setItem("zeePictures",JSON.stringify(picturesData));
renderPictures();
};
reader2.readAsDataURL(music);
}else{
statusData.push({text,text,photo:photoData,music:null,time:new Date().toLocaleString(),likes:[],viewed:[]});
saveStatus();renderStatus();
statusText.value="";statusFile.value="";statusMusic.value="";
picturesData.push(photoData);localStorage.setItem("zeePictures",JSON.stringify(picturesData));
renderPictures();
}
};
if(file) reader1.readAsDataURL(file);
else{statusData.push({text,text,photo:null,music:null,time:new Date().toLocaleString(),likes:[],viewed:[]});saveStatus();renderStatus();}
}

// Posts Functions
function savePosts(){localStorage.setItem("zeePosts",JSON.stringify(postsData));}
function renderPosts(){
postsDisplay.innerHTML="";
postsData.forEach((p,i)=>{
let html=`<div class='postBox'><p>${p.text}</p>`;
if(p.photo) html+=`<img src='${p.photo}' class='statusImg'>`;
html+=`<div class='likeCommentShare'><span onclick="likePost(${i})">Like (${p.likes.length})</span><span onclick="commentPost(${i})">Comment (${p.comments.length})</span><span onclick="alert('Shared!')">Share</span></div></div>`;
postsDisplay.innerHTML+=html;
});
}
function postPost(){
let text=postText.value;
let file=postFile.files[0];
let reader=new FileReader();
reader.onload=e=>{
let photo=e.target.result||null;
postsData.push({text,photo,likes:[],comments:[],time:new Date().toLocaleString()});
savePosts();renderPosts();
picturesData.push(photo);localStorage.setItem("zeePictures",JSON.stringify(picturesData));
renderPictures();
postText.value="";postFile.value="";
};
if(file) reader.readAsDataURL(file);
else {postsData.push({text,photo:null,likes:[],comments:[],time:new Date().toLocaleString()});savePosts();renderPosts();postText.value="";}
}

// Pictures
function renderPictures(){
picturesDisplay.innerHTML="";
picturesData.forEach(p=>{
picturesDisplay.innerHTML+=`<img src='${p}' class='pictureItem'>`;
});
}

// Happiness
function saveHappy(){localStorage.setItem("zeeHappy",JSON.stringify(happyData));}
function renderHappy(){
happyDisplay.innerHTML="";
happyData.forEach((h)=>{
let html=`<div class='postBox'><p>${h.text}</p>`;
if(h.photo) html+=`<img src='${h.photo}' class='statusImg'>`;
if(h.activity) html+=`<p>Activity: ${h.activity}</p>`;
html+=`<div class='commentBox'>Comments: ${h.comments.join(', ')}</div></div>`;
happyDisplay.innerHTML+=html;
});
}
function postHappy(){
let text=happyText.value;
let file=happyFile.files[0];
let activity=happyActivity.value;
let reader=new FileReader();
reader.onload=e=>{
let photo=e.target.result||null;
happyData.push({text,photo,activity,comments:[],time:new Date().toLocaleString()});
saveHappy();renderHappy();
happyText.value="";happyFile.value="";happyActivity.value="";
};
if(file) reader.readAsDataURL(file);
else {happyData.push({text,photo:null,activity,comments:[],time:new Date().toLocaleString()});saveHappy();renderHappy();}
}

// Initial Render
renderChat();renderStatus();renderPosts();renderPictures();renderHappy();
</script>

</body>
  </html>
