<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henicks Auto Photo Enhance</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}
header{
    padding:20px;
    font-size:22px;
    font-weight:bold;
}
.container{
    padding:15px;
}
canvas{
    max-width:100%;
    border-radius:15px;
    margin-top:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}
button,input{
    padding:10px 15px;
    margin:6px;
    border:none;
    border-radius:8px;
    font-size:14px;
}
button{
    background:#00e5ff;
    cursor:pointer;
}
button:hover{opacity:0.85;}
</style>
</head>

<body>

<header>Henicks Auto Photo Enhance</header>

<div class="container">

<input type="file" id="upload" accept="image/*"><br>

<button onclick="autoEnhance()">Auto Enhance</button>
<button onclick="blackWhite()">Black & White</button>
<button onclick="vivid()">Vivid Mode</button>
<button onclick="softSkin()">Soft Skin</button>
<button onclick="downloadImage()">Save Photo</button>

<br>
<canvas id="canvas"></canvas>

</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let original = new Image();

upload.addEventListener("change", function(e){
    const reader = new FileReader();
    reader.onload = function(event){
        original.onload = function(){
            canvas.width = original.width;
            canvas.height = original.height;
            ctx.drawImage(original,0,0);
        }
        original.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

function getPixels(){
    return ctx.getImageData(0,0,canvas.width,canvas.height);
}

function putPixels(data){
    ctx.putImageData(data,0,0);
}

function autoEnhance(){
    ctx.drawImage(original,0,0);
    let img = getPixels();
    let d = img.data;

    for(let i=0;i<d.length;i+=4){
        // Brightness balance
        d[i]+=8;
        d[i+1]+=8;
        d[i+2]+=8;

        // Contrast
        let contrast=1.15;
        d[i]=((d[i]-128)*contrast)+128;
        d[i+1]=((d[i+1]-128)*contrast)+128;
        d[i+2]=((d[i+2]-128)*contrast)+128;

        // Slight noise reduction
        d[i]=Math.min(255,Math.max(0,d[i]));
        d[i+1]=Math.min(255,Math.max(0,d[i+1]));
        d[i+2]=Math.min(255,Math.max(0,d[i+2]));
    }

    putPixels(img);

    // Sharpen
    canvas.style.filter="contrast(110%) saturate(105%)";
}

function blackWhite(){
    let img = getPixels();
    let d = img.data;

    for(let i=0;i<d.length;i+=4){
        let avg=(d[i]+d[i+1]+d[i+2])/3;
        d[i]=d[i+1]=d[i+2]=avg;
    }
    putPixels(img);
}

function vivid(){
    canvas.style.filter="contrast(125%) saturate(140%)";
}

function softSkin(){
    canvas.style.filter="blur(1px) contrast(105%)";
}

function downloadImage(){
    const link=document.createElement("a");
    link.download="henicks_enhanced.png";
    link.href=canvas.toDataURL("image/png");
    link.click();

    // Clear after save
    setTimeout(()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        upload.value="";
        canvas.style.filter="none";
    },500);
}
</script>

</body>
</html>
