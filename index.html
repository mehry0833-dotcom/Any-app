<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zee Life Guide</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
  header { background: #4CAF50; color: white; padding: 20px; text-align: center; font-size: 24px; }
  .container { padding: 20px; }
  .category, .item { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .back { margin: 10px 0; cursor: pointer; color: #4CAF50; font-weight: bold; }
</style>
</head>
<body>

<header>Zee Life Guide</header>
<div class="container" id="app"></div>

<script>
// Offline data
const data = {
  "Stories": [
    { "title": "The Honest Farmer", "text": "A farmer always worked hard and never lied. One day..." },
    { "title": "The Brave Child", "text": "A child faced fears to help others, teaching courage..." }
  ],
  "Guidance": [
    { "title": "Self-Care Basics", "text": "Eat well, sleep enough, and exercise daily. Small habits..." },
    { "title": "Caring for Loved Ones", "text": "Listen actively, be present, and help when needed..." }
  ],
  "Growth": [
    { "title": "Daily Growth Habits", "text": "Read 15 minutes, reflect on mistakes, plan your day..." }
  ],
  "WayOfLife": [
    { "title": "Living Simply", "text": "Focus on essentials, avoid clutter, and appreciate small joys..." }
  ]
};

// App container
const app = document.getElementById('app');

// Show categories
function showCategories() {
  app.innerHTML = '';
  for (let cat in data) {
    const div = document.createElement('div');
    div.className = 'category';
    div.textContent = cat;
    div.onclick = () => showItems(cat);
    app.appendChild(div);
  }
}

// Show items in category
function showItems(cat) {
  app.innerHTML = `<div class="back" onclick="showCategories()">← Back to Categories</div>`;
  data[cat].forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = item.title;
    div.onclick = () => showContent(cat, item.title);
    app.appendChild(div);
  });
}

// Show full content
function showContent(cat, title) {
  const item = data[cat].find(i => i.title === title);
  app.innerHTML = `<div class="back" onclick="showItems('${cat}')">← Back to ${cat}</div>
                   <h2>${item.title}</h2>
                   <p>${item.text}</p>`;
}

// Start app
showCategories();
</script>

</body>
</html>
