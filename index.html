<!DOCTYPE html>
<html>
<head>
  <title>Faith Stories</title>
  <script type="module">
    import { initializeApp } from "https:                                                    
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getDatabase, ref, set, push, child, get } from "https:                                                         

    const firebaseConfig = {
      apiKey: "AIzaSyCO_Pmu6QYJWbnNvRUYyRLvi6SLIfUrtHI",
      authDomain: "zeeworldyhi.firebaseapp.com",
      databaseURL: "https://zeeworldyhi-default-rtdb.firebaseio.com",
      projectId: "zeeworldyhi",
      storageBucket: "zeeworldyhi.firebasestorage.app",
      messagingSenderId: "154414924399",
      appId: "1:154414924399:web:31c3767fdbea93feba439a",
      measurementId: "G-XD5Z8T76EE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Auth functions
    document.getElementById('signup-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Signed up
          const user = userCredential.user;
          console.log(user);
        })
        .catch((error) => {
          console.error(error);
        });
    });

    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Signed in
          const user = userCredential.user;
          console.log(user);
        })
        .catch((error) => {
          console.error(error);
        });
    });

    // Story functions
    document.getElementById('add-story-btn').addEventListener('click', () => {
      const title = document.getElementById('story-title').value;
      const content = document.getElementById('story-content').value;
      const category = document.getElementById('story-category').value;
      const user = auth.currentUser;
      if (user) {
        const storyRef = ref(db, 'stories/' + user.uid);
        const newStoryRef = push(storyRef);
        set(newStoryRef, {
          title: title,
          content: content,
          category: category
        });
      }
    });
  </script>
</head>
<body>
  <h1>Faith Stories</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="signup-btn">Sign Up</button>
  <button id="login-btn">Login</button>
  <br>
  <input id="story-title" type="text" placeholder="Story Title">
  <textarea id="story-content" placeholder="Story Content"></textarea>
  <select id="story-category">
    <option value="sad">Sad Stories</option>
    <option value="funny">Funny Stories</option>
    <!-- Add more categories -->
  </select>
  <button id="add-story-btn">Add Story</button>
</body>
</html>
