<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Clean Photo Editor</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}
h1{margin-bottom:20px;}
button,input{
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
}
button{
    background:#00c853;
    color:white;
    cursor:pointer;
}
button:hover{
    opacity:0.9;
}
canvas{
    max-width:100%;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<h1>Ultra Clean Editor</h1>

<input type="file" id="upload" accept="image/*">
<br>
<button onclick="cleanImage()">Ultra Clean</button>
<button onclick="downloadImage()">Download</button>

<br>
<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById('upload');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let originalImage = new Image();

upload.addEventListener('change', function(e){
    const reader = new FileReader();
    reader.onload = function(event){
        originalImage.onload = function(){
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage,0,0);
        }
        originalImage.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

function cleanImage(){
    ctx.drawImage(originalImage,0,0);
    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let data = imageData.data;

    // Brightness + Contrast + Slight Sharpen
    let contrast = 1.1;   // 1 = normal
    let brightness = 10;  // add light

    for(let i=0;i<data.length;i+=4){
        // Brightness
        data[i] += brightness;     // Red
        data[i+1] += brightness;   // Green
        data[i+2] += brightness;   // Blue

        // Contrast
        data[i] = ((data[i]-128)*contrast)+128;
        data[i+1] = ((data[i+1]-128)*contrast)+128;
        data[i+2] = ((data[i+2]-128)*contrast)+128;
    }

    ctx.putImageData(imageData,0,0);

    // Extra sharpness using CSS filter (non-destructive)
    canvas.style.filter = "contrast(110%) saturate(105%)";
}

function downloadImage(){
    const link = document.createElement('a');
    link.download = "ultra_clean_photo.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
