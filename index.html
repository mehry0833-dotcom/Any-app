<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    .screen { display: none; padding: 20px; }
    .active { display: block; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #eee; padding: 10px; display: flex; justify-content: space-around; }
    nav button { padding: 10px; width: 45%; }
    #chat-log p, #status-log p { background: #f2f2f2; padding: 8px; border-radius: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div id="chats-screen" class="screen active">
    <h2>Chats</h2>
    <input id="name-input" placeholder="Your name">
    <input id="msg-input" placeholder="Message">
    <button onclick="sendMsg()">Send</button>
    <div id="chat-log"></div>
  </div>

  <div id="status-screen" class="screen">
    <h2>Status</h2>
    <input id="status-input" placeholder="What's up?">
    <button onclick="postStatus()">Post</button>
    <div id="status-log"></div>
  </div>

  <nav>
    <button onclick="showScreen('chats')">Chats</button>
    <button onclick="showScreen('status')">Status</button>
  </nav>

  <script>
    let name = '';

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`${screen}-screen`).classList.add('active');
    }

    function sendMsg() {
      const msg = document.getElementById('msg-input').value;
      const chatLog = document.getElementById('chat-log');
      chatLog.innerHTML += `<p>${name}: ${msg}</p>`;
      document.getElementById('msg-input').value = '';
    }

    function postStatus() {
      const status = document.getElementById('status-input').value;
      const statusLog = document.getElementById('status-log');
      statusLog.innerHTML += `<p>${status}</p>`;
      document.getElementById('status-input').value = '';
    }

    name = prompt('Enter name');
    document.getElementById('name-input').value = name;
  </script>

</body>
</html>
