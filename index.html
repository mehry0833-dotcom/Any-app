<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pro Note Pad · advanced</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script><script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;transition:background-color .2s,color .2s}:root{--bg-page:#f5f5f5;--bg-card:#fff;--text-primary:#1e1e1e;--text-secondary:#3a3a3a;--accent:#4a6fa5;--accent-light:#6b8cbc;--border:#d0d0d0;--line-color:rgba(70,130,200,0.15);--font-family:'Segoe UI',Roboto,system-ui,sans-serif;--font-style:normal;--font-weight:400;--editor-bg:#fffef7}body.dark-mode{--bg-page:#1e1e1e;--bg-card:#2d2d2d;--text-primary:#eaeaea;--text-secondary:#bbb;--accent:#7b9fd0;--accent-light:#9bb8e6;--border:#444;--line-color:rgba(200,200,240,0.15);--editor-bg:#2b2b2b}body.red-theme{--accent:#b33c2f;--accent-light:#c96b60;--line-color:rgba(200,80,70,0.15)}body.green-theme{--accent:#2f7d4f;--accent-light:#56a176;--line-color:rgba(50,150,100,0.15)}body.blue-theme{--accent:#2a5f8a;--accent-light:#4a7ca5;--line-color:rgba(40,100,180,0.15)}body.grey-theme{--accent:#5e5e5e;--accent-light:#7e7e7e;--line-color:rgba(120,120,120,0.15)}body{background-color:var(--bg-page);color:var(--text-primary);font-family:var(--font-family);font-style:var(--font-style);font-weight:var(--font-weight);margin:0;min-height:100vh;display:flex;justify-content:center}#app{width:100%;max-width:800px;background:var(--bg-page);display:flex;flex-direction:column;min-height:100vh}.screen{display:none;flex:1;padding:1rem;flex-direction:column}.screen.active{display:flex}.app-header{display:flex;justify-content:space-between;align-items:center;padding:.75rem .5rem;border-bottom:1px solid var(--border)}.app-header h1{font-size:1.6rem;font-weight:300;color:var(--accent)}.header-actions{display:flex;gap:.8rem}.header-actions i{font-size:1.4rem;color:var(--accent);cursor:pointer}.notes-grid{display:flex;flex-direction:column;gap:.75rem;margin-top:1rem}.note-card{background:var(--bg-card);padding:1rem 1.2rem;border-radius:16px;border-left:6px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;display:flex;flex-direction:column;gap:.5rem;transition:transform .1s}.note-card:hover{transform:translateX(4px)}.note-card-row{display:flex;justify-content:space-between;align-items:center;width:100%}.note-card-title{font-size:1.2rem;font-weight:500;color:var(--text-primary);word-break:break-word}.note-card-pin{color:var(--accent-light);background:0 0;border:none;font-size:1.3rem;cursor:pointer;padding:0 .3rem}.note-card-pin.pinned{color:var(--accent)}.note-tags{display:flex;flex-wrap:wrap;gap:.4rem}.tag{background:var(--accent-light);color:#fff;padding:.2rem .8rem;border-radius:30px;font-size:.75rem;cursor:pointer}.delete-note{color:var(--accent-light);background:0 0;border:none;font-size:1.3rem;cursor:pointer}.search-bar{margin:1rem 0;display:flex;gap:.5rem}.search-bar input{flex:1;padding:.7rem 1rem;border-radius:40px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary)}.title-input{width:100%;font-size:1.8rem;padding:.75rem .5rem;border:none;background:0 0;color:var(--text-primary);border-bottom:2px dashed var(--accent);margin-bottom:1rem;font-weight:500;outline:0}.tags-input{width:100%;padding:.5rem;border-radius:30px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);margin-bottom:1rem}.notebook-textarea{width:100%;flex:1;min-height:50vh;background:var(--editor-bg);border:none;resize:vertical;padding:1rem 1.5rem;line-height:2rem;font-size:1.1rem;color:var(--text-primary);background-image:repeating-linear-gradient(transparent,transparent 1.9rem,var(--line-color)2rem);background-attachment:local;font-family:inherit;font-style:inherit;font-weight:inherit;outline:0;border-radius:8px}.editor-footer{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;color:var(--text-secondary);font-size:.9rem}.grammar-warnings{background:var(--bg-card);border-radius:20px;padding:.5rem 1rem;margin:.5rem 0;font-size:.9rem;color:#c44545}.tts-panel{background:var(--bg-card);border-radius:28px;padding:1rem;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:.5rem 0 1rem;border:1px solid var(--border)}.detail-content{background:var(--bg-card);border-radius:20px;padding:1.5rem;margin:1rem 0;white-space:pre-wrap;word-break:break-word;font-size:1.1rem;line-height:1.6}.meta-info{color:var(--text-secondary);font-size:.9rem;margin-bottom:.5rem}.backlinks-section{margin-top:1.5rem;padding:1rem;background:var(--bg-card);border-radius:20px}.backlink-item{cursor:pointer;color:var(--accent);text-decoration:underline;margin:.2rem 0}.streak-badge{background:var(--accent);color:#fff;border-radius:40px;padding:.2rem 1rem;font-size:.8rem}.camera-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:1000}.camera-modal.active{display:flex}.camera-box{background:var(--bg-card);padding:1rem;border-radius:30px;max-width:90%}video,canvas{max-width:100%;border-radius:20px}.camera-actions{display:flex;gap:1rem;margin-top:1rem;justify-content:center}.settings-panel{background:var(--bg-card);border-radius:30px;padding:1.5rem;margin-top:1rem}.btn{background:var(--accent);border:none;color:#fff;padding:.7rem 1.5rem;border-radius:40px;font-weight:600;cursor:pointer}.btn-outline{background:0 0;border:2px solid var(--accent);color:var(--accent)}</style></head><body><div id="app"><div id="list-screen" class="screen active"><div class="app-header"><h1>Pro Note Pad</h1><div class="header-actions"><span class="streak-badge" id="streakDisplay">🔥 0</span><i class="fas fa-search" id="toggle-search"></i><i class="fas fa-cog" id="open-settings"></i><i class="fas fa-palette" id="open-theme-picker"></i><i class="fas fa-lock" id="toggle-password-lock"></i></div></div><div class="search-bar" id="searchBar" style="display:none"><input type="text" id="searchInput" placeholder="Search notes..."><i class="fas fa-times" id="clearSearch" style="cursor:pointer;align-self:center"></i></div><div id="notes-container" class="notes-grid"></div><div class="pen-bottom" id="new-note-pen"><i class="fas fa-pen"></i></div></div><div id="editor-screen" class="screen"><div class="app-header"><i class="fas fa-arrow-left" id="back-from-editor" style="font-size:1.8rem;cursor:pointer"></i><h2 style="flex:1;margin-left:1rem">Edit note</h2><div class="header-actions"><i class="fas fa-microphone-alt" id="tts-toggle-editor"></i><i class="fas fa-camera" id="camera-open-editor"></i></div></div><input type="text" id="note-title" class="title-input" placeholder="Title (auto-generated if empty)"><input type="text" id="note-tags" class="tags-input" placeholder="Tags (comma separated)"><textarea id="note-content" class="notebook-textarea" placeholder="Write your note..."></textarea><div class="editor-footer"><span id="wordCount">0 words</span><i class="fas fa-check-double" id="grammarCheckBtn" title="Check repeated words"></i></div><div id="grammarWarnings" class="grammar-warnings" style="display:none"></div><div id="tts-controls" class="tts-panel" style="display:none"><i class="fas fa-play" id="tts-play"></i><i class="fas fa-pause" id="tts-pause"></i><i class="fas fa-stop" id="tts-stop"></i><select id="tts-speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="1.8">Fast</option></select><select id="tts-voice"><option value="0">Voice 1</option><option value="1">Voice 2</option><option value="2">Voice 3</option><option value="3">Voice 4</option><option value="4">Voice 5</option></select></div></div><div id="detail-screen" class="screen"><div class="app-header"><i class="fas fa-arrow-left" id="back-from-detail" style="font-size:1.8rem;cursor:pointer"></i><h3 id="detail-title" style="flex:1;margin-left:1rem"></h3><i class="fas fa-trash-alt" id="delete-current-detail" style="color:var(--accent);font-size:1.5rem"></i></div><div class="meta-info" id="detail-datetime"></div><div id="detail-tags" class="note-tags" style="margin-bottom:1rem"></div><div id="detail-fulltext" class="detail-content"></div><div id="backlinks-container" class="backlinks-section"><strong>Linked from:</strong><div id="backlinks-list"></div></div></div><div id="settings-modal" style="display:none;background:var(--bg-card);padding:1.5rem;border-radius:32px;margin:1rem"><h3>Firebase config</h3><div class="firebase-config"><input type="text" id="fb-apiKey" placeholder="apiKey"><br><input type="text" id="fb-authDomain" placeholder="authDomain"><br><input type="text" id="fb-databaseURL" placeholder="databaseURL"><br><input type="text" id="fb-projectId" placeholder="projectId"><br><input type="text" id="fb-storageBucket" placeholder="storageBucket"><br><input type="text" id="fb-messagingSenderId" placeholder="messagingSenderId"><br><input type="text" id="fb-appId" placeholder="appId"><br></div><button class="btn" id="save-firebase-config">Connect & save</button><button class="btn-outline" id="export-notes">Export all as JSON</button><button class="btn-outline" id="import-notes">Import from JSON</button><h3 style="margin-top:2rem">Theme & colors</h3><div class="settings-row"><button class="btn-outline" id="theme-light">Light</button><button class="btn-outline" id="theme-dark">Dark</button><button class="btn-outline" id="theme-red">Red</button><button class="btn-outline" id="theme-green">Green</button><button class="btn-outline" id="theme-blue">Blue</button><button class="btn-outline" id="theme-grey">Grey</button></div><button class="btn" id="close-settings">Close</button></div><div id="cameraModal" class="camera-modal"><div class="camera-box"><video id="video" autoplay></video><canvas id="canvas" style="display:none"></canvas><div class="camera-actions"><button class="btn" id="captureBtn">Capture</button><button class="btn" id="transcribeBtn" disabled>Transcribe</button><button class="btn-outline" id="closeCamera">Cancel</button></div></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getDatabase,ref,onValue,push,update,remove,set}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';let app,database,notesRef;let currentNotes=[];let currentEditId=null;let selectedVoiceIndex=0;let speechSynth=window.speechSynthesis;let utterance=null;let useFirebase=false;let streak=0,lastEditDate='';function loadStreak(){const saved=localStorage.getItem('proNotePad_streak');if(saved){const{count,date}=JSON.parse(saved);const today=new Date().toDateString();if(date===today)streak=count;else if(new Date(date)===new Date(today)-1)streak=count+1;else streak=0;}else streak=0;updateStreakDisplay();}function updateStreak(){const today=new Date().toDateString();if(lastEditDate!==today){if(lastEditDate===new Date(new Date().setDate(new Date().getDate()-1)).toDateString())streak++;else streak=1;lastEditDate=today;localStorage.setItem('proNotePad_streak',JSON.stringify({count:streak,date:today}));}updateStreakDisplay();}function updateStreakDisplay(){document.getElementById('streakDisplay').innerText=`🔥 ${streak}`;}function loadNotesFromLocal(){const data=localStorage.getItem('proNotePad_notes');if(data){try{currentNotes=JSON.parse(data);}catch(e){currentNotes=[];}}else currentNotes=[];renderNoteCards();}function saveNotesToLocal(){localStorage.setItem('proNotePad_notes',JSON.stringify(currentNotes));}function updateNote(id,updates){if(useFirebase&&database){const noteRef=ref(database,`notes/${id}`);update(noteRef,{...updates,updatedAt:Date.now()});}else{const index=currentNotes.findIndex(n=>n.id===id);if(index!==-1){currentNotes[index]={...currentNotes[index],...updates,updatedAt:Date.now()};saveNotesToLocal();renderNoteCards();}}updateStreak();}function deleteNote(id){if(useFirebase&&database){const noteRef=ref(database,`notes/${id}`);remove(noteRef);}else{currentNotes=currentNotes.filter(n=>n.id!==id);saveNotesToLocal();renderNoteCards();}if(currentEditId===id)backToList();}function initFirebase(config){try{app=initializeApp(config);database=getDatabase(app);notesRef=ref(database,'notes');useFirebase=true;onValue(notesRef,(snapshot)=>{const data=snapshot.val();currentNotes=[];if(data){currentNotes=Object.entries(data).map(([id,val])=>({id,...val}));}renderNoteCards();});localStorage.setItem('proNotePad_firebase',JSON.stringify(config));}catch(e){alert('Firebase failed, using local storage');useFirebase=false;loadNotesFromLocal();}}function loadFirebaseConfig(){const cfg=localStorage.getItem('proNotePad_firebase');if(cfg){try{const config=JSON.parse(cfg);Object.keys(config).forEach(k=>{const el=document.getElementById(`fb-${k}`);if(el)el.value=config[k];});initFirebase(config);}catch(e){useFirebase=false;loadNotesFromLocal();}}else{useFirebase=false;loadNotesFromLocal();}}function renderNoteCards(){const container=document.getElementById('notes-container');const searchTerm=document.getElementById('searchInput').value.toLowerCase();let filtered=currentNotes.filter(n=>{if(!searchTerm)return true;return(n.title&&n.title.toLowerCase().includes(searchTerm))||(n.content&&n.content.toLowerCase().includes(searchTerm))||(n.tags&&n.tags.some(t=>t.toLowerCase().includes(searchTerm)));});filtered.sort((a,b)=>{if(a.pinned&&!b.pinned)return-1;if(!a.pinned&&b.pinned)return 1;if(a.pinned&&b.pinned)return(b.pinnedAt||0)-(a.pinnedAt||0);return(b.updatedAt||0)-(a.updatedAt||0);});container.innerHTML='';filtered.forEach(n=>{const card=document.createElement('div');card.className='note-card';card.dataset.id=n.id;const titleDiv=document.createElement('div');titleDiv.className='note-card-row';titleDiv.innerHTML=`<span class="note-card-title">${escapeHtml(n.title||'Untitled')}</span><i class="fas fa-thumbtack note-card-pin ${n.pinned?'pinned':''}" data-id="${n.id}" style="cursor:pointer;"></i>`;const tagsDiv=document.createElement('div');tagsDiv.className='note-tags';if(n.tags&&Array.isArray(n.tags)){n.tags.forEach(t=>{const span=document.createElement('span');span.className='tag';span.innerText=t;span.addEventListener('click',(e)=>{e.stopPropagation();document.getElementById('searchInput').value=t;renderNoteCards();});tagsDiv.appendChild(span);});}const deleteBtn=document.createElement('button');deleteBtn.className='delete-note';deleteBtn.innerHTML='<i class="fas fa-times"></i>';deleteBtn.dataset.id=n.id;card.appendChild(titleDiv);card.appendChild(tagsDiv);card.appendChild(deleteBtn);card.querySelector('.note-card-title').addEventListener('click',()=>openDetailView(n.id));card.querySelector('.note-card-pin').addEventListener('click',(e)=>{e.stopPropagation();togglePin(n.id);});deleteBtn.addEventListener('click',(e)=>{e.stopPropagation();if(confirm('Delete?'))deleteNote(n.id);});container.appendChild(card);});}function togglePin(id){const note=currentNotes.find(n=>n.id===id);if(!note)return;const pinned=!note.pinned;updateNote(id,{pinned,pinnedAt:pinned?Date.now():null});}function extractLinks(content){const regex=/\[\[(.*?)\]\]/g;const titles=new Set();let match;while((match=regex.exec(content))!==null){titles.add(match[1].trim());}return Array.from(titles);}function updateBacklinks(noteId,newContent){const linkedTitles=extractLinks(newContent);const linkedIds=currentNotes.filter(n=>linkedTitles.some(t=>n.title&&n.title.toLowerCase()===t.toLowerCase())).map(n=>n.id);updateNote(noteId,{links:linkedIds});}function showBacklinks(noteId){const container=document.getElementById('backlinks-list');container.innerHTML='';const linkedFrom=currentNotes.filter(n=>n.links&&n.links.includes(noteId));if(linkedFrom.length===0)container.innerText='No backlinks';else{linkedFrom.forEach(n=>{const div=document.createElement('div');div.className='backlink-item';div.innerText=n.title||'Untitled';div.addEventListener('click',()=>openDetailView(n.id));container.appendChild(div);});}}function updateWordCount(){const text=document.getElementById('note-content').value;const words=text.trim()?text.trim().split(/\s+/).length:0;document.getElementById('wordCount').innerText=words+' words';}function checkGrammar(){const text=document.getElementById('note-content').value;const words=text.toLowerCase().split(/\s+/);const repeats=[];for(let i=0;i<words.length-1;i++){if(words[i]===words[i+1]&&words[i].length>2){repeats.push(`Repeated word: "${words[i]}" at position ${i+1}`);}}const warningsDiv=document.getElementById('grammarWarnings');if(repeats.length){warningsDiv.style.display='block';warningsDiv.innerHTML=repeats.map(r=>`<div>⚠️ ${r}</div>`).join('');}else{warningsDiv.style.display='none';}}function generateTitleFromContent(text){if(!text)return'Empty note';const firstLine=text.split('\n')[0].trim();if(firstLine.length>30)return firstLine.substring(0,30)+'…';if(firstLine.length>0)return firstLine;return'Note '+new Date().toLocaleString();}function saveCurrentNote(){if(!currentEditId)return;let title=document.getElementById('note-title').value.trim();const content=document.getElementById('note-content').value;if(!title)title=generateTitleFromContent(content);const tagsInput=document.getElementById('note-tags').value;const tags=tagsInput.split(',').map(t=>t.trim()).filter(t=>t);const updates={title,content,tags,updatedAt:Date.now()};const linkedTitles=extractLinks(content);const linkedIds=currentNotes.filter(n=>linkedTitles.some(t=>n.title&&n.title.toLowerCase()===t.toLowerCase())).map(n=>n.id);updates.links=linkedIds;if(useFirebase&&database){const noteRef=ref(database,`notes/${currentEditId}`);update(noteRef,updates);}else{const idx=currentNotes.findIndex(n=>n.id===currentEditId);if(idx!==-1){currentNotes[idx]={...currentNotes[idx],...updates};saveNotesToLocal();renderNoteCards();}}updateStreak();}function exportNotes(){const dataStr=JSON.stringify(currentNotes,null,2);const blob=new Blob([dataStr],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pro-notepad-backup.json';a.click();}function importNotes(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{const imported=JSON.parse(e.target.result);if(useFirebase&&database){imported.forEach(n=>{const{id,...rest}=n;const newRef=push(notesRef);set(newRef,rest);});}else{currentNotes=imported;saveNotesToLocal();renderNoteCards();}}catch(ex){alert('Invalid JSON');}};reader.readAsText(file);}function backToList(){document.getElementById('list-screen').classList.add('active');document.getElementById('editor-screen').classList.remove('active');document.getElementById('detail-screen').classList.remove('active');currentEditId=null;}function openDetailView(id){const note=currentNotes.find(n=>n.id===id);if(!note)return;currentEditId=id;document.getElementById('detail-title').innerText=note.title||'Untitled';document.getElementById('detail-fulltext').innerText=note.content||'';const d=new Date(note.updatedAt||note.createdAt||Date.now());document.getElementById('detail-datetime').innerText=`Last edited: ${d.toLocaleString()}`;const tagsDiv=document.getElementById('detail-tags');tagsDiv.innerHTML='';if(note.tags&&Array.isArray(note.tags)){note.tags.forEach(t=>{const span=document.createElement('span');span.className='tag';span.innerText=t;tagsDiv.appendChild(span);});}showBacklinks(id);document.getElementById('list-screen').classList.remove('active');document.getElementById('detail-screen').classList.add('active');}function createNewNote(){const newNote={title:'',content:'',tags:[],createdAt:Date.now(),updatedAt:Date.now(),pinned:false,links:[]};if(useFirebase&&database){const newRef=push(notesRef);set(newRef,newN
